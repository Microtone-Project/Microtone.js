# Cloudflare configuration for microtone.cc — the Worker `microtone`.
#
# The site is static files (microtone-worker/, plus the shared core/ it links
# to) served straight from Cloudflare's asset store; the Worker below only runs
# for a request that matches no file, which in practice means the
# online-projects API under /api/online. This file sits at the repository root
# because the Workers build runs here: its deploy command,
#     npx wrangler@4.120.0 deploy --compatibility-date 2026-07-10
# picks it up for the name, the entry point, the bindings, the build step and
# the asset directory. The branch "version command" (`npx wrangler versions
# upload`) reads everything from here too.
#
# The asset directory is a STAGED COPY, build/microtone-worker, made by the
# [build] command below before every deploy, upload and `wrangler dev`.
# microtone-worker/ reaches core/ through a symlink, and the asset upload does
# not reliably follow one — so a deploy command that still says
# `--assets ./microtone-worker/` overrides this and ships the site WITHOUT its
# engine. Do not put that flag back.
#
# No secrets in this file: it is committed. SceneID's two — SCENEID_CLIENT_ID
# and SCENEID_CLIENT_SECRET — are Worker secrets:
#     npx wrangler secret put SCENEID_CLIENT_SECRET
# (or the dashboard: Workers → microtone → Settings → Variables and Secrets),
# and .dev.vars NEXT TO THIS FILE for local runs (gitignored). Sign-in switches
# itself on once both are present. SceneID only returns people to REGISTERED
# callbacks: <origin>/api/online/auth/callback for every origin that signs in.
#
# R2 and D1 need no credentials at all — a binding IS the permission, granted
# to this Worker and nothing else. Do not create R2 API tokens for the online
# projects; nothing uses the S3-compatible endpoint.
#
# The D1 schema: npx wrangler d1 migrations apply microtone-online --remote
#
# Local run, from the repository root (site + API, with a local D1 and R2):
#     npx wrangler d1 migrations apply microtone-online --local
#     npx wrangler dev --port 8788
# In .dev.vars, either the SceneID pair (http://localhost:8788 is registered)
# or ONLINE_DEV_LOGIN=1 for a test sign-in that needs no SceneID at all.

name = "microtone"
main = "microtone-worker/server/worker.js"
compatibility_date = "2026-07-10"

[build]
command = "node tools/stage-site.js microtone-worker build/microtone-worker"
watch_dir = ["core", "microtone-worker/src", "microtone-worker/css", "microtone-worker/assets", "microtone-worker/server"]

[assets]
directory = "build/microtone-worker"

[[d1_databases]]
binding = "ONLINE_DB"
database_name = "microtone-online"
database_id = "270dc7be-bf3d-4ca9-8da1-9e431bcba76d"
migrations_dir = "microtone-worker/migrations"

[[r2_buckets]]
binding = "ONLINE_BUCKET"
bucket_name = "microtone-online-storage"
