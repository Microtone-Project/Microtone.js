<!doctype html><meta charset="utf-8"><title>Context menu second row: the column tools</title>
<pre id="out">running…</pre>
<img src="/hang" hidden>
<iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1200px;height:700px"></iframe>
<script type="module">
// The right-click menu's second row: which tools a column offers, that a
// multi-column band drops the effect palette, and that every one of them acts
// on the SELECTED BLOCK (which on the Timeline crosses patterns) in one undo
// step.
const out = document.getElementById("out");
const log = (s) => { out.textContent += "\n" + s; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let fails = 0;
const check = (ok, name, extra = "") => { if (!ok) fails++; log(`${ok ? "PASS" : "FAIL"} ${name}${extra ? " — " + extra : ""}`); };

window.addEventListener("error", (e) => log("ERROR " + e.message));
(async () => {
 try {
  const app = document.getElementById("app");
  await new Promise((r) => app.addEventListener("load", r));
  const win = app.contentWindow;
  for (let i = 0; i < 200 && !win.__microtone; i++) await sleep(50);
  const M = win.__microtone;
  if (!M) { log("no __microtone"); return; }
  for (let i = 0; i < 200 && !M.store.song; i++) await sleep(50);
  const doc = win.document;
  const { store, timeline, patternView } = M;
  const E = await import("../../src/ui/edit.js");
  const { QUICK_FX } = await import("../../src/ui/blocktools.js");

  const canvas = doc.getElementById("timeline");
  const menuAt = async (x, y) => {
    const r = canvas.getBoundingClientRect();
    canvas.dispatchEvent(new win.MouseEvent("contextmenu", {
      clientX: r.left + x, clientY: r.top + y, bubbles: true, cancelable: true, button: 2 }));
    let dlg = null;
    for (let i = 0; i < 60 && !dlg; i++) { dlg = doc.querySelector("dialog.ctxmenu"); await sleep(20); }
    return dlg;
  };
  const rows = (dlg) => [...dlg.querySelectorAll(".ctx-row")]
    .map((r) => [...r.querySelectorAll(".ctx-cell")].map((c) => c.dataset.id));
  const cell = (dlg, id) => dlg.querySelector(`.ctx-cell[data-id="${id}"]`);
  const dismiss = async (dlg) => { dlg?.dispatchEvent(new win.Event("cancel", { cancelable: true })); await sleep(40); };

  const CHAR_W = 7.9, GUTTER = 76, ROW_H = 16;
  const colW = timeline.colWFor(0);
  const charX = (ch, c) => GUTTER + (ch - timeline.scrollCh) * colW + 2 + c * CHAR_W + 1;
  const rowY = (r) => timeline.headerH() + (r - Math.floor(timeline.scrollRow)) * ROW_H + 8;
  // Character offsets into a narrow cell: note 0-4, inst 5-7, vol 8-11,
  // pan 12-15, fx 16-20 (edit.js COL_CHAR_RANGE).
  const COL_X = { note: 1, inst: 6, vol: 9, pan: 13, fx: 17 };

  /** Fill a showModal dialog and press OK. */
  const runModal = async (values) => {
    let m = null;
    for (let i = 0; i < 100 && !m; i++) { m = doc.querySelector("dialog.modal"); await sleep(30); }
    if (!m) return false;
    for (const [name, v] of Object.entries(values)) {
      const input = m.querySelector(`[name="${name}"]`);
      if (!input) continue;
      if (input.type === "checkbox") input.checked = !!v;
      else input.value = String(v);
      // Selects answer to `change`, which is also what modal.js's enabledWhen
      // listens for — an `input` alone leaves a dependent field stale.
      input.dispatchEvent(new win.Event("input", { bubbles: true }));
      input.dispatchEvent(new win.Event("change", { bubbles: true }));
    }
    m.querySelector(".modal-buttons button").click();
    await sleep(140);
    return true;
  };

  // ── 1. one column → that column's tool ─────────────────────────────────
  timeline.sel = null;
  let dlg = await menuAt(charX(0, COL_X.note), rowY(0));
  check(rows(dlg).length === 2, "the menu now has two rows", String(rows(dlg).length));
  check(rows(dlg)[1].join() === "transpose,findchange", "note column → Transpose (no block, so no Interpolate)", rows(dlg)[1].join());
  await dismiss(dlg);

  dlg = await menuAt(charX(0, COL_X.inst), rowY(0));
  check(rows(dlg)[1].join() === "instrument,findchange", "instrument column → Instrument", rows(dlg)[1].join());
  await dismiss(dlg);

  // With a BLOCK selected, Interpolate joins every column it can fill — but
  // never the instrument column, where nothing sits halfway between 3 and 7.
  timeline.sel = { aRow: 0, aCh: 0, aSub: E.SUB_NOTE, row: 3, ch: 0, sub: E.SUB_NOTE };
  dlg = await menuAt(charX(0, COL_X.note), rowY(1));
  check(rows(dlg)[1].join() === "transpose,interpolate,findchange",
    "a note block → Transpose and Interpolate", rows(dlg)[1].join());
  await dismiss(dlg);

  timeline.sel = { aRow: 0, aCh: 0, aSub: E.SUB_INST, row: 3, ch: 0, sub: E.SUB_INST };
  dlg = await menuAt(charX(0, COL_X.inst), rowY(1));
  check(rows(dlg)[1].join() === "instrument,findchange",
    "an instrument block → no Interpolate", rows(dlg)[1].join());
  await dismiss(dlg);
  timeline.sel = null;

  dlg = await menuAt(charX(0, COL_X.vol), rowY(0));
  check(rows(dlg)[1].join() === "volume,findchange", "volume column → Volume", rows(dlg)[1].join());
  await dismiss(dlg);

  dlg = await menuAt(charX(0, COL_X.pan), rowY(0));
  check(rows(dlg)[1].join() === "pan,findchange", "panning column → Panning", rows(dlg)[1].join());
  await dismiss(dlg);

  // ── 2. the effect column → the quick effect palette ────────────────────
  dlg = await menuAt(charX(0, COL_X.fx), rowY(0));
  const fxIds = rows(dlg)[1];
  check(fxIds.length === QUICK_FX.length + 1 &&
    fxIds.slice(0, -1).every((id) => id.startsWith("fx:")),
    "effect column → the quick effect palette", fxIds.join());
  check(fxIds.slice(0, -1).join() === QUICK_FX.map((n) => "fx:" + n).join(),
    "…in the surveyed order (most-used first)", fxIds.join());
  check(fxIds[fxIds.length - 1] === "findchange",
    "…with Find & Change closing the row here too (item 132)", fxIds.join());
  const gCell = cell(dlg, "fx:16"); // 0x10 = G, tone portamento
  check(!!gCell && gCell.querySelector(".ctx-name").textContent === "Tone portamento",
    "…each named after the effect", gCell?.querySelector(".ctx-name")?.textContent);
  check(!!gCell?.querySelector("svg text"), "…and drawn as its own opcode letter");
  await dismiss(dlg);

  // ── 3. a multi-column band offers each tool but NOT the effects ────────
  timeline.sel = { aRow: 0, aCh: 0, aSub: E.SUB_PAN, row: 3, ch: 0, sub: E.SUB_FX_ARG };
  dlg = await menuAt(charX(0, COL_X.pan), rowY(1));
  check(rows(dlg)[1].join() === "pan,findchange",
    "pan + effects selected → only the pan tool, and no Interpolate", rows(dlg)[1].join());
  await dismiss(dlg);

  // …but volume AND panning together is the one band that DOES offer it.
  timeline.sel = { aRow: 0, aCh: 0, aSub: E.SUB_VOL, row: 3, ch: 0, sub: E.SUB_PAN };
  dlg = await menuAt(charX(0, COL_X.vol), rowY(1));
  check(rows(dlg)[1].join() === "volume,pan,interpolate,findchange",
    "volume + panning → one Interpolate for the pair", rows(dlg)[1].join());
  await dismiss(dlg);

  timeline.sel = { aRow: 0, aCh: 0, aSub: E.SUB_NOTE, row: 3, ch: 0, sub: E.SUB_FX_ARG };
  dlg = await menuAt(charX(0, COL_X.note), rowY(1));
  check(rows(dlg)[1].join() === "transpose,instrument,volume,pan,findchange",
    "the whole cell selected → all four, effects and Interpolate excluded", rows(dlg)[1].join());
  await dismiss(dlg);

  // ── 4. the tools act on the BLOCK, not the whole pattern ───────────────
  const noteAt = (r, c) => timeline.cellAt(r, c)?.cell.note;
  const volAt = (r, c) => timeline.cellAt(r, c)?.cell.volume;
  const instAt = (r, c) => timeline.cellAt(r, c)?.cell.instrment;

  // Give rows 0..1 of channel 0 known values, and leave row 4 as the control.
  const { setCellOp } = await import("../../src/doc/ops.js");
  const t0 = timeline.cellAt(0, 0), t1 = timeline.cellAt(1, 0), t4 = timeline.cellAt(4, 0);
  check(!!t0 && !!t1 && !!t4, "found three cells on channel 0 to work with");
  for (const [tgt, note] of [[t0, 0x5000], [t1, 0x5100], [t4, 0x5200]]) {
    store.undo.apply(setCellOp(0, tgt.pat, tgt.rowInCue,
      { note, instrment: 3, volume: 20, volumeEff: 0, pan: 40, panEff: 0, effect: 0, effectArg: 0 }));
  }
  await sleep(60);
  const depth0 = store.undo.undoStack.length;

  timeline.sel = { aRow: 0, aCh: 0, aSub: E.SUB_VOL, row: 1, ch: 0, sub: E.SUB_VOL };
  dlg = await menuAt(charX(0, COL_X.vol), rowY(0));
  cell(dlg, "volume").click();
  check(await runModal({ mult: 2, add: 0 }), "the Volume dialog opened from the menu");
  check(volAt(0, 0) === 40 && volAt(1, 0) === 40, "volume ×2 hit both selected rows",
    `${volAt(0, 0)}/${volAt(1, 0)}`);
  check(volAt(4, 0) === 20, "…and NOT the row outside the block", String(volAt(4, 0)));
  check(store.undo.undoStack.length === depth0 + 1, "…in one undo step");
  store.undo.undo();
  await sleep(60);
  check(volAt(0, 0) === 20, "…which undoes");

  timeline.sel = { aRow: 0, aCh: 0, aSub: E.SUB_NOTE, row: 1, ch: 0, sub: E.SUB_NOTE };
  dlg = await menuAt(charX(0, COL_X.note), rowY(0));
  cell(dlg, "transpose").click();
  check(await runModal({ fine: 1, coarse: 0 }), "the Transpose dialog opened from the menu");
  check(noteAt(0, 0) > 0x5000 && noteAt(1, 0) > 0x5100, "transpose moved both selected notes",
    `$${noteAt(0, 0).toString(16)}/$${noteAt(1, 0).toString(16)}`);
  check(noteAt(4, 0) === 0x5200, "…and left the row outside the block alone",
    `$${noteAt(4, 0).toString(16)}`);
  store.undo.undo();
  await sleep(60);
  check(noteAt(0, 0) === 0x5000, "…which undoes");

  timeline.sel = { aRow: 0, aCh: 0, aSub: E.SUB_INST, row: 1, ch: 0, sub: E.SUB_INST };
  dlg = await menuAt(charX(0, COL_X.inst), rowY(0));
  cell(dlg, "instrument").click();
  check(await runModal({ from: "3", to: "7" }), "the Instrument dialog opened from the menu");
  check(instAt(0, 0) === 7 && instAt(1, 0) === 7, "instrument 3 → 7 across the block",
    `${instAt(0, 0)}/${instAt(1, 0)}`);
  check(instAt(4, 0) === 3, "…and not outside it", String(instAt(4, 0)));
  store.undo.undo();
  await sleep(60);

  // ── 5. a quick effect writes straight through, keeping the argument ────
  const t0cell = () => timeline.cellAt(0, 0).cell;
  store.undo.apply(setCellOp(0, t0.pat, t0.rowInCue, { effect: 0, effectArg: 0x1234 }));
  await sleep(60);
  timeline.sel = { aRow: 0, aCh: 0, aSub: E.SUB_FX_OP, row: 1, ch: 0, sub: E.SUB_FX_ARG };
  dlg = await menuAt(charX(0, COL_X.fx), rowY(0));
  cell(dlg, "fx:16").click();
  await sleep(120);
  check(t0cell().effect === 0x10, "picking G writes the opcode", String(t0cell().effect));
  check(t0cell().effectArg === 0x1234, "…and keeps the argument that was there",
    "$" + t0cell().effectArg.toString(16));
  check(timeline.cellAt(1, 0).cell.effect === 0x10, "…across the whole selected block");
  store.undo.undo();
  await sleep(60);
  check(t0cell().effect === 0, "…and undoes");
  store.undo.undo();
  await sleep(60);

  // ── 6. no selection → the tool acts on the clicked cell only ───────────
  timeline.sel = null;
  dlg = await menuAt(charX(0, COL_X.vol), rowY(1));
  cell(dlg, "volume").click();
  check(await runModal({ mult: 1, add: 5 }), "the Volume dialog opened with no selection");
  check(volAt(1, 0) === 25, "…and moved only the clicked cell", String(volAt(1, 0)));
  check(volAt(0, 0) === 20, "…leaving its neighbour alone", String(volAt(0, 0)));
  store.undo.undo();
  await sleep(60);
  for (let i = 0; i < 3; i++) { store.undo.undo(); await sleep(40); } // drop the seeds

  // ── 6b. the Panner joins the panning column in a surround song ─────────
  const { setSongScalarOp } = await import("../../src/doc/ops.js");
  timeline.sel = null;
  dlg = await menuAt(charX(0, COL_X.pan), rowY(0));
  check(rows(dlg)[1].join() === "pan,findchange",
    "a stereo song's panning column offers the pan tool alone", rows(dlg)[1].join());
  await dismiss(dlg);

  store.undo.apply(setSongScalarOp(store.songIndex, "surroundModel", 2));
  await sleep(120);
  dlg = await menuAt(charX(0, COL_X.pan), rowY(0));
  check(rows(dlg)[1].join() === "pan,panner,findchange",
    "a surround song adds the Panner beside it", rows(dlg)[1].join());
  check(!win.document.getElementById("tbPanner").hidden,
    "…on the same condition as the toolbox button");

  // It opens the real popup and writes to the whole block.
  timeline.sel = { aRow: 0, aCh: 0, aSub: E.SUB_PAN, row: 1, ch: 0, sub: E.SUB_PAN };
  await dismiss(dlg);
  dlg = await menuAt(charX(0, COL_X.pan), rowY(0));
  cell(dlg, "panner").click();
  let pdlg = null;
  for (let i = 0; i < 100 && !pdlg; i++) { pdlg = doc.querySelector("dialog.panner"); await sleep(30); }
  check(!!pdlg, "the Panner popup opens from the menu");
  if (pdlg) {
    pdlg.__panner.setAngles(256, 0);
    const placeBtn = [...pdlg.querySelectorAll("button")].find((b) => /^Place/.test(b.textContent));
    const depth = store.undo.undoStack.length;
    placeBtn.click();
    await sleep(80);
    const fx = (r) => timeline.cellAt(r, 0)?.cell;
    check(fx(0).effect === 0x21 && fx(1).effect === 0x21,
      "…and Place wrote the X command to BOTH selected rows",
      `${fx(0).effect}/${fx(1).effect}`);
    check(fx(4).effect !== 0x21, "…but not outside the block", String(fx(4).effect));
    check(store.undo.undoStack.length === depth + 1, "…in one undo step");
    pdlg.__panner.close();
    await sleep(60);
    store.undo.undo();
    await sleep(60);
    check(timeline.cellAt(0, 0).cell.effect !== 0x21, "…which undoes");
  }
  store.undo.undo(); // back to stereo
  await sleep(120);
  check((store.song.surroundModel ?? 0) === 0, "song back to stereo");
  timeline.sel = null;

  // ── 7. the Patterns view carries the same second row ───────────────────
  win.dispatchEvent(new win.KeyboardEvent("keydown", { code: "F3", bubbles: true }));
  await sleep(250);
  const pane = patternView.panes[0];
  patternView.setActiveIdx(0);
  pane.setPattern(1);
  await sleep(120);
  const pCanvas = pane.canvas;
  const pMenu = async (col, row) => {
    const r = pCanvas.getBoundingClientRect();
    pCanvas.dispatchEvent(new win.MouseEvent("contextmenu", {
      clientX: r.left + 34 + 4 + col * 8.5 + 1,
      clientY: r.top + (row - pane.scrollRow) * 17 + 8,
      bubbles: true, cancelable: true, button: 2 }));
    let d = null;
    for (let i = 0; i < 60 && !d; i++) { d = doc.querySelector("dialog.ctxmenu"); await sleep(20); }
    return d;
  };
  // With nothing selected and an empty clipboard the FIRST row has nothing in
  // it, and the widget drops empty rows — so the tools stand alone.
  pane.sel = null;
  store.clipboard = null;
  dlg = await pMenu(9, 3); // volume column
  check(JSON.stringify(rows(dlg)) === '[["volume","findchange"]]',
    "a Patterns column offers the volume tool, alone when there is nothing to copy",
    JSON.stringify(rows(dlg)));
  await dismiss(dlg);

  // With a selection, both rows are there.
  pane.sel = { aRow: 2, row: 5, aSub: E.SUB_VOL, sub: E.SUB_VOL };
  dlg = await pMenu(9, 3);
  check(JSON.stringify(rows(dlg)) === '[["copy","cut"],["volume","interpolate","findchange"]]',
    "…and with a block selected, the clipboard row joins it — and Interpolate appears",
    JSON.stringify(rows(dlg)));
  await dismiss(dlg);

  pane.sel = null;
  dlg = await pMenu(17, 3); // effect column
  const pFx = rows(dlg)[rows(dlg).length - 1];
  check(pFx.length === QUICK_FX.length + 1 && pFx[pFx.length - 1] === "findchange",
    "…including the effect palette (plus Find & Change)", String(pFx.length));
  await dismiss(dlg);

  // …and it really edits the pattern it was opened on.
  pane.sel = { aRow: 2, row: 3, aSub: E.SUB_VOL, sub: E.SUB_VOL };
  const pCell = (r) => store.doc.songs[0].patterns[pane.patIdx][r];
  store.undo.apply(setCellOp(0, pane.patIdx, 2, { volume: 30, volumeEff: 0 }));
  store.undo.apply(setCellOp(0, pane.patIdx, 9, { volume: 30, volumeEff: 0 }));
  await sleep(60);
  dlg = await pMenu(9, 2);
  cell(dlg, "volume").click();
  check(await runModal({ mult: 1, add: 10 }), "the Patterns volume tool opened");
  check(pCell(2).volume === 40, "…and moved the selected row", String(pCell(2).volume));
  check(pCell(9).volume === 30, "…but not one outside the selection", String(pCell(9).volume));
  store.undo.undo();
  await sleep(60);
  store.undo.undo();
  await sleep(60);
  store.undo.undo();
  await sleep(60);
  pane.sel = null;

  // ── 7b. Interpolate fills the gaps between the numbers already there ──
  const { compositeOp } = await import("../../src/doc/ops.js");
  // Blank the volume column over rows 0..12, then put a control point at each
  // end of it: two values, twelve rows apart, nothing in between.
  const seed = [];
  for (let r = 0; r <= 12; r++) {
    seed.push(setCellOp(0, pane.patIdx, r,
      r === 0 ? { volume: 0, volumeEff: 0 }
      : r === 12 ? { volume: 48, volumeEff: 0 }
      : { volume: 0, volumeEff: 3 }));
  }
  store.undo.apply(compositeOp(seed));
  await sleep(80);

  pane.sel = { aRow: 0, row: 12, aSub: E.SUB_VOL, sub: E.SUB_VOL };
  dlg = await pMenu(9, 0);
  check(!!cell(dlg, "interpolate"), "Interpolate is offered on a volume block");
  const depthI = store.undo.undoStack.length;
  cell(dlg, "interpolate").click();
  check(await runModal({ shape: "linear", dither: false }), "the Interpolate dialog opened");
  check(pCell(6).volume === 24 && pCell(6).volumeEff === 0,
    "…and drew a straight ramp between the two", `${pCell(6).volume}/${pCell(6).volumeEff}`);
  check(pCell(3).volume === 12 && pCell(9).volume === 36, "…all the way along it",
    `${pCell(3).volume}/${pCell(9).volume}`);
  check(pCell(0).volume === 0 && pCell(12).volume === 48,
    "…leaving the control points exactly as they were");
  check(store.undo.undoStack.length === depthI + 1, "…in one undo step");
  store.undo.undo();
  await sleep(80);
  check(pCell(6).volumeEff === 3, "…which undoes");

  // The note column's dialog carries the pitch-mode row, and picking glissando
  // greys the dither out (modal.js enabledWhen).
  const noteSeed = [];
  for (let r = 0; r <= 12; r++) {
    noteSeed.push(setCellOp(0, pane.patIdx, r,
      r === 0 ? { note: 0x5000 } : r === 12 ? { note: 0x6000 } : { note: 0 }));
  }
  store.undo.apply(compositeOp(noteSeed));
  await sleep(80);
  pane.sel = { aRow: 0, row: 12, aSub: E.SUB_NOTE, sub: E.SUB_NOTE };
  dlg = await pMenu(1, 0);
  cell(dlg, "interpolate").click();
  let imodal = null;
  for (let i = 0; i < 100 && !imodal; i++) { imodal = doc.querySelector("dialog.modal"); await sleep(30); }
  check(!!imodal?.querySelector('[name="pitchMode"]'),
    "the note column's dialog offers Continuous / Glissando");
  const dith = imodal?.querySelector('[name="dither"]');
  check(!!dith && !dith.disabled, "dither starts available");

  // The curve names alone are the option text; the sentence describing the
  // chosen one lives in the hint under the field, so the closed dropdown is
  // only as wide as "Hermite" (modal.js `hints`).
  const shape = imodal?.querySelector('[name="shape"]');
  const shapeHint = shape?.closest(".modal-field")?.nextElementSibling;
  check(!!shape && [...shape.options].every((o) => !/[—:(]/.test(o.textContent)),
    "curve options are bare names", [...(shape?.options ?? [])].map((o) => o.textContent).join("/"));
  check(!!shapeHint && shapeHint.classList.contains("modal-hint") &&
    /straight ramp/.test(shapeHint.textContent),
    "…with the chosen curve described underneath", shapeHint?.textContent);
  if (shape && shapeHint) {
    shape.value = "hermite";
    shape.dispatchEvent(new win.Event("change", { bubbles: true }));
    await sleep(40);
    check(/overshoot/.test(shapeHint.textContent),
      "…and the description follows the selection", shapeHint.textContent);
    shape.value = "linear";
    shape.dispatchEvent(new win.Event("change", { bubbles: true }));
    await sleep(40);
  }
  const pmode = imodal?.querySelector('[name="pitchMode"]');
  if (pmode && dith) {
    pmode.value = "glissando";
    pmode.dispatchEvent(new win.Event("change", { bubbles: true }));
    await sleep(50);
    check(dith.disabled, "…and glissando greys it out");
    check(dith.closest(".modal-field").classList.contains("modal-disabled"),
      "…dimming the row with it");
    pmode.value = "continuous";
    pmode.dispatchEvent(new win.Event("change", { bubbles: true }));
    await sleep(50);
    check(!dith.disabled, "…and back again when continuous is chosen");
  }
  imodal?.querySelectorAll(".modal-buttons button")[1].click(); // Cancel
  await sleep(80);
  store.undo.undo();  // drop the note seed
  await sleep(60);
  store.undo.undo();  // drop the volume seed
  await sleep(60);
  pane.sel = null;

  // ── 8. the Cues view has no second row ─────────────────────────────────
  win.dispatchEvent(new win.KeyboardEvent("keydown", { code: "F2", bubbles: true }));
  await sleep(200);
  const cueCv = doc.getElementById("cuesCanvas");
  const cr = cueCv.getBoundingClientRect();
  cueCv.dispatchEvent(new win.MouseEvent("contextmenu", {
    clientX: cr.left + 52 + 144 + 8, clientY: cr.top + 22 + 8,
    bubbles: true, cancelable: true, button: 2 }));
  let cueDlg = null;
  for (let i = 0; i < 60 && !cueDlg; i++) { cueDlg = doc.querySelector("dialog.ctxmenu"); await sleep(20); }
  check(!!cueDlg && rows(cueDlg).length === 1,
    "the Cues grid keeps a single row (it has no note columns)",
    String(rows(cueDlg ?? doc.createElement("div")).length));
  await dismiss(cueDlg);

  log(fails === 0 ? "\nALL PASS" : `\n${fails} FAILED`);
 } catch (err) { log("THREW: " + err.message + "\n" + err.stack); }
})();
</script>
