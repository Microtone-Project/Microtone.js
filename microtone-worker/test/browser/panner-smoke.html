<!doctype html><meta charset="utf-8"><title>spatial panner + surround model (item 998.0-.2, .6)</title>
<pre id="out">running…</pre>
<img src="/hang" hidden>
<iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1200px;height:700px"></iframe>
<script type="module">
// Drives the REAL app: open the Panner on the stereo song (the half-dial, S $80xx
// and the v2 panning column), then switch the song to a surround model, open it
// again, drag/set a position and write each of the three spatial commands into
// the cursor's cell — then undo the lot.
const out = document.getElementById("out");
const log = (s) => { out.textContent += "\n" + s; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let fails = 0;
const check = (ok, name, extra = "") => { if (!ok) fails++; log(`${ok ? "PASS" : "FAIL"} ${name}${extra ? " — " + extra : ""}`); };

(async () => {
  const app = document.getElementById("app");
  await new Promise((r) => app.addEventListener("load", r));
  const win = app.contentWindow;
  for (let i = 0; i < 200 && !win.__microtone; i++) await sleep(50);
  const M = win.__microtone;
  if (!M) { log("no __microtone"); return; }
  for (let i = 0; i < 200 && !M.store.song; i++) await sleep(50);
  const doc = win.document;
  const { store, timeline } = M;
  const { EffectOp } = await import("../../core/engine/tables.js");
  const { setSongScalarOp } = await import("../../src/doc/ops.js");

  const cellAt = (row, ch) => {
    const save = store.cursor;
    store.cursor = { row, ch, sub: 0, nib: 0 };
    const c = timeline.cursorCell()?.cell;
    store.cursor = save;
    return c;
  };

  // ── 1. a stereo song gets the half-dial ──────────────────────────────────
  check(!doc.getElementById("tbPanner").hidden, "Panner offered for a stereo song");
  check(store.doc.wideCells !== true, "the corpus song is a version-2 (narrow-cell) project");
  store.cursor = { row: 4, ch: 2, sub: 0, nib: 0 };
  doc.getElementById("tbPanner").click();
  let sdlg = null;
  for (let i = 0; i < 100 && !sdlg; i++) { sdlg = doc.querySelector("dialog.panner"); await sleep(30); }
  check(!!sdlg, "stereo panner opened");
  if (sdlg) {
    const cvs = sdlg.querySelectorAll("canvas.panner-dial");
    check(cvs.length === 1 && cvs[0].width > cvs[0].height, "ONE dial, a half-circle (wider than tall)",
      `${cvs.length} × ${cvs[0]?.width}×${cvs[0]?.height}`);
    const labels = [...sdlg.querySelectorAll("button")].map((b) => b.textContent);
    check(!labels.some((l) => /X \$|4 \$|Z \$/.test(l)), "no X / 4 / Z buttons — a stereo song ignores them",
      labels.join(" | "));
    // A drag straight up is centre, and one hard left of the listener is $00.
    const hcv = cvs[0];
    const hr = hcv.getBoundingClientRect();
    const hp = (type, x, y) => hcv.dispatchEvent(new win.PointerEvent(type, {
      clientX: hr.left + x, clientY: hr.top + y, bubbles: true, pointerId: 1,
    }));
    hp("pointerdown", 4, hr.height - 20);
    hp("pointerup", 4, hr.height - 20);
    await sleep(40);
    const panField = sdlg.querySelector(".panner-fields input");
    check(Math.round(parseFloat(panField.value)) === 0, "dragging far left = pan 0", panField.value);

    const was = cellAt(4, 2);
    const before = [was.effect, was.effectArg, was.pan, was.panEff].join();
    sdlg.__panner.setAngles(0x40, 0);
    sdlg.__panner.lane();
    await sleep(40);
    let sc = cellAt(4, 2);
    check(sc.effect === EffectOp.OP_S && sc.effectArg === 0x8040, "Lane writes S $8040",
      `${sc.effect}/$${sc.effectArg.toString(16)}`);
    sdlg.__panner.column();
    await sleep(40);
    sc = cellAt(4, 2);
    check(sc.panEff === 0 && sc.pan === 0x10, "Column writes a v2 panning SET 0 10",
      `${sc.panEff}/${sc.pan.toString(16)}`);
    sdlg.__panner.close();
    await sleep(60);
    // Reopening reads the handle back off the cell it wrote.
    doc.getElementById("tbPanner").click();
    sdlg = null;
    for (let i = 0; i < 100 && !sdlg; i++) { sdlg = doc.querySelector("dialog.panner"); await sleep(30); }
    check(Math.round(parseFloat(sdlg.querySelector(".panner-fields input").value)) === 0x40,
      "reopening picks the position up from the cell's S $80xx");
    sdlg.__panner.close();
    await sleep(60);
    store.undo.undo();
    store.undo.undo();
    await sleep(60);
    sc = cellAt(4, 2);
    check([sc.effect, sc.effectArg, sc.pan, sc.panEff].join() === before, "…and both writes undo",
      `${before} → ${[sc.effect, sc.effectArg, sc.pan, sc.panEff].join()}`);
  }

  // ── 1b. a surround song gets the full circle ─────────────────────────────
  store.undo.apply(setSongScalarOp(store.songIndex, "surroundModel", 2));
  await sleep(60);
  check(!doc.getElementById("tbPanner").hidden, "Panner still offered once the song is spatial");
  check(store.song.surroundModel === 2, "song carries the spatial model");

  // ── 2. open it on a known cell ───────────────────────────────────────────
  store.cursor = { row: 4, ch: 2, sub: 0, nib: 0 };
  doc.getElementById("tbPanner").click();
  let dlg = null;
  for (let i = 0; i < 100 && !dlg; i++) { dlg = doc.querySelector("dialog.panner"); await sleep(30); }
  check(!!dlg, "panner dialog opened");
  if (!dlg) { log(fails ? `\n${fails} FAILED` : "\nALL PASS"); return; }
  const api = dlg.__panner;
  check(!!api, "panner exposes its test hook");
  check(dlg.querySelectorAll("canvas.panner-dial").length === 2, "spatial song shows BOTH dials");
  check(dlg.textContent.includes("lane 3"), "info line names the cursor's lane",
    dlg.querySelector("p.dim")?.textContent);

  // ── 3. write X / 4 / Z from the dial ─────────────────────────────────────
  api.setAngles(384, 64);            // behind, 45° up
  api.place();
  await sleep(40);
  let cell = cellAt(4, 2);
  check(cell.effect === EffectOp.OP_X && cell.effectArg === 0x40c0,
    "Place writes X $40C0 (behind, +45°)", `$${cell.effectArg.toString(16)}`);

  api.setAngles(256, 0);             // hard right, ear level
  api.target();
  await sleep(40);
  cell = cellAt(4, 2);
  check(cell.effect === EffectOp.OP_4 && cell.effectArg === 0x0080,
    "Target writes 4 $0080 (right)", `$${cell.effectArg.toString(16)}`);

  const zInput = dlg.querySelector(".panner-cmds input[type=text]");
  zInput.value = "080";
  zInput.dispatchEvent(new win.Event("input", { bubbles: true }));
  api.slide();
  await sleep(40);
  cell = cellAt(4, 2);
  check(cell.effect === EffectOp.OP_Z && cell.effectArg === 0x080,
    "Slide writes Z $0080", `$${cell.effectArg.toString(16)}`);

  // ── 4. a pointer drag on the top dial moves the source ───────────────────
  const topCv = dlg.querySelectorAll("canvas.panner-dial")[0];
  const r = topCv.getBoundingClientRect();
  const pd = (type, x, y) => topCv.dispatchEvent(new win.PointerEvent(type, {
    clientX: r.left + x, clientY: r.top + y, bubbles: true, pointerId: 1,
  }));
  pd("pointerdown", r.width / 2 + 80, r.height / 2); // due right of centre
  pd("pointerup", r.width / 2 + 80, r.height / 2);
  await sleep(40);
  const azField = dlg.querySelector(".panner-fields .mt-spin input");
  check(Math.abs(parseFloat(azField.value) - 256) < 2, "dragging right of centre = azimuth 256 (right)",
    azField.value);
  api.place();
  await sleep(40);
  cell = cellAt(4, 2);
  check((cell.effectArg & 0xff) === 0x80, "…and Place writes that azimuth", `$${cell.effectArg.toString(16)}`);

  // ── 4b. the lane-header radar (#998.6) ───────────────────────────────────
  const { lateralProjection } = await import("../../core/engine/spatial.js");
  const collapsedH = M.timeline.headerH();
  check(!doc.getElementById("tbRadar").hidden, "Radar toggle appears for a surround song");
  doc.getElementById("tbRadar").click();
  await sleep(80);
  check(M.timeline.radarOn(), "radar mode on");
  check(M.timeline.headerH() > collapsedH, "header expands",
    `${collapsedH} → ${M.timeline.headerH()}`);
  // A y inside the OLD header band is still header now; just below the new one is row 0.
  check(M.timeline.hitTest(200, collapsedH + 4) === null, "the expanded header swallows rows");
  const firstRow = M.timeline.hitTest(200, M.timeline.headerH() + 4);
  check(firstRow !== null && firstRow.row === Math.floor(M.timeline.scrollRow),
    "row hit-testing follows the taller header", JSON.stringify(firstRow));
  // The collapsed strip is the dot's shadow: hard left 60° up reads half-left.
  check(Math.abs(lateralProjection(0, (60 / 90) * 128) + 0.5) < 1e-9,
    "projection: hard left + 60° elevation = half-left");
  doc.getElementById("tbRadar").click();
  await sleep(80);
  check(!M.timeline.radarOn() && M.timeline.headerH() === collapsedH, "radar collapses again");

  // ── 5. the popup leaves the document undoable ────────────────────────────
  api.close();
  await sleep(60);
  check(!doc.querySelector("dialog.panner"), "dialog closes");
  for (let i = 0; i < 6; i++) store.undo.undo();
  await sleep(60);
  cell = cellAt(4, 2);
  check(cell.effect === 0 && cell.effectArg === 0, "undo walks every panner write back off the cell",
    `${cell.effect}/${cell.effectArg}`);
  check(store.song.surroundModel === 0, "…including the surround-model switch");
  check(!doc.getElementById("tbPanner").hidden, "Panner button stays for the stereo song");

  log(fails === 0 ? "\nALL PASS" : `\n${fails} FAILED`);
  log(`FAILURES: ${fails}`);
})();
</script>
