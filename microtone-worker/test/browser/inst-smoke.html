<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>instruments smoke</title>
</head>
<body>
  <pre id="out">running…</pre>
  <iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1200px;height:700px"></iframe>
  <script type="module">
    // Exercises the reworked Instruments General tab (sliders, SF filter units,
    // NNA key-lift, panning/volume swing, wide detune), the envelope log-time
    // toggle, notation-aware note entry, and the song-name \uHHHH escape.
    const out = [];
    const log = (line) => {
      out.push(line);
      console.log("SMOKE: " + line);
      document.getElementById("out").textContent = out.join("\n");
    };
    const fire = (el, type) => el.dispatchEvent(new Event(type, { bubbles: true }));

    (async () => {
      try {
        const frame = document.getElementById("app");
        const win = await new Promise((resolve) => {
          const poll = setInterval(() => {
            const w = frame.contentWindow;
            if (w && w.__microtone?.store.doc) { clearInterval(poll); resolve(w); }
          }, 100);
        });
        const M = win.__microtone;
        const { store, instrumentsView: iv, timeline, jam } = M;
        const { presetForNotation } = await import("../../core/tuning/pitchtables.js");
        const { semiToNote, semiToNoteInTable } = await import("../../src/ui/edit.js");
        log("app loaded, doc ready");

        // Pick the first used non-meta instrument slot.
        let slot = -1;
        for (const s of store.doc.usedInstrumentSlots()) {
          if (!store.doc.instruments[s].isMeta) { slot = s; break; }
        }
        if (slot < 0) throw new Error("no non-meta instrument in corpus");
        const inst = store.doc.instruments[slot];
        log(`using inst slot $${slot.toString(16)}`);

        // Render the General tab.
        iv.visible = true;
        iv.selected = slot;
        iv.tab = "general";
        iv.refresh();
        const labels = [...iv.panel.querySelectorAll(".sl-label")].map((e) => e.textContent);
        const need = ["Global vol", "Swing", "Default pan", "Pitch-pan sep", "Pan swing",
          "Pitch-pan centre", "Mode", "New Note Action", "Duplicate Check Type",
          "Duplicate Check Action", "Detune"];
        const missing = need.filter((l) => !labels.includes(l));
        const labelsOk = missing.length === 0;
        log(`general labels present: ${labelsOk ? "yes" : "MISSING " + missing.join(",")}`);

        // Volume swing slider → applies to inst.volumeSwing.
        const findRow = (label) =>
          [...iv.panel.querySelectorAll(".slider-row")].find(
            (r) => r.querySelector(".sl-label")?.textContent === label);
        const swingRange = findRow("Swing").querySelector(".sl-range");
        swingRange.value = 42; fire(swingRange, "input");
        const swingOk = inst.volumeSwing === 42;
        log(`volume swing slider: volumeSwing=${inst.volumeSwing} (${swingOk ? "ok" : "FAIL"})`);

        // Panning fields.
        const sepRange = findRow("Pitch-pan sep").querySelector(".sl-range");
        sepRange.value = -20; fire(sepRange, "input");
        const sepOk = inst.pitchPanSeparation === -20;
        const panSwRange = findRow("Pan swing").querySelector(".sl-range");
        panSwRange.value = 77; fire(panSwRange, "input");
        const panSwOk = inst.panSwing === 77;
        const ppcRange = findRow("Pitch-pan centre").querySelector(".sl-range");
        ppcRange.value = 0x6000; fire(ppcRange, "input");
        const ppcOk = inst.pitchPanCentre === 0x6000;
        log(`panning: sep=${inst.pitchPanSeparation} swing=${inst.panSwing} centre=0x${inst.pitchPanCentre.toString(16)} (${sepOk && panSwOk && ppcOk ? "ok" : "FAIL"})`);

        // "Enable default pan" toggles pan LOOP word bit 7.
        const useDefBefore = (inst.panEnvLoop >> 7) & 1;
        const useDefChk = findRow("Enable default pan").querySelector("input[type=checkbox]");
        useDefChk.checked = !useDefBefore; fire(useDefChk, "change");
        const useDefOk = !!useDefChk && ((inst.panEnvLoop >> 7) & 1) === (useDefBefore ? 0 : 1);
        log(`use default pan: bit7 ${useDefBefore}→${(inst.panEnvLoop >> 7) & 1} (${useDefOk ? "ok" : "FAIL"})`);

        // Filter: switch to SoundFont2, verify 16-bit + Hz/dB annotations, edit cutoff.
        const findBtn = (row, text) =>
          [...row.querySelectorAll(".sl-buttons button")].find((b) => b.textContent === text);
        findBtn(findRow("Mode"), "SoundFont2").click(); // re-renders the panel
        const sfMode = inst.filterSfMode;
        const cutRow = findRow("Cutoff");
        const cutAnn = cutRow.querySelector(".sl-ann").textContent;
        const cutRange = cutRow.querySelector(".sl-range");
        cutRange.value = 7000; fire(cutRange, "input");
        const cut16 = inst.defaultCutoff16;
        const cutBytesOk = inst.getByteNormal(182) === ((7000 >> 8) & 0xff) &&
                           inst.getByteNormal(252) === (7000 & 0xff);
        const cutOk = sfMode && cut16 === 7000 && cutBytesOk && /Hz|kHz/.test(cutAnn);
        log(`SF filter: mode=${sfMode} cutoff16=${cut16} ann="${cutAnn}" bytesOk=${cutBytesOk} (${cutOk ? "ok" : "FAIL"})`);

        const resRow = findRow("Resonance");
        const resAnn = resRow.querySelector(".sl-ann").textContent;
        const resRange = resRow.querySelector(".sl-range");
        resRange.value = 240; fire(resRange, "input");
        const resOk = inst.defaultResonance16 === 240 && /dB/.test(resRow.querySelector(".sl-ann").textContent);
        log(`SF reso: reso16=${inst.defaultResonance16} ann0="${resAnn}" (${resOk ? "ok" : "FAIL"})`);

        // NNA key-lift as the 5th option → flag bit 5 set, bits 0-1 clear.
        const nnaRow = findRow("New Note Action");
        const nnaOptCount = nnaRow.querySelectorAll(".sl-buttons button").length;
        findBtn(nnaRow, "Key lift").click();
        const kl = ((inst.instrumentFlag >> 5) & 1) === 1 && (inst.instrumentFlag & 3) === 0;
        const nnaOk = nnaOptCount === 5 && kl;
        log(`NNA key-lift: options=${nnaOptCount} flag=0x${inst.instrumentFlag.toString(16)} (${nnaOk ? "ok" : "FAIL"})`);

        // Wide detune slider — full signed 16-bit range on a signed-log axis.
        iv.refresh();
        const detRow = findRow("Detune");
        const detWide = detRow.classList.contains("wide");
        const detRange = detRow.querySelector(".sl-range");
        const detNum = detRow.querySelector(".sl-num");
        // The slider position axis is symmetric about 0 (signed-log), not the
        // raw value axis.
        const axisOk = Number(detRange.min) === -Number(detRange.max) &&
          Number(detRange.max) > 0;
        // Extremes reach the full field range (±0x8000 clamped to ±0x7FFF).
        detRange.value = detRange.max; fire(detRange, "input");
        const maxV = inst.sampleDetuneSigned;
        detRange.value = detRange.min; fire(detRange, "input");
        const minV = inst.sampleDetuneSigned;
        // Centre position is exactly zero.
        detRange.value = 0; fire(detRange, "input");
        const zeroV = inst.sampleDetuneSigned;
        // Signed-log: a position a quarter of the way up from centre yields a
        // magnitude far below a linear quarter-scale (fine control near zero).
        detRange.value = Math.round(Number(detRange.max) / 4); fire(detRange, "input");
        const quarterV = inst.sampleDetuneSigned;
        const detLogOk = quarterV > 0 && quarterV < 0x7fff / 4;
        // symlog fix: -1, 0, +1 must occupy DISTINCT, visibly-separated slider
        // positions (a pure log collapsed |v|<=1 onto the centre), and 0 must be
        // reachable at the exact centre position.
        detNum.value = 0; fire(detNum, "change"); const posZero = Number(detRange.value);
        detNum.value = 1; fire(detNum, "change"); const posP1 = Number(detRange.value);
        detNum.value = -1; fire(detNum, "change"); const posN1 = Number(detRange.value);
        const spreadOk = posZero === 0 && posP1 === -posN1 && posP1 >= 10;
        detRange.value = 0; fire(detRange, "input");
        const zeroReachOk = inst.sampleDetuneSigned === 0;
        // The spinner still sets an exact signed value; the annotation shows cents.
        detNum.value = -2048; fire(detNum, "change");
        const spinnerOk = inst.sampleDetuneSigned === -2048 &&
          /cents/.test(detRow.querySelector(".sl-ann").textContent);
        const detOk = detWide && axisOk && maxV === 0x7fff && minV === -0x8000 &&
          zeroV === 0 && detLogOk && spreadOk && zeroReachOk && spinnerOk;
        log(`detune: wide=${detWide} axis=${axisOk} max=${maxV} min=${minV} zero=${zeroV} ` +
            `quarter=${quarterV} pos(-1/0/1)=${posN1}/${posZero}/${posP1} spread=${spreadOk} ` +
            `zeroReach=${zeroReachOk} spinner=${spinnerOk} (${detOk ? "ok" : "FAIL"})`);

        // Envelope log-time toggle exists and flips the flag.
        iv.tab = "env0";
        iv.renderPanel();
        const logChk = [...iv.panel.querySelectorAll("label")]
          .find((l) => /Log timescale/.test(l.textContent))?.querySelector("input");
        logChk.checked = true; fire(logChk, "change");
        const logOk = !!logChk && iv.envLogTime === true;
        log(`env log-time toggle: present=${!!logChk} flag=${iv.envLogTime} (${logOk ? "ok" : "FAIL"})`);

        // Pitch/Filter "Envelope present" claim toggle (item 36): the role tabs
        // now carry the checkbox; ON claims the resolved slot, OFF releases it.
        const baseSlot = store.doc.usedInstrumentSlots().find((s) => !store.doc.instruments[s].isMeta);
        iv.selected = baseSlot;
        iv.tab = "pitch";
        iv.renderPanel();
        const findPresent = () => [...iv.panel.querySelectorAll("label")]
          .find((l) => /Envelope present/.test(l.textContent))?.querySelector("input");
        const hasPresent = !!findPresent();
        let onC = findPresent(); onC.checked = true; fire(onC, "change");
        iv.renderPanel();
        const claimed = findPresent().checked === true; // roleActive → checkbox reflects it
        let offC = findPresent(); offC.checked = false; fire(offC, "change");
        iv.renderPanel();
        const released = findPresent().checked === false;
        const roleToggleOk = hasPresent && claimed && released;
        log(`pitch env present toggle: has=${hasPresent} claimed=${claimed} released=${released} (${roleToggleOk ? "ok" : "FAIL"})`);

        // Item 169.1: every envelope tab carries a Carry box that writes LOOP-word
        // bit 6 of THAT envelope's own word, and only that one.
        const carryChk = () => [...iv.panel.querySelectorAll("label")]
          .find((l) => /^Carry/.test(l.textContent.trim()))?.querySelector("input");
        iv.selected = baseSlot;
        iv.tab = "env0";
        iv.renderPanel();
        const carryHas = !!carryChk();
        const carryStart = (store.doc.instruments[baseSlot].volEnvLoop >> 6) & 1;
        let cc = carryChk(); cc.checked = !carryStart; fire(cc, "change");
        iv.renderPanel();
        const volW = store.doc.instruments[baseSlot].volEnvLoop;
        const carrySet = ((volW >> 6) & 1) !== carryStart && carryChk().checked === !carryStart;
        // …the pan envelope's word is untouched by the volume tab's box.
        const panUntouched = ((store.doc.instruments[baseSlot].panEnvLoop >> 6) & 1) === 0;
        cc = carryChk(); cc.checked = !!carryStart; fire(cc, "change");
        iv.renderPanel();
        const carryBack = ((store.doc.instruments[baseSlot].volEnvLoop >> 6) & 1) === carryStart;
        const carryOk = carryHas && carrySet && panUntouched && carryBack;
        log(`env carry toggle: has=${carryHas} set=${carrySet} panClear=${panUntouched} ` +
            `restored=${carryBack} (${carryOk ? "ok" : "FAIL"})`);

        // Item 92: all four envelope tabs share ONE "{label}: present/absent"
        // detail-info header format, with "present" alone carrying --accent
        // (class env-present); "absent" stays plain.
        const envTabs = [
          ["env0", "Vol env"], ["env1", "Pan env"], ["pitch", "Pitch env"], ["filter", "Filter env"],
        ];
        const envFormatLog = [];
        let envFormatOk = true;
        for (const [tabId, label] of envTabs) {
          iv.tab = tabId;
          iv.renderPanel();
          const findPresentChk = () => [...iv.panel.querySelectorAll("label")]
            .find((l) => /Envelope present/.test(l.textContent))?.querySelector("input");
          let c = findPresentChk();
          if (!c.checked) { c.checked = true; fire(c, "change"); iv.renderPanel(); }
          const headOn = iv.panel.querySelector(".detail-info");
          const bOn = headOn?.querySelector("b");
          const onOk = headOn?.textContent.startsWith(`${label}: `) &&
            bOn?.classList.contains("env-present") && /present/i.test(bOn.textContent ?? "");
          c = findPresentChk();
          c.checked = false; fire(c, "change"); iv.renderPanel();
          const headOff = iv.panel.querySelector(".detail-info");
          const bOff = headOff?.querySelector("b");
          const offOk = headOff?.textContent.startsWith(`${label}: `) &&
            !bOff?.classList.contains("env-present") && /absent/i.test(bOff?.textContent ?? "");
          envFormatLog.push(`${tabId}:${onOk ? "on-ok" : "on-FAIL"}/${offOk ? "off-ok" : "off-FAIL"}`);
          envFormatOk = envFormatOk && onOk && offOk;
        }
        log(`item92 env header format: ${envFormatLog.join(" ")} (${envFormatOk ? "ok" : "FAIL"})`);

        // Item 181 — the envelope node buttons. Three things one click has to
        // carry: "＋ Add node" claims PRESENCE (a node array is only read when
        // the LOOP word's P bit is set, so on every tab but Volume the work
        // was silently ignored), "－ Remove node" actually SHORTENS the
        // envelope when the tail is selected, and an enabled sustain point
        // sitting on the tail follows the appended node. One undo step each.
        const { envActiveCount } = await import("../../src/doc/envedit.js");
        const panInst = () => store.doc.instruments[baseSlot];
        const panCount = () => envActiveCount(panInst().panEnvelopes);
        const envBtn = (re) => [...iv.panel.querySelectorAll("button")]
          .find((b) => re.test(b.textContent));
        iv.selected = baseSlot;
        iv.tab = "env1";                       // Pan: presence is the P bit itself
        iv.renderPanel();
        const presentChk = () => [...iv.panel.querySelectorAll("label")]
          .find((l) => /Envelope present/.test(l.textContent))?.querySelector("input");
        let pc = presentChk();
        if (pc.checked) { pc.checked = false; fire(pc, "change"); iv.renderPanel(); }
        const addFrom = panCount();
        // Park a DISABLED sustain on the tail: claiming presence has to arm it
        // and walk it to the appended node, all in the one click.
        iv.setEnvWordField("panEnvSustainWord", 8, 0x1f, addFrom - 1);
        iv.setEnvWordField("panEnvSustainWord", 0, 0x1f, addFrom - 1);
        iv.setEnvWordBit("panEnvSustainWord", 5, false);
        iv.renderPanel();
        const susBefore = panInst().panEnvSustainWord;
        envBtn(/Add node/).click();
        iv.renderPanel();
        const addClaimed = (panInst().panEnvLoop & 0x2000) !== 0 && presentChk().checked === true;
        const addGrew = panCount() === addFrom + 1;
        const armW = panInst().panEnvSustainWord;
        const armOk = ((armW >> 5) & 1) === 1 && ((armW >> 8) & 0x1f) === addFrom &&
          (armW & 0x1f) === addFrom;
        store.undo.undo();                     // ONE step takes claim AND arm with it
        iv.renderPanel();
        const addUndoOk = panCount() === addFrom && (panInst().panEnvLoop & 0x2000) === 0 &&
          panInst().panEnvSustainWord === susBefore;

        // Removing the tail: the count must drop. This is the reported bug —
        // it used to stay put and zero the tail's VALUE instead.
        envBtn(/Add node/).click(); iv.renderPanel();
        envBtn(/Add node/).click(); iv.renderPanel();
        const remFrom = panCount();
        iv.selectedNode = remFrom - 1;
        iv.renderPanel();
        envBtn(/Remove node/).click();
        iv.renderPanel();
        const remOk = panCount() === remFrom - 1;

        // An enabled sustain on the tail follows an appended node…
        const last = panCount() - 1;
        iv.setEnvWordField("panEnvSustainWord", 8, 0x1f, last);
        iv.setEnvWordField("panEnvSustainWord", 0, 0x1f, last);
        iv.setEnvWordBit("panEnvSustainWord", 5, true);
        iv.selectedNode = last;
        iv.renderPanel();
        envBtn(/Add node/).click();
        iv.renderPanel();
        const susW = panInst().panEnvSustainWord;
        const susFollowOk = ((susW >> 8) & 0x1f) === last + 1 && (susW & 0x1f) === last + 1;
        // …and comes back into range when the tail it followed is removed.
        iv.selectedNode = panCount() - 1;
        iv.renderPanel();
        envBtn(/Remove node/).click();
        iv.renderPanel();
        const susW2 = panInst().panEnvSustainWord;
        const susClampOk = ((susW2 >> 8) & 0x1f) <= panCount() - 1 &&
          (susW2 & 0x1f) <= panCount() - 1;
        // On a Pitch/Filter tab the same claim is the ROLE claim — P bit plus
        // the m-bit — on whichever physical slot the tab resolved to.
        iv.tab = "pitch";
        iv.renderPanel();
        let ppc = presentChk();
        if (ppc.checked) { ppc.checked = false; fire(ppc, "change"); iv.renderPanel(); }
        envBtn(/Add node/).click();
        iv.renderPanel();
        const pfWords = () => [panInst().pfEnvLoop, panInst().pf2EnvLoop];
        const roleClaimOk = presentChk().checked === true &&
          pfWords().some((w) => (w & 0x2000) !== 0 && (w & 0x80) === 0);
        store.undo.undo();
        iv.renderPanel();
        const roleUndoOk = presentChk().checked === false;
        const env181Ok = addClaimed && addGrew && armOk && addUndoOk && remOk && susFollowOk &&
          susClampOk && roleClaimOk && roleUndoOk;
        log(`item181 env nodes: claim=${addClaimed} grew=${addGrew} susArm=${armOk} ` +
            `undo1=${addUndoOk} remove=${remOk} susFollow=${susFollowOk} susClamp=${susClampOk} ` +
            `roleClaim=${roleClaimOk} roleUndo=${roleUndoOk} (${env181Ok ? "ok" : "FAIL"})`);

        // Item 207 — the VOLUME envelope's P bit is real now (the engine skips
        // an absent one), so every edit that shapes the nodes claims presence:
        // the Value field and a drag, not only Add node. One undo each takes
        // back the shape AND the claim.
        const volInst = () => store.doc.instruments[baseSlot];
        const volP = () => (volInst().volEnvLoop & 0x2000) !== 0;
        iv.selected = baseSlot;
        iv.tab = "env0";
        iv.renderPanel();
        let vpc = presentChk();
        if (vpc.checked) { vpc.checked = false; fire(vpc, "change"); iv.renderPanel(); }
        const unticked = !volP();
        iv.selectedNode = 0;
        iv.renderPanel();
        const node0 = volInst().volEnvelopes[0].value;
        const valueIn = [...iv.panel.querySelectorAll("label.env-ctl")]
          .find((l) => /^Value/.test(l.textContent))?.querySelector("input");
        valueIn.value = String(node0 === 40 ? 41 : 40);
        fire(valueIn, "change");
        iv.renderPanel();
        const fieldClaim = volP() && presentChk().checked === true;
        store.undo.undo();
        iv.renderPanel();
        const fieldUndo = !volP() && volInst().volEnvelopes[0].value === node0;

        // A drag on node 0 (at x = 10 on the graph), pointer capture stubbed:
        // a synthetic pointer is not one the browser can capture.
        const cv = iv.envCanvas.canvas;
        cv.setPointerCapture = () => {};
        const r = cv.getBoundingClientRect();
        const h = cv.clientHeight;
        const want = node0 === 30 ? 31 : 30;
        const at = { clientX: r.left + 10, clientY: r.top + (h - 14 - (want / 63) * (h - 28)), pointerId: 1 };
        const depth = store.undo.undoStack.length;
        iv.envPointerDown(at);
        iv.envPointerMove({ ...at, clientY: at.clientY + 1 });
        iv.envPointerMove(at);
        cv.dispatchEvent(new win.PointerEvent("pointerup"));
        const dragClaim = volP() && volInst().volEnvelopes[0].value === want &&
          store.undo.undoStack.length === depth + 1;
        store.undo.undo();
        iv.renderPanel();
        const dragUndo = !volP() && volInst().volEnvelopes[0].value === node0;
        const env207Ok = unticked && fieldClaim && fieldUndo && dragClaim && dragUndo;
        log(`item207 vol presence: unticked=${unticked} field=${fieldClaim} fieldUndo=${fieldUndo} ` +
            `drag=${dragClaim} dragUndo=${dragUndo} (${env207Ok ? "ok" : "FAIL"})`);

        // Notation-aware entry: a 5-TET project (NOT a 12-TET superset) → a jam
        // key snaps to a 5-TET degree, and the note differs from plain 12-EDO.
        const p5 = presetForNotation(50);
        store.pitchPreset = p5;
        store.view = "timeline";
        store.record = true;
        store.cursor = { row: 5, ch: 0, sub: 0, nib: 0 };
        const tgt = timeline.cursorCell();
        timeline.processEditKey({ code: "KeyS", key: "s" }, jam); // semitone 2
        const entered = store.song.patterns[tgt.pat][tgt.rowInCue].note;
        const off = (entered - 0x5000) % p5.interval;
        const notOk = entered === semiToNoteInTable(4, 2, p5) &&
          entered !== semiToNote(4, 2) && p5.table.includes(off);
        log(`notation entry (5-TET): note=0x${entered.toString(16)} off=0x${off.toString(16)} 12tet=0x${semiToNote(4, 2).toString(16)} (${notOk ? "ok" : "FAIL"})`);

        // Song-name \uHHHH escape.
        const pv = M.projectView ?? win.__microtone.projectView;
        let nameOk = true;
        if (pv && pv.changeName) {
          pv.changeName("café 🎵");
          const nm = store.doc.meta.songMeta[store.songIndex].name;
          nameOk = nm === "caf\\u00E9 \\uD83C\\uDFB5";
          log(`song name escape: "${nm}" (${nameOk ? "ok" : "FAIL"})`);
        } else {
          log("projectView not exposed; skipping name test");
        }

        const pass = labelsOk && swingOk && sepOk && panSwOk && ppcOk && useDefOk && cutOk && resOk &&
          nnaOk && detOk && logOk && roleToggleOk && carryOk && envFormatOk && env181Ok &&
          env207Ok &&
          notOk && nameOk;
        log(pass ? "RESULT: PASS" : "RESULT: FAIL");
      } catch (err) {
        log(`RESULT: ERROR ${err.message}\n${err.stack}`);
      }
    })();
  </script>
</body>
</html>
