<!doctype html><meta charset="utf-8"><title>cleanup smoke (item 60)</title>
<pre id="out">running…</pre>
<img src="/hang" hidden>
<iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1100px;height:640px"></iframe>
<script type="module">
const out = document.getElementById("out");
const log = (s) => { out.textContent += "\n" + s; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
window.addEventListener("error", (e) => log("ERROR: " + e.message));
(async () => {
 try {
  const app = document.getElementById("app");
  await new Promise((r) => app.addEventListener("load", r));
  const win = app.contentWindow;
  for (let i = 0; i < 200 && !win.__microtone; i++) await sleep(50);
  const M = win.__microtone;
  if (!M) { log("no __microtone"); return; }
  for (let i = 0; i < 200 && !M.store.song; i++) await sleep(50);
  const { store, projectView: pv } = M;

  // Buttons present on the Project view.
  pv.show();
  const labels = [...pv.root.querySelectorAll("button")].map((b) => b.textContent);
  const hasBtns = ["Cleanup patterns", "Renumber patterns", "Cleanup instruments & samples"]
    .every((x) => labels.includes(x));

  const origConfirm = win.confirm; win.confirm = () => true;
  // A notice from showAlert() (the app's alert): record it and dismiss it.
  new win.MutationObserver(() => { for (const d of win.document.querySelectorAll("dialog.modal-alert")) { const m = d.querySelector("p")?.textContent ?? ""; d.querySelector(".act-dismiss").click(); ((m) => log("alert: " + m))(m); } }).observe(win.document.body, { childList: true });

  // Create an UNUSED high-number pattern (item 48) so cleanup has something to do.
  const { setCellOp } = await win.eval('import("/src/doc/ops.js")');
  store.undo.apply(setCellOp(store.songIndex, 600, 0, { note: 0x5000, instrment: 1 }));
  const d0 = store.undo.undoStack.length;

  // Pattern cleanup + undo (rewrites cues, one undo step). Light enough for the
  // sandboxed headless chromium; the bank cleanup op is node-tested separately.
  const patsBefore = store.doc.songs[store.songIndex].patterns.length; // ≥ 601
  pv.cleanupPatterns();
  const patStep = store.undo.undoStack.length === d0 + 1;
  const patsAfter = store.doc.songs[store.songIndex].patterns.length;
  const removedUnused = patsAfter < patsBefore;
  if (patStep) store.undo.undo();
  const patUndone = store.undo.undoStack.length === d0 &&
    store.doc.songs[store.songIndex].patterns.length === patsBefore;

  // ── item 178: defragment the sample pool ──
  // Nothing in the corpus is fragmented (they all come out of a converter
  // packed), so a sample is deleted out of the middle first — which is exactly
  // how a real project acquires a hole.
  const { planDeleteSample } = await win.eval('import("/src/doc/cleanup.js")');
  const { cleanupBankOp } = await win.eval('import("/src/doc/ops.js")');
  const { poolMap } = await win.eval('import("/src/doc/poolmap.js")');
  const hasDefrag = labels.includes("Defragment sample memory");
  // A packed pool has nothing to do, and says so rather than writing an undo
  // step for a no-op (the corpus comes out of a converter packed end to end).
  const dPacked = store.undo.undoStack.length;
  pv.defragPool();
  await sleep(20);
  const packedNoop = store.undo.undoStack.length === dPacked;
  const census = store.doc.sampleList();
  store.undo.apply(cleanupBankOp(planDeleteSample(store.doc, census[Math.floor(census.length / 2)])));
  const holesBefore = poolMap(store.doc, { scanBytes: false }).stats.holeCount;
  const d1 = store.undo.undoStack.length;
  const poolBefore = Uint8Array.from(store.doc.sampleBin);
  pv.defragPool();
  await sleep(50);
  const defragStep = store.undo.undoStack.length === d1 + 1;
  const holesAfter = poolMap(store.doc, { scanBytes: false }).stats.holeCount;
  if (defragStep) store.undo.undo();
  await sleep(20);
  const poolBack = store.doc.sampleBin.every((v, i) => v === poolBefore[i]);

  win.confirm = origConfirm;
  pv.hide();

  log(`buttons present: ${hasBtns}`);
  log(`pattern cleanup (${patsBefore}→${patsAfter} patterns) removed=${removedUnused} undo=${patUndone}`);
  log(`defrag button=${hasDefrag} packedNoop=${packedNoop} holes ${holesBefore}→${holesAfter} step=${defragStep} undo=${poolBack}`);
  const ok = hasBtns && patStep && removedUnused && patUndone &&
    hasDefrag && packedNoop && holesBefore > 0 && holesAfter === 0 && defragStep && poolBack;
  log(ok ? "PASS item 60 Project housekeeping (patterns) + item 178 defrag" : "FAIL");
 } catch (e) { log("THROW: " + (e && e.stack || e)); }
})();
</script>
