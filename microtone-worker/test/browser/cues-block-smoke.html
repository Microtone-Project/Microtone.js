<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>cues: grow-past-HALT + block selection + clipboard + command-fill smoke</title>
</head>
<body>
  <pre id="out">running…</pre>
  <!-- worker-less page: the virtual-time --dump-dom recipe applies:
       chromium --headless=new --virtual-time-budget=100000000 --timeout=60000 \
         --dump-dom .../cues-block-smoke.html -->
  <iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1200px;height:700px"></iframe>
  <script type="module">
    // Cues view: editing/pasting past the last stored cue (grow), 2D block
    // selection, copy/cut/paste/delete via the cue-word clipboard. Drives the
    // real app (view APIs + the Ctrl+C/V wiring routed through selView()).
    const out = [];
    const log = (line) => {
      out.push(line);
      console.log("SMOKE: " + line);
      document.getElementById("out").textContent = out.join("\n");
    };
    const key = (win, code, k, opts = {}) => {
      win.dispatchEvent(new win.KeyboardEvent("keydown", { code, key: k, bubbles: true, ...opts }));
      win.dispatchEvent(new win.KeyboardEvent("keyup", { code, key: k, bubbles: true, ...opts }));
    };
    const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const tick = (ms = 0) => new Promise((r) => setTimeout(r, ms));
    /** Answer the command popup the view has just opened (showModal builds a
     *  plain <dialog> with one named control per field and OK first). */
    const answerCmd = async (win, kind, argHex) => {
      // By the command field, not by the class: an autosave-recovery dialog
      // from a previous session can be sitting on the page as well.
      const find = () => [...win.document.querySelectorAll("dialog.modal")]
        .find((d) => d.querySelector("[name=kind]")) ?? null;
      let dlg = null;
      for (let i = 0; i < 100 && !dlg; i++) { await tick(10); dlg = find(); }
      if (!dlg) throw new Error("the command popup never opened");
      dlg.querySelector("[name=kind]").value = kind;
      dlg.querySelector("[name=arg]").value = argHex;
      dlg.querySelector(".modal-buttons button").click();
      await tick(10);
    };

    (async () => {
      try {
        const frame = document.getElementById("app");
        const win = await new Promise((resolve) => {
          const poll = setInterval(() => {
            const w = frame.contentWindow;
            if (w && w.__microtone?.store.doc) { clearInterval(poll); resolve(w); }
          }, 100);
        });
        const { store, cuesView } = win.__microtone;
        const { CUE_EMPTY } = await import("../../src/format/taud-const.js");
        const song = store.song;
        log("app loaded, doc ready");

        store.view = "cues";
        store.record = true;
        const len0 = song.cues.length;

        // ── 1. Excel-style full-range scroll: editable to the format limit, but
        //       editing far down grows (materialises) the cue list. ──
        const limit = store.doc.is64Channel ? 4096 : 8192;
        const editRowsOk = cuesView.editRows() === limit;
        // Put the cursor on the first blank row past the last cue, channel 3.
        cuesView.cursor = { cue: len0, col: 2 + 3, nib: 0 };
        // type "0005" into that cell (4 nibbles)
        for (const d of ["0", "0", "0", "5"]) key(win, "Digit" + d, d);
        const grew = song.cues.length === len0 + 1;
        const materialised = grew && (song.cues[len0][3] & 0x7fff) === 0x0005;
        log(`grow past end: editRows=${editRowsOk} grew=${grew} value=${materialised}`);
        // undo the four nibble entries → truncates back
        for (let i = 0; i < 4; i++) key(win, "KeyZ", "z", { ctrlKey: true });
        const shrankBack = song.cues.length === len0;
        log(`undo shrinks the cue list back: ${shrankBack}`);

        // ── 1b. Scrolling far down must NOT materialise cues (no save bloat) ──
        cuesView.scrollCue = 6000;
        cuesView.cursor = { cue: 6000, col: 2 + 0, nib: 0 };
        cuesView.invalidate();
        const noBloat = song.cues.length === len0;
        log(`scroll to cue 6000 leaves the list unmaterialised: ${noBloat}`);
        // editing at 4000 grows to cover it (the accepted gap-fill caveat)
        cuesView.cursor = { cue: 4000, col: 2 + 0, nib: 0 };
        for (const d of ["0", "0", "0", "3"]) key(win, "Digit" + d, d);
        const grewFar = song.cues.length === 4001 && (song.cues[4000][0] & 0x7fff) === 0x0003;
        log(`edit at cue 4000 grows the list to 4001: ${grewFar}`);
        for (let i = 0; i < 4; i++) key(win, "KeyZ", "z", { ctrlKey: true }); // undo → back to len0
        const farUndo = song.cues.length === len0;
        log(`undo of the far edit truncates back: ${farUndo}`);
        cuesView.scrollCue = 0;

        // ── 2. Seed a recognisable block: cue 0, voices 7..10 ──
        const { setCuesOp } = await import("../../src/doc/ops.js");
        store.undo.apply(setCuesOp(0, [
          { cue: 0, ch: 7, value: 0x0071 },
          { cue: 0, ch: 8, value: 0x0072 },
          { cue: 0, ch: 9, value: 0x0073 },
          { cue: 0, ch: 10, value: 0x0074 },
        ]));

        // ── 3. Mouse-style block selection + copy (Ctrl+C) ──
        cuesView.cursor = { cue: 0, col: 2 + 7, nib: 0 };
        cuesView.sel = { aCue: 0, aCh: 7, cue: 0, ch: 10 }; // 1×4 across voices 7..10
        const b = cuesView.selBounds();
        const selOk = b && b.r0 === 0 && b.r1 === 0 && b.c0 === 7 && b.c1 === 10;
        key(win, "KeyC", "c", { ctrlKey: true }); // copy → store.cueClipboard
        const clip = store.cueClipboard;
        const clipOk = clip && clip.rows === 1 && clip.chans === 4 &&
          eq([...clip.words], [0x0071, 0x0072, 0x0073, 0x0074]);
        log(`selection+copy: sel=${selOk} clip=${clipOk}`);

        // ── 4. Paste onto voices 1..4 of cue 2 ──
        // The selection goes first: a live block is now the paste TARGET (its
        // top-left beats the cursor), which leg 4b checks on its own.
        cuesView.clearSelection();
        cuesView.cursor = { cue: 2, col: 2 + 1, nib: 0 };
        key(win, "KeyV", "v", { ctrlKey: true });
        const pasteOk = eq([...song.cues[2].subarray(1, 5)], [0x0071, 0x0072, 0x0073, 0x0074]);
        log(`paste onto voices 1..4: ${pasteOk}`);

        // ── 4b. With a block selected, the paste anchors on IT ──
        cuesView.sel = { aCue: 4, aCh: 9, cue: 4, ch: 12 };
        cuesView.cursor = { cue: 9, col: 2 + 20, nib: 0 }; // deliberately elsewhere
        const anchorDecoy = song.cues[9] ? song.cues[9][20] : null;
        key(win, "KeyV", "v", { ctrlKey: true });
        const anchorOk = eq([...song.cues[4].subarray(9, 13)], [0x0071, 0x0072, 0x0073, 0x0074]) &&
          (song.cues[9] ? song.cues[9][20] : null) === anchorDecoy;
        log(`paste anchors on the selection, not the cursor: ${anchorOk}`);
        key(win, "KeyZ", "z", { ctrlKey: true });
        cuesView.clearSelection();

        // ── 5. Paste past the last cue grows the list ──
        const lenNow = song.cues.length;
        cuesView.clearSelection();
        cuesView.cursor = { cue: lenNow, col: 2 + 1, nib: 0 }; // phantom row
        key(win, "KeyV", "v", { ctrlKey: true });
        const grewOnPaste = song.cues.length === lenNow + 1 &&
          eq([...song.cues[lenNow].subarray(1, 5)], [0x0071, 0x0072, 0x0073, 0x0074]);
        log(`paste past the end grows: ${grewOnPaste}`);
        key(win, "KeyZ", "z", { ctrlKey: true }); // undo → truncate
        const undoGrow = song.cues.length === lenNow;
        log(`undo of paste-past-end truncates: ${undoGrow}`);

        // ── 6. Delete-selection blanks the pattern, keeps command bits ──
        song.cues[2][1] |= 0x8000; // fake a command sign bit
        cuesView.cursor = { cue: 2, col: 2 + 1, nib: 0 };
        cuesView.sel = { aCue: 2, aCh: 1, cue: 2, ch: 4 };
        key(win, "Delete", "Delete");
        const delBlanked = (song.cues[2][1] & 0x7fff) === 0x7fff &&
          (song.cues[2][2] & 0x7fff) === 0x7fff;
        const cmdKept = (song.cues[2][1] & 0x8000) === 0x8000;
        log(`delete-selection: blanked=${delBlanked} commandBitKept=${cmdKept}`);

        // ── 7. Escape clears a selection ──
        cuesView.sel = { aCue: 0, aCh: 7, cue: 0, ch: 10 };
        key(win, "Escape", "Escape");
        const escOk = !cuesView.hasSelection();
        log(`escape clears cue selection: ${escOk}`);

        // ── 8. Keyboard Shift+arrows extend a channel block ──
        cuesView.clearSelection();
        cuesView.cursor = { cue: 0, col: 2 + 2, nib: 0 };
        key(win, "ArrowDown", "ArrowDown", { shiftKey: true });
        key(win, "ArrowRight", "ArrowRight", { shiftKey: true });
        const kb = cuesView.selBounds();
        const kbOk = kb && kb.r0 === 0 && kb.r1 === 1 && kb.c0 === 2 && kb.c1 === 3;
        log(`keyboard shift-select: ${kbOk}`);

        // ── 8b. Ctrl+A takes the whole lane column, Ctrl+←/→ walk its edge ───
        // The column stops at the end of the CUE LIST, not at the end of the
        // address space: selecting 8192 imaginary rows would make one paste
        // materialise the lot.
        cuesView.clearSelection();
        const lastCue = song.cues.length - 1;
        cuesView.cursor = { cue: 3, col: 2 + 5, nib: 0 };
        key(win, "KeyA", "a", { ctrlKey: true });
        let cc = cuesView.selBounds();
        const colWholeOk = cc && cc.r0 === 0 && cc.r1 === lastCue && cc.c0 === 5 && cc.c1 === 5;
        key(win, "ArrowRight", "ArrowRight", { ctrlKey: true });
        key(win, "ArrowRight", "ArrowRight", { ctrlKey: true });
        cc = cuesView.selBounds();
        const colWidenOk = cc.c0 === 5 && cc.c1 === 7 && cc.r1 === lastCue &&
          cuesView.cursor.col === 2 + 7; // the cursor rides the moving edge
        key(win, "ArrowLeft", "ArrowLeft", { ctrlKey: true });
        const colNarrowOk = cuesView.selBounds().c1 === 6;
        key(win, "KeyC", "c", { ctrlKey: true });
        const colClipOk = store.cueClipboard.rows === lastCue + 1 && store.cueClipboard.chans === 2;
        // A cursor on a Cmd word selects THAT command column: the commands are
        // a column too, they just belong to the cue rather than to a voice.
        cuesView.clearSelection();
        cuesView.cursor = { cue: 0, col: 0, nib: 0 };
        key(win, "KeyA", "a", { ctrlKey: true });
        let cmdCol = cuesView.selBounds();
        const cmdColOk = cmdCol && cmdCol.cmd === true && cmdCol.r0 === 0 &&
          cmdCol.r1 === lastCue && cmdCol.c0 === 0 && cmdCol.c1 === 0;
        // …and Ctrl+→ reaches Cmd2 and stops: there is no third command word.
        key(win, "ArrowRight", "ArrowRight", { ctrlKey: true });
        key(win, "ArrowRight", "ArrowRight", { ctrlKey: true });
        cmdCol = cuesView.selBounds();
        const cmdWidenOk = cmdCol.cmd === true && cmdCol.c0 === 0 && cmdCol.c1 === 1 &&
          cuesView.cursor.col === 1;
        const colOk = colWholeOk && colWidenOk && colNarrowOk && colClipOk &&
          cmdColOk && cmdWidenOk;
        log(`cues Ctrl+A column: whole=${colWholeOk} widen=${colWidenOk} narrow=${colNarrowOk} clip=${colClipOk} cmdCol=${cmdColOk} cmdWiden=${cmdWidenOk}`);
        cuesView.clearSelection();

        // ── 8c. The Cmd columns are a block space of their own: fill ──
        const { cueInfo } = await import("../../src/doc/document.js");
        const { INST_PATLEN, INST_NOP } = await import("../../src/engine/state.js");
        const instOf = (cue, slot) => {
          const i = cueInfo(song.cues[cue]);
          return slot === 0 ? i.inst0 : i.inst1;
        };
        // Pattern numbers under the block — a command edit must not touch them.
        const seedPats = [0x0101, 0x0102, 0x0103, 0x0104];
        store.undo.apply(setCuesOp(0, seedPats.map((value, cue) => ({ cue, ch: 0, value }))));
        const patsIntact = () => seedPats.every((p, c) => (song.cues[c][0] & 0x7fff) === p);
        cuesView.cursor = { cue: 0, col: 0, nib: 0 };
        for (let i = 0; i < 3; i++) key(win, "ArrowDown", "ArrowDown", { shiftKey: true });
        const cmdSel = cuesView.selBounds();
        const cmdSelOk = cmdSel && cmdSel.cmd === true && cmdSel.r0 === 0 && cmdSel.r1 === 3 &&
          cmdSel.c0 === 0 && cmdSel.c1 === 0;
        key(win, "Space", " ");                     // Space opens the popup…
        await answerCmd(win, "len", "1E");          // …and LEN $1E fills the block
        const filledOk = [0, 1, 2, 3].every((c) => {
          const i = instOf(c, 0);
          return i.type === INST_PATLEN && i.arg === 30;
        });
        const fillKeptPats = patsIntact();
        log(`fill cues 0..3 Cmd1 with LEN $1E: sel=${cmdSelOk} filled=${filledOk} patternsKept=${fillKeptPats}`);
        key(win, "KeyZ", "z", { ctrlKey: true });
        const fillUndoOk = [0, 1, 2, 3].every((c) => instOf(c, 0).type === INST_NOP);
        key(win, "KeyY", "y", { ctrlKey: true });   // redo — put the LEN back
        const fillRedoOk = instOf(3, 0).arg === 30;
        log(`the whole fill is one undo step: undo=${fillUndoOk} redo=${fillRedoOk}`);

        // ── 8d. Copy a command block and paste it over other cues ──
        cuesView.cursor = { cue: 0, col: 0, nib: 0 };
        cuesView.sel = { aCue: 0, aCh: 0, cue: 1, ch: 0, cmd: true };
        key(win, "KeyC", "c", { ctrlKey: true });
        const cmdClip = store.cueClipboard;
        const cmdClipOk = cmdClip && cmdClip.cmd === true && cmdClip.rows === 2 &&
          cmdClip.chans === 1 && eq([...cmdClip.words], [0x021d, 0x021d]);
        cuesView.clearSelection();
        const patAt6 = song.cues[6][0] & 0x7fff;
        cuesView.cursor = { cue: 6, col: 0, nib: 0 };
        key(win, "KeyV", "v", { ctrlKey: true });
        const cmdPasteOk = instOf(6, 0).arg === 30 && instOf(7, 0).arg === 30 &&
          (song.cues[6][0] & 0x7fff) === patAt6;
        log(`copy/paste command words: clip=${cmdClipOk} paste=${cmdPasteOk} patternKept=${(song.cues[6][0] & 0x7fff) === patAt6}`);
        key(win, "KeyZ", "z", { ctrlKey: true });

        // ── 8e. Delete blanks the commands and leaves the patterns alone ──
        // Cue 0 is left out of the block, so it also shows the delete stopping
        // at the block's edge rather than taking the whole column.
        cuesView.cursor = { cue: 1, col: 0, nib: 0 };
        cuesView.sel = { aCue: 1, aCh: 0, cue: 3, ch: 0, cmd: true };
        key(win, "Delete", "Delete");
        const cmdDelOk = [1, 2, 3].every((c) => instOf(c, 0).type === INST_NOP) &&
          instOf(0, 0).arg === 30 && patsIntact();
        log(`delete clears commands, keeps patterns: ${cmdDelOk}`);

        // ── 8f. The two spaces never straddle ──
        cuesView.clearSelection();
        cuesView.cursor = { cue: 0, col: 1, nib: 0 };
        key(win, "ArrowRight", "ArrowRight", { shiftKey: true });
        let sp = cuesView.selBounds();
        const noStraddleOut = sp.cmd === true && sp.c1 === 1 && cuesView.cursor.col === 1;
        cuesView.clearSelection();
        cuesView.cursor = { cue: 0, col: 2, nib: 0 };
        key(win, "ArrowLeft", "ArrowLeft", { shiftKey: true });
        sp = cuesView.selBounds();
        const noStraddleIn = sp.cmd === false && sp.c0 === 0 && cuesView.cursor.col === 2;
        // A command block is not something a channel cell can receive: with the
        // cursor on a voice it still lands on that cue's Cmd1, and no pattern
        // number is touched.
        cuesView.clearSelection();
        cuesView.cursor = { cue: 0, col: 0, nib: 0 };
        cuesView.sel = { aCue: 0, aCh: 0, cue: 0, ch: 0, cmd: true }; // cue 0 still holds LEN $1E
        key(win, "KeyC", "c", { ctrlKey: true });
        const decoyPat = song.cues[9][4] & 0x7fff;
        cuesView.clearSelection();
        cuesView.cursor = { cue: 9, col: 2 + 4, nib: 0 }; // …the cursor is on a voice
        key(win, "KeyV", "v", { ctrlKey: true });
        const spaceSafeOk = (song.cues[9][4] & 0x7fff) === decoyPat &&
          instOf(9, 0).type === INST_PATLEN && instOf(9, 0).arg === 30;
        key(win, "KeyZ", "z", { ctrlKey: true });
        const cmdOk = cmdSelOk && filledOk && fillKeptPats && fillUndoOk && fillRedoOk &&
          cmdClipOk && cmdPasteOk && cmdDelOk && noStraddleOut && noStraddleIn && spaceSafeOk;
        log(`command space: straddleOut=${noStraddleOut} straddleIn=${noStraddleIn} crossPaste=${spaceSafeOk}`);
        cuesView.clearSelection();

        // ── 9. draw() renders the phantom row + a selection without throwing ──
        let drawOk = true;
        try {
          cuesView.cursor = { cue: song.cues.length, col: 2 + 0, nib: 0 }; // phantom row
          cuesView.sel = { aCue: 0, aCh: 2, cue: 3, ch: 6, cmd: false };
          cuesView.resize();
          cuesView.draw();
          cuesView.cursor = { cue: 0, col: 1, nib: 0 };
          cuesView.sel = { aCue: 0, aCh: 0, cue: 5, ch: 1, cmd: true }; // a command block
          cuesView.draw();
        } catch (err) { drawOk = false; log(`  draw threw: ${err.message}`); }
        log(`draw phantom row + both kinds of selection: ${drawOk}`);

        const pass = editRowsOk && grew && materialised && shrankBack && noBloat && grewFar &&
          farUndo && selOk && clipOk && pasteOk && anchorOk && grewOnPaste && undoGrow && delBlanked &&
          cmdKept && escOk && kbOk && colOk && cmdOk && drawOk;
        log(pass ? "RESULT: PASS" : `RESULT: FAIL edit=${editRowsOk}/${grew}/${materialised} undo=${shrankBack} noBloat=${noBloat} grewFar=${grewFar}/${farUndo} sel=${selOk} clip=${clipOk} paste=${pasteOk} anchor=${anchorOk} growPaste=${grewOnPaste}/${undoGrow} del=${delBlanked}/${cmdKept} esc=${escOk} kb=${kbOk} col=${colOk} cmd=${cmdOk} draw=${drawOk}`);
      } catch (err) {
        log(`RESULT: ERROR ${err.message}\n${err.stack}`);
      }
    })();
  </script>
</body>
</html>
