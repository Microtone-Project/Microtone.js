<!doctype html><meta charset="utf-8"><title>instrument management smoke (items 72-74)</title>
<pre id="out">running…</pre>
<img src="/hang" hidden>
<iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1200px;height:760px"></iframe>
<script type="module">
const out = document.getElementById("out");
const log = (s) => { out.textContent += "\n" + s; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
window.addEventListener("error", (e) => log("ERROR: " + e.message));
const fire = (el, type) => el.dispatchEvent(new Event(type, { bubbles: true }));
(async () => {
 try {
  const app = document.getElementById("app");
  // Poll rather than await the "load" event: this script is a module (deferred),
  // so on a warm cache the iframe can finish loading BEFORE the listener is
  // attached and the event never arrives.
  const win = await new Promise((resolve) => {
    const poll = setInterval(() => {
      const w = app.contentWindow;
      if (w && w.document?.readyState === "complete") { clearInterval(poll); resolve(w); }
    }, 50);
  });
  for (let i = 0; i < 200 && !win.__microtone; i++) await sleep(50);
  const M = win.__microtone;
  if (!M) { log("no __microtone"); return; }
  for (let i = 0; i < 200 && !(M.store.doc && M.store.undo); i++) await sleep(50);
  const { store, instrumentsView: iv, projectView: pv, jam } = M;
  const doc = store.doc;
  // A real alert()/confirm() blocks the headless page — stub and record them.
  let lastAlert = null, confirmAnswer = true;
  win.alert = (m) => { lastAlert = m; log("  alert: " + m); };
  win.confirm = (m) => { log("  confirm: " + m); return confirmAnswer; };
  const dialogs = () => [...win.document.querySelectorAll("dialog")];
  const lastDialog = () => dialogs()[dialogs().length - 1];
  const btnIn = (dlg, label) => [...dlg.querySelectorAll("button")].find((b) => b.textContent === label);

  // "New metainstrument…" is now the second step of the toolbox's "Meta…"
  // chooser (item 167): click the button, then the Layered card. Resolves the
  // layer picker.
  const openMetaPicker = async () => {
    [...iv.listEl.querySelectorAll(".side-toolbar-inst button")]
      .find((b) => b.textContent === "Meta\u2026").click();
    for (let i = 0; i < 100 && !win.document.querySelector("dialog.kind-modal"); i++) await sleep(20);
    win.document.querySelectorAll("dialog.kind-modal .kind-card")[0].click();
    for (let i = 0; i < 100 && !win.document.querySelector("dialog.import-modal .meta-picker"); i++) await sleep(20);
    return lastDialog();
  };

  const baseline = doc.toBytes();
  const same = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
  iv.visible = true;
  iv.refresh();

  // ── item 72: build a metainstrument out of existing instruments ──
  const picks = doc.selectableInstrumentSlots().filter((s) => !doc.instruments[s].isMeta).slice(0, 2);
  const selBefore = doc.selectableInstrumentSlots().length;
  const metaDlg = await openMetaPicker();
  const t1 = !!metaDlg && metaDlg.open;
  log(`New metainstrument… opens the picker: ${t1 ? "ok" : "FAIL"}`);

  const pickRows = [...metaDlg.querySelectorAll(".meta-pick-row")];
  // Metainstruments must not be offered — layers resolve through triggerNote.
  const t2 = pickRows.length === doc.selectableInstrumentSlots()
    .filter((s) => !doc.instruments[s].isMeta).length;
  log(`picker lists only non-meta instruments (${pickRows.length}): ${t2 ? "ok" : "FAIL"}`);
  const okBtn = btnIn(metaDlg, "Create");
  const t3 = okBtn.disabled === true; // nothing picked yet
  log(`Create disabled with an empty selection: ${t3 ? "ok" : "FAIL"}`);

  const rowFor = (dlg, s) => [...dlg.querySelectorAll(".meta-pick-row")]
    .find((r) => Number(r.dataset.slot) === s);
  for (const s of picks) rowFor(metaDlg, s).querySelector(".meta-pick-hit").click();
  const nameIn = metaDlg.querySelector(".import-filter");
  nameIn.value = "Stack";
  okBtn.click();
  await sleep(60);

  const metaSlot = iv.selected;
  const meta = doc.instruments[metaSlot];
  const t4 = meta.isMeta && meta.metaLayers.length === picks.length &&
    meta.metaLayers.every((l) => l.instIdx >= 0x100 && l.mixOctet === 159);
  log(`created meta $${metaSlot.toString(16)} layers ${meta.metaLayers?.length} copies at $100+: ${t4 ? "ok" : "FAIL"}`);
  const t5 = doc.instrumentName(metaSlot) === "Stack" && jam.currentInst === metaSlot;
  log(`meta named + adopted as the current instrument: ${t5 ? "ok" : "FAIL"}`);
  // The originals stay selectable and playable; the copies are hidden children.
  const sel = doc.selectableInstrumentSlots();
  const t6 = picks.every((s) => sel.includes(s)) && sel.length === selBefore + 1 &&
    meta.metaLayers.every((l) => !sel.includes(l.instIdx));
  log(`originals intact (${selBefore}→${sel.length}), copies hidden: ${t6 ? "ok" : "FAIL"}`);

  // ── item 71 inside the new meta: Edit… reaches a copy's base editor ──
  iv.refresh();
  const layerEdit = [...iv.panel.querySelectorAll(".advCell button")]
    .filter((b) => b.textContent === "Edit…");
  const t7 = iv.tab === "meta" && layerEdit.length === picks.length;
  log(`Layers tab offers Edit… per layer: ${t7 ? "ok" : "FAIL"}`);
  layerEdit[0].click();
  const t8 = iv.selected === meta.metaLayers[0].instIdx && iv.advanced === false &&
    !!iv.panel.querySelector(".inst-parent-chip") && !!iv.panel.querySelector(".inst-name-input");
  log(`Edit… opens copy $${iv.selected.toString(16)} in its base editor: ${t8 ? "ok" : "FAIL"}`);
  iv.panel.querySelector(".inst-parent-chip").click();

  store.undo.undo();
  iv.refresh();
  const t9 = same(doc.toBytes(), baseline);
  log(`undo of the created meta is byte-exact: ${t9 ? "ok" : "FAIL"}`);

  // ── item 113: the same instrument N times = a unison stack over ONE copy ──
  const stackDlg = await openMetaPicker();
  const stackRow = [...stackDlg.querySelectorAll(".meta-pick-row")]
    .find((r) => Number(r.dataset.slot) === picks[0]);
  const plus = [...stackRow.querySelectorAll(".meta-step")].find((b) => b.textContent === "+");
  plus.click(); plus.click(); plus.click();
  const s1 = stackRow.querySelector(".meta-count").textContent === "×3";
  log(`the picker counts to 3: ${s1 ? "ok" : "FAIL"}`);
  const tallyTxt = stackDlg.querySelector(".import-tally").textContent;
  const s2 = /3 of 25 layers/.test(tallyTxt) && /3 voices per note/.test(tallyTxt);
  log(`tally states the cap and the voice cost ("${tallyTxt}"): ${s2 ? "ok" : "FAIL"}`);
  stackDlg.querySelector(".import-filter").value = "Chorded";
  btnIn(stackDlg, "Create").click();
  await sleep(80);

  const stackSlot = iv.selected;
  const stack = doc.instruments[stackSlot];
  const kids = new Set(stack.metaLayers.map((l) => l.instIdx & 0x3ff));
  const s3 = stack.isMeta && stack.metaLayers.length === 3 && kids.size === 1 &&
    [...kids][0] >= 0x100 && doc.selectableInstrumentSlots().includes(picks[0]);
  log(`×3 builds 3 layers over 1 sub-instrument copy: ${s3 ? "ok" : "FAIL"}`);

  // The chord stack detunes them without touching that shared copy.
  iv.refresh();
  const chordBtn = [...iv.panel.querySelectorAll("tbody tr")[0].querySelectorAll(".meta-act")]
    .find((b) => b.textContent === "Chord…");
  chordBtn.click();
  for (let i = 0; i < 100 && !dialogs().some((d) => /Chord stack/.test(d.textContent)); i++) await sleep(20);
  const chordDlg = lastDialog();
  // item 167: family picker, then the chord menu, then Inversion.
  const [famSel2, sel2, invSel] = chordDlg.querySelectorAll("select");
  famSel2.value = "triad"; fire(famSel2, "change");
  sel2.value = "major"; fire(sel2, "change");

  // item 138: the same vocabulary as the Sample Lab, inversions included. A
  // 1st-inversion major triad is built UP from its third, so the layer you
  // already have becomes the third — a just minor third (6/5, +315.6¢) to the
  // fifth above it and a minor sixth (8/5, +813.7¢) to the root.
  const invOk = !!invSel && invSel.options.length === 3;
  invSel.value = "1"; fire(invSel, "change");
  const invPreview = [...chordDlg.querySelectorAll(".meta-chord-voice")]
    .map((r) => r.textContent).join(" | ");
  const s3b = invOk && /\+315/.test(invPreview) && /\+813/.test(invPreview) &&
    chordDlg.querySelectorAll(".meta-chord-voice").length === 3;
  log(`chord stack offers inversions ("${invPreview}"): ${s3b ? "ok" : "FAIL"}`);
  invSel.value = "0"; fire(invSel, "change");

  // item 167: Preview auditions the stack — the base layer's OWN sub-instrument
  // at each pitch the panel is showing, on the jam bank, one voice per note.
  const playBtn = btnIn(chordDlg, "Preview");
  if (!store.audio) log("chord stack preview: FAIL (no audio system)");
  const jamCalls = [];
  const realJam = store.audio.jamNote.bind(store.audio);
  const realStop = store.audio.jamStopVoice.bind(store.audio);
  let stops = 0;
  store.audio.jamNote = (...a) => { jamCalls.push(a); return realJam(...a); };
  store.audio.jamStopVoice = (...a) => { stops++; return realStop(...a); };
  playBtn.click();
  const shownNotes = [...chordDlg.querySelectorAll(".meta-chord-voice")].length;
  const s3c = !!playBtn && jamCalls.length === shownNotes &&
    new Set(jamCalls.map((a) => a[1])).size === shownNotes &&
    jamCalls.every((a) => (a[3] & 0x3ff) >= 0x100) && playBtn.textContent === "Stop";
  log(`chord stack previews every voice (${jamCalls.length} notes on ` +
    `${new Set(jamCalls.map((a) => a[1])).size} voices): ${s3c ? "ok" : "FAIL"}`);
  playBtn.click();
  const s3d = playBtn.textContent === "Preview" && stops === 1;
  log(`…and the same button stops it: ${s3d ? "ok" : "FAIL"}`);
  // changing the chord must not leave the OLD one ringing
  playBtn.click();
  sel2.value = "minor"; fire(sel2, "change");
  const s3e = playBtn.textContent === "Preview" && stops >= 2;
  log(`…and picking another chord stops it too: ${s3e ? "ok" : "FAIL"}`);
  store.audio.jamNote = realJam;
  store.audio.jamStopVoice = realStop;
  sel2.value = "major"; fire(sel2, "change");

  // item 167: a long chord label must not walk over the Inversion control. The
  // <select> is wrapped in a .mt-pick button group by the control enhancer, and
  // it is the GROUP that overflowed its field and painted across the label
  // beside it — measure the group, not the select inside it.
  const longOpt = win.document.createElement("option");
  longOpt.value = "major";
  longOpt.textContent = "A preposterously long chord name that would blow the row wide open";
  sel2.appendChild(longOpt);
  sel2.selectedIndex = sel2.options.length - 1;
  await sleep(30);
  const dlgBox = chordDlg.getBoundingClientRect();
  const pickBox = (sel2.closest(".mt-pick") || sel2).getBoundingClientRect();
  const invFieldBox = (invSel.closest(".chord-bar-field") || invSel).getBoundingClientRect();
  // Either the row wrapped and Inversion sits below, or it is clear to the
  // right — both are fine, overlapping is not.
  const clear = pickBox.right <= invFieldBox.left + 1 ||
    invFieldBox.top >= pickBox.bottom - 1;
  const s3f = clear && pickBox.right <= dlgBox.right + 1 && invFieldBox.width > 0;
  log(`a long chord label never covers the Inversion control ` +
    `(chord picker ends ${Math.round(pickBox.right)}, Inversion starts ` +
    `${Math.round(invFieldBox.left)}, dialog ends ${Math.round(dlgBox.right)}): ${s3f ? "ok" : "FAIL"}`);
  longOpt.remove();
  sel2.value = "major"; fire(sel2, "change");

  const voiceCount = chordDlg.querySelectorAll(".meta-chord-voice").length;
  btnIn(chordDlg, "Add voices").click();
  await sleep(60);
  const detunes = doc.instruments[stackSlot].metaLayers.map((l) => l.detune);
  const stillOne = new Set(doc.instruments[stackSlot].metaLayers.map((l) => l.instIdx & 0x3ff)).size;
  // Just intonation, like the Sample Lab's chord maker: 5/4 = 4096·log2(1.25)
  // ≈ 1319 units, 3/2 ≈ 2396 — not the 12-TET 1365 / 2389.
  const near = (want) => detunes.some((d) => Math.abs(d - want) <= 1);
  const s4 = voiceCount === 3 && doc.instruments[stackSlot].metaLayers.length === 5 &&
    near(1319) && near(2396) && stillOne === 1;
  log(`chord stack adds a major triad, still one copy (${detunes.join(",")}): ${s4 ? "ok" : "FAIL"}`);

  while (store.undo.canUndo()) store.undo.undo();
  iv.refresh();
  const s5 = same(doc.toBytes(), baseline);
  log(`undo of the whole stack is byte-exact: ${s5 ? "ok" : "FAIL"}`);

  // ── item 73: renumber an instrument ──
  const from = doc.selectableInstrumentSlots()[0];
  const free = [...Array(255).keys()].map((i) => i + 1)
    .find((s) => !doc.usedInstrumentSlots().includes(s));
  iv.selected = from;
  iv.refresh();
  const renumBtn = iv.panel.querySelector(".inst-renum-btn");
  const t10 = !!renumBtn;
  log(`name row has a Renumber… button: ${t10 ? "ok" : "FAIL"}`);

  // Occupied target → refused, nothing changes.
  const occupied = doc.selectableInstrumentSlots()[1];
  renumBtn.click();
  await sleep(40);
  let dlg = lastDialog();
  dlg.querySelector("input[name=to]").value = occupied.toString(16);
  btnIn(dlg, "Renumber").click();
  await sleep(40);
  const t11 = /already taken/.test(lastAlert ?? "") && same(doc.toBytes(), baseline);
  log(`occupied target refused, document untouched: ${t11 ? "ok" : "FAIL"}`);

  // Free target, patterns left pointing at the old number (the default).
  const refsBefore = [];
  doc.songs.forEach((song, si) => song.patterns.forEach((p, pi) => p && p.forEach((c, r) => {
    if ((c.instrment & 0xff) === from) refsBefore.push(`${si}:${pi}:${r}`);
  })));
  renumBtn.click();
  await sleep(40);
  dlg = lastDialog();
  const hasCheckbox = !!dlg.querySelector("input[name=cells][type=checkbox]");
  dlg.querySelector("input[name=to]").value = free.toString(16);
  btnIn(dlg, "Renumber").click();
  await sleep(40);
  const movedRefs = [];
  doc.songs.forEach((song, si) => song.patterns.forEach((p, pi) => p && p.forEach((c, r) => {
    if ((c.instrment & 0xff) === free) movedRefs.push(`${si}:${pi}:${r}`);
  })));
  const t12 = hasCheckbox && doc.usedInstrumentSlots().includes(free) &&
    !doc.usedInstrumentSlots().includes(from) && movedRefs.length === 0 &&
    iv.selected === free && jam.currentInst === free;
  log(`renumber $${from.toString(16)}→$${free.toString(16)}, patterns left alone (${refsBefore.length} refs): ${t12 ? "ok" : "FAIL"}`);
  store.undo.undo();
  const t13 = same(doc.toBytes(), baseline);
  log(`undo of the renumber is byte-exact: ${t13 ? "ok" : "FAIL"}`);

  // Same move with the "point the cells at the new number" box ticked.
  iv.selected = from;
  iv.refresh();
  iv.panel.querySelector(".inst-renum-btn").click();
  await sleep(40);
  dlg = lastDialog();
  dlg.querySelector("input[name=to]").value = free.toString(16);
  const cellsBox = dlg.querySelector("input[name=cells]");
  cellsBox.checked = true;
  btnIn(dlg, "Renumber").click();
  await sleep(40);
  const moved = [];
  doc.songs.forEach((song, si) => song.patterns.forEach((p, pi) => p && p.forEach((c, r) => {
    if ((c.instrment & 0xff) === free) moved.push(`${si}:${pi}:${r}`);
  })));
  const t14 = moved.length === refsBefore.length && moved.every((k, i) => k === refsBefore[i]);
  log(`with the box ticked the ${refsBefore.length} cells follow: ${t14 ? "ok" : "FAIL"}`);
  store.undo.undo();
  const t15 = same(doc.toBytes(), baseline);
  log(`undo of the pattern-remapping renumber is byte-exact: ${t15 ? "ok" : "FAIL"}`);

  // ── item 114: duplicate an instrument (samples shared, not copied) ──
  iv.selected = from;
  iv.refresh();
  const dupBtn = iv.panel.querySelector(".inst-dup-btn");
  const t18 = !!dupBtn && dupBtn.textContent === "Duplicate";
  log(`name row has a Duplicate button: ${t18 ? "ok" : "FAIL"}`);
  const poolBefore = doc.sampleBin.slice();
  const censusBefore = doc.sampleList().map((e) => `${e.ptr}:${e.len}`).join(",");
  const srcName = doc.instrumentName(from);
  const usedBefore = doc.usedInstrumentSlots().length;
  dupBtn.click();
  await sleep(60);
  const dup = iv.selected;
  const recSame = [...doc.instRecordBytes(dup)].every((b, i) => b === doc.instRecordBytes(from)[i]);
  const t19 = dup !== from && dup >= 1 && dup <= 0xff && recSame &&
    doc.usedInstrumentSlots().length === usedBefore + 1 && jam.currentInst === dup;
  log(`Duplicate copies $${from.toString(16)} → $${dup.toString(16)} and selects it: ${t19 ? "ok" : "FAIL"}`);
  const t20 = doc.instrumentName(dup) === srcName + " (2)" &&
    !!iv.listEl.querySelector(".side-row.sel") &&
    [...iv.listEl.querySelectorAll(".side-row")].some((r) => r.querySelector(".name").textContent === srcName + " (2)");
  log(`the copy is named "${doc.instrumentName(dup)}" and listed: ${t20 ? "ok" : "FAIL"}`);
  // The whole point: no sample bytes are spent on a derivative instrument.
  const t21 = same(doc.sampleBin, poolBefore) &&
    doc.sampleList().map((e) => `${e.ptr}:${e.len}`).join(",") === censusBefore;
  log(`sample pool and census untouched: ${t21 ? "ok" : "FAIL"}`);
  store.undo.undo();
  iv.refresh();
  const t22 = same(doc.toBytes(), baseline);
  log(`undo of the duplicate is byte-exact: ${t22 ? "ok" : "FAIL"}`);

  // ── select mode: duplicate, renumber and delete several at once ──
  const footBtn = (cls) => iv.listEl.querySelector(".side-foot-inst " + cls);
  const rowOf = (s) => iv.rowEls.find((r) => r.slot === s)?.el;
  iv.refresh();
  footBtn(".inst-select-btn").click();
  const m1 = iv.selecting && !!footBtn(".inst-dup-many") && footBtn(".inst-dup-many").disabled;
  log(`Select shows the bulk actions, disabled with nothing picked: ${m1 ? "ok" : "FAIL"}`);
  // Three consecutive instruments with free numbers above them.
  const usedNow = new Set(doc.usedInstrumentSlots());
  const listed = doc.selectableInstrumentSlots();
  const runStart = listed.find((s) => s + 2 <= 0xfc && listed.includes(s + 1) && listed.includes(s + 2) &&
    !usedNow.has(s + 3) && !usedNow.has(s + 4));
  const run = runStart === undefined ? [] : [runStart, runStart + 1, runStart + 2];
  const editedBefore = iv.selected;
  rowOf(run[0]).click();
  rowOf(run[2]).dispatchEvent(new MouseEvent("click", { bubbles: true, shiftKey: true }));
  const m2 = run.length === 3 && run.every((s) => iv.picked.has(s) && rowOf(s).classList.contains("picked")) &&
    iv.picked.size === 3 && iv.selected === editedBefore &&
    /3 selected/.test(iv.listEl.querySelector(".inst-sel-count").textContent);
  log(`click + Shift+click picks $${runStart?.toString(16)}–$${(runStart + 2).toString(16)}, the edited one stays: ${m2 ? "ok" : "FAIL"}`);

  // Renumber by +2: the run overlaps itself, which a one-at-a-time move would refuse.
  footBtn(".inst-renum-many").click();
  await sleep(40);
  dlg = lastDialog();
  dlg.querySelector("input[name=by]").value = "+2";
  btnIn(dlg, "Renumber").click();
  await sleep(60);
  const m3 = run.every((s) => doc.usedInstrumentSlots().includes(s + 2)) &&
    !doc.usedInstrumentSlots().includes(run[0]) && !doc.usedInstrumentSlots().includes(run[1]) &&
    run.every((s) => iv.picked.has(s + 2));
  log(`Renumber… +2 moves all three in one go, the picks follow: ${m3 ? "ok" : "FAIL"}`);
  store.undo.undo();
  iv.refresh();
  const m4 = same(doc.toBytes(), baseline);
  log(`one undo restores the whole renumber byte-exact: ${m4 ? "ok" : "FAIL"}`);

  // A negative amount that would leave $01 is refused.
  iv.picked = new Set(run);
  iv.syncPicks();
  footBtn(".inst-renum-many").click();
  await sleep(40);
  dlg = lastDialog();
  dlg.querySelector("input[name=by]").value = "-" + run[0].toString(16);
  lastAlert = null;
  btnIn(dlg, "Renumber").click();
  await sleep(40);
  const m5 = /must be/.test(lastAlert ?? "") && same(doc.toBytes(), baseline);
  log(`a shift below $01 is refused, document untouched: ${m5 ? "ok" : "FAIL"}`);

  // Duplicate the three: the picks move onto the copies.
  const usedCount = doc.usedInstrumentSlots().length;
  footBtn(".inst-dup-many").click();
  await sleep(60);
  const copies = [...iv.picked];
  const m6 = doc.usedInstrumentSlots().length === usedCount + 3 && copies.length === 3 &&
    copies.every((s) => !run.includes(s) && doc.usedInstrumentSlots().includes(s));
  log(`Duplicate copies all three and picks the copies (${copies.map((s) => "$" + s.toString(16)).join(", ")}): ${m6 ? "ok" : "FAIL"}`);

  // …and Delete… takes the copies away again, in one step.
  footBtn(".inst-del-many").click();
  await sleep(40);
  dlg = lastDialog();
  const m7 = /Delete 3 instruments/.test(dlg.textContent);
  btnIn(dlg, "Delete").click();
  await sleep(60);
  const m8 = m7 && doc.usedInstrumentSlots().length === usedCount &&
    copies.every((s) => !doc.usedInstrumentSlots().includes(s)) && iv.picked.size === 0;
  log(`Delete… removes the three copies in one dialog: ${m8 ? "ok" : "FAIL"}`);
  store.undo.undo();
  store.undo.undo();
  iv.refresh();
  const m9 = same(doc.toBytes(), baseline);
  log(`undo, undo: back to the start byte-exact: ${m9 ? "ok" : "FAIL"}`);

  footBtn(".inst-select-btn").click();
  const m10 = !iv.selecting && !iv.listEl.querySelector(".side-row.picked") &&
    [...iv.listEl.querySelectorAll(".side-foot-inst button")].some((b) => b.textContent === "Export…");
  log(`Done leaves select mode, Export… is back: ${m10 ? "ok" : "FAIL"}`);
  // Ctrl+click starts select mode with the edited instrument already picked.
  const other = listed.find((s) => s !== iv.selected);
  rowOf(other).dispatchEvent(new MouseEvent("click", { bubbles: true, ctrlKey: true }));
  const m11 = iv.selecting && iv.picked.has(other) && iv.picked.has(iv.selected) && iv.picked.size === 2;
  log(`Ctrl+click starts picking with the edited instrument: ${m11 ? "ok" : "FAIL"}`);
  iv.setSelecting(false);

  // ── item 74: cleanup unreachable instrument patches ──
  pv.visible = true;
  pv.refresh();
  const cleanBtn = [...pv.root.querySelectorAll("button")]
    .find((b) => b.textContent === "Cleanup instrument patches");
  const t16 = !!cleanBtn;
  log(`Housekeeping offers Cleanup instrument patches: ${t16 ? "ok" : "FAIL"}`);
  lastAlert = null;
  cleanBtn.click();
  await sleep(40);
  // WHEN is converter output: every patch is reachable, so this is a no-op.
  const t17 = /Nothing to clean up/.test(lastAlert ?? "") && same(doc.toBytes(), baseline);
  log(`clean corpus → nothing to clean, document untouched: ${t17 ? "ok" : "FAIL"}`);

  const results = out.textContent.match(/: (ok|FAIL)$/gm) ?? [];
  const fails = results.filter((r) => r.endsWith("FAIL")).length;
  log(`\nRESULT: ${fails === 0 ? "PASS" : "FAIL"} (${results.length - fails}/${results.length})`);
 } catch (err) {
  log("EXCEPTION: " + (err && err.stack || err));
  log("\nRESULT: FAIL");
 }
})();
</script>
