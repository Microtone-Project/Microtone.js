<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chord maker smoke: voice modes, notation degrees, mix + Lab hand-off (item 89)</title>
</head>
<body>
  <pre id="out">running…</pre>
  <!-- The Lab's audition and the chord preview need an AudioContext, i.e. REAL
       time (virtual-time starves the audio threads). Run:
         python3 tools/test-server.py &   # repo server + /hang on :8932
         chromium --headless=new --autoplay-policy=no-user-gesture-required \
           --dump-dom --timeout=45000 \
           http://localhost:8932/test/browser/chord-smoke.html -->
  <img src="/hang" hidden>
  <iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1200px;height:700px"></iframe>
  <script type="module">
    const out = [];
    const log = (line) => {
      out.push(line);
      console.log("SMOKE: " + line);
      document.getElementById("out").textContent = out.join("\n");
    };
    const ok = (cond, name) => log(`${name}: ${cond ? "ok" : "FAIL"}`);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const waitFor = async (fn, ms = 15000) => {
      const t0 = Date.now();
      for (;;) {
        const v = fn();
        if (v) return v;
        if (Date.now() - t0 > ms) throw new Error("waitFor timeout");
        await sleep(50);
      }
    };

    (async () => {
      try {
        const frame = document.getElementById("app");
        const win = await waitFor(() => {
          const w = frame.contentWindow;
          return w && w.__microtone?.store.doc ? w : null;
        }, 30000);
        const { store } = win.__microtone;
        win.alert = () => {};
        win.confirm = () => true;
        log("app loaded");

        // ── leg A: the maker standalone, on a synthetic 1 kHz tone ──────────
        const { openChordMaker } = await win.eval('import("/src/ui/popups/chordmaker.js")');
        const rate = 32000;
        const data = new win.Float32Array(rate); // 1 s
        for (let i = 0; i < data.length; i++) data[i] = 0.5 * Math.sin((2 * Math.PI * 1000 * i) / rate);

        const pMaker = openChordMaker(store, { data, rate, name: "smoke tone" });
        const dlg = await waitFor(() => win.document.querySelector(".chord-modal"));
        const ch = dlg.__chord;
        ok(dlg.querySelectorAll(".chord-voice").length === 6, "a1 six voice slots");
        ok(ch.voices().filter((v) => v.on).length === 3, "a2 opens on a major triad");

        // a2b (items 138, 167): family first, chords second. One dropdown
        // cannot hold the whole vocabulary any more — 143 chords in 31-TET —
        // so the family picker lists the families THIS tuning has and the
        // chord menu holds one of them at a time. A 12-TET project has no
        // tuning-specific family at all (item 141, 167).
        const { CHORD_GROUPS, CHORD_PRESETS, chordPresetsFor } =
          await win.eval('import("/src/doc/chord.js")');
        const menu = chordPresetsFor(store.pitchPreset);
        const groups = CHORD_GROUPS.filter((g) => menu.some((p) => p.group === g));
        const famSel = dlg.querySelector(".chord-family");
        const presetSel = dlg.querySelector(".chord-preset");
        const inFamily = (g) => menu.filter((p) => p.group === g).length;
        ok(famSel.options.length === groups.length &&
          [...famSel.options].every((o, i) => o.value === groups[i]),
          `a2b family menu lists this tuning's families (${[...famSel.options].map((o) => o.value).join(", ")})`);
        ok(famSel.value === "triad" && presetSel.options.length === inFamily("triad") &&
          presetSel.value === "major",
          `a2b1 …opening on the family the default chord belongs to ` +
          `(${famSel.value}, ${presetSel.options.length} chords)`);
        ok(menu.length < CHORD_PRESETS.length && !menu.some((p) => p.notation !== undefined),
          `a2b2 a 12-TET project is offered no per-tuning chords (${CHORD_PRESETS.length - menu.length} hidden)`);
        // …and no single chord menu is ever longer than one family
        ch.setChordPreset("dom13");
        await sleep(30);
        ok(famSel.value === "extended" && presetSel.options.length === inFamily("extended") &&
          presetSel.value === "dom13",
          `a2b3 picking a chord follows its family (${famSel.value}, ${presetSel.options.length} chords)`);
        famSel.value = "spread"; famSel.dispatchEvent(new win.Event("change", { bubbles: true }));
        await sleep(30);
        ok(presetSel.options.length === inFamily("spread") && presetSel.value === "power" &&
          ch.preset().id === "power",
          `a2b4 changing family lands on its first chord (${presetSel.value})`);
        ch.setChordPreset("major");
        await sleep(30);
        ok([...presetSel.querySelectorAll("option")].every((o) => o.textContent && !/^chord\./.test(o.textContent)),
          "a2c every chord is named (no raw i18n keys)");

        // a3: the readouts the whole UI exists for — ratio, cents, glyph, and
        // how far the just third sits from 12-TET's own E
        const read1 = ch.read(1);
        ok(/×1\.2500/.test(read1) && /\+386/.test(read1) && /−13|-13/.test(read1),
          `a3 just-third readout names ratio, cents and grid offset (got "${read1}")`);
        const glyphPainted = (() => {
          const cv = dlg.querySelectorAll(".chord-voice")[1].querySelector(".cv-glyph");
          const px = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
          const first = [px[0], px[1], px[2]];
          for (let i = 4; i < px.length; i += 4) {
            if (px[i] !== first[0] || px[i + 1] !== first[1] || px[i + 2] !== first[2]) return true;
          }
          return false;
        })();
        ok(glyphPainted, "a4 the voice paints a note glyph");

        // a5: the four modes are independent, per note
        ch.setVoice(0, { on: true, mode: "ji", ji: "3/2" });
        ch.setVoice(1, { on: true, mode: "key", step: 4 });
        ch.setVoice(2, { on: true, mode: "units", units: 0x100 });
        ch.setVoice(3, { on: true, mode: "ratio", ratio: 1.9632 });
        const u = [0, 1, 2, 3].map((i) => ch.units(i));
        ok(Math.abs(u[0] - 4096 * Math.log2(1.5)) < 1e-6, `a5 v1 just fifth (${u[0].toFixed(1)})`);
        ok(u[1] === 0x555, `a5b v2 four degrees of 12-TET (${u[1]})`);
        ok(u[2] === 0x100, "a5c v3 raw 4096-TET offset");
        ok(Math.abs(u[3] - 4096 * Math.log2(1.9632)) < 1e-6, "a5d v4 typed ratio");

        // a6: degrees follow the SONG's notation — switch it and v2 moves
        const prevPreset = store.pitchPreset;
        store.pitchPreset = (await win.eval('import("/src/ui/pitchtables.js")')).pitchTablePresets[240];
        const pMaker24 = openChordMaker(store, { data, rate, name: "24-TET" });
        const dlg24 = await waitFor(() => {
          const l = [...win.document.querySelectorAll(".chord-modal")];
          return l.length === 2 ? l[1] : null;
        });
        dlg24.__chord.setVoice(0, { on: true, mode: "key", step: 4 });
        ok(dlg24.__chord.units(0) === 0x2ab, `a6 4 degrees of 24-TET is a whole tone (${dlg24.__chord.units(0)})`);
        dlg24.__chord.cancel();
        ok((await pMaker24) === null, "a6b cancel resolves null");

        // a6c (item 141): tetrachords appear in the tuning they belong to, and
        // picking one really does span that tuning's perfect fourth
        const pitchTables = (await win.eval('import("/src/ui/pitchtables.js")')).pitchTablePresets;
        store.pitchPreset = pitchTables[170];
        const pMaker17 = openChordMaker(store, { data, rate, name: "17-TET" });
        const dlg17 = await waitFor(() => {
          const l = [...win.document.querySelectorAll(".chord-modal")];
          return l.length === 2 ? l[1] : null;
        });
        const sel17 = dlg17.querySelector(".chord-preset");
        const fam17 = dlg17.querySelector(".chord-family");
        const famChords = (g) => {
          fam17.value = g; fam17.dispatchEvent(new win.Event("change", { bubbles: true }));
          return [...sel17.options];
        };
        const tetras = famChords("tetrachord");
        ok(tetras.length === 15 && tetras.every((o) => o.value.startsWith("tetra")),
          `a6c 17-TET is offered its 15 tetrachords (${tetras.length})`);
        ok(tetras.some((o) => o.textContent === "3-3-1 · ionian (jins ʻAjam)"),
          "a6c2 …named as the wiki names them");
        dlg17.__chord.setChordPreset("tetra170-3-3-1");
        await sleep(50);
        const tetraUnits = [0, 1, 2, 3].map((i) => dlg17.__chord.units(i));
        ok(tetraUnits[0] === 0 && tetraUnits[3] === pitchTables[170].table[7],
          `a6c3 …and it spans 17-TET's own fourth (${tetraUnits.join(", ")})`);
        ok(dlg17.querySelector(".chord-inv").disabled,
          "a6c4 a tetrachord has no inversions");

        // a6d (item 167): the same tuning also carries the arto/tendo chords —
        // in their own family, and — unlike a tetrachord — they invert
        const xcs = famChords("extraclassical");
        ok(xcs.length === 13 && xcs.every((o) => o.value.startsWith("xc")),
          `a6d 17-TET is offered its 13 arto/tendo chords (${xcs.length})`);
        // …and no family is ever longer than the longest one this tuning has
        const longest = Math.max(...[...fam17.options].map((o) => famChords(o.value).length));
        ok(longest === 15, `a6d1 no chord menu exceeds one family (longest ${longest})`);
        dlg17.__chord.setChordPreset("xc170-3-cross");
        await sleep(50);
        const xcUnits = [0, 1, 2, 3].map((i) => dlg17.__chord.units(i));
        ok(xcUnits[0] === 0 && xcUnits[1] === pitchTables[170].table[3] &&
           xcUnits[2] === pitchTables[170].table[7] && xcUnits[3] === pitchTables[170].table[10],
          `a6d2 cross-tonal stands on 0/arto/tendo/fifth (${xcUnits.join(", ")})`);
        ok(!dlg17.querySelector(".chord-inv").disabled &&
           dlg17.querySelector(".chord-inv").options.length === 4,
          "a6d3 …and it has the three inversions a four-voice chord has");
        dlg17.__chord.setInversion(1);
        await sleep(50);
        ok(dlg17.__chord.units(0) === pitchTables[170].table[3] &&
           dlg17.__chord.units(3) === 0x1000,
          "a6d4 the 1st inversion lifts the root over the top");
        dlg17.__chord.cancel();
        await pMaker17;
        store.pitchPreset = prevPreset;

        // a7: the mix — three notes at unison length, normalised to full scale
        ch.setChordPreset("major");
        await sleep(300);
        const mix = ch.mix();
        let peak = 0;
        for (let i = 0; i < mix.data.length; i++) peak = Math.max(peak, Math.abs(mix.data[i]));
        ok(mix.voices === 3 && mix.data.length === data.length, "a7 major triad, source length");
        ok(Math.abs(peak - 1) < 1e-4, `a7b normalised to full scale (${peak.toFixed(4)})`);

        // a7c (item 138): inversions re-seed the slots — the root goes on top,
        // and the menu only offers the inversions the chord actually has
        const invSel = dlg.querySelector(".chord-inv");
        ok(invSel.options.length === 3 && invSel.value === "0",
          `a7c a triad offers root + two inversions (${invSel.options.length})`);
        invSel.value = "1";
        invSel.dispatchEvent(new win.Event("change", { bubbles: true }));
        await sleep(300);
        const inv1 = [0, 1, 2].map((i) => Math.round((ch.units(i) * 1200) / 4096));
        ok(JSON.stringify(inv1) === JSON.stringify([386, 702, 1200]),
          `a7d 1st inversion sits on the third (${inv1.join(", ")})`);
        ok(ch.mix().voices === 3, "a7e …and it is still a three-voice mix");
        // a taller chord grows the menu; the inversion is kept and clamped back
        ch.setChordPreset("dom13", 5);
        await sleep(300);
        ok(dlg.querySelector(".chord-inv").options.length === 6 && ch.preset().inversion === 5,
          `a7f a six-voice chord has five inversions (${ch.preset().options})`);
        ok(ch.voices().filter((v) => v.on).length === 6, "a7g …and fills all six slots");
        // …and switching family is a chord change like any other: it lands on
        // that family's first chord and clamps the inversion to what it has
        famSel.value = "triad"; famSel.dispatchEvent(new win.Event("change", { bubbles: true }));
        await sleep(300);
        ok(ch.preset().id === "major" && ch.preset().inversion === 2 &&
          ch.voices().filter((v) => v.on).length === 3,
          `a7h back to a triad clamps the inversion (${ch.preset().id}, ${ch.preset().inversion})`);
        ch.setChordPreset("major", 0);
        await sleep(300);

        // a8: a note below unison stretches the result; "source length" caps it
        ch.setVoice(3, { on: true, mode: "ji", ji: "1/1", oct: -1 });
        await sleep(300);
        ok(ch.mix().data.length === data.length * 2, `a8 an octave down doubles the length (${ch.mix().data.length})`);
        ch.setLength("source");
        await sleep(300);
        ok(ch.mix().data.length === data.length, "a8b source length crops the low voice");
        ch.setLength("longest");
        ch.setVoice(3, { on: false });

        // a9: normalise off leaves the raw sum, and the info line reports peak
        ch.setNormalise(false);
        await sleep(300);
        let rawPeak = 0;
        const raw = ch.mix().data;
        for (let i = 0; i < raw.length; i++) rawPeak = Math.max(rawPeak, Math.abs(raw[i]));
        ok(rawPeak > 1.05, `a9 three copies at unity overshoot (${rawPeak.toFixed(3)})`);
        ok(/dBFS/.test(ch.info()), `a9b info reports the mix peak (got "${ch.info()}")`);
        ch.setNormalise(true);
        await sleep(300);

        ch.apply();
        const applied = await pMaker;
        ok(applied && applied.data.length === data.length, "a10 Apply resolves with the mix");

        // ── leg B: through the Sample Lab, all the way into the pool ────────
        const { openSampleLab } = await win.eval('import("/src/ui/popups/samplelab.js")');
        const before = win.eval("__microtone.store.doc.toBytes()");
        const censusBefore = store.doc.sampleList().length;
        const pLab = openSampleLab(store, { data, rate, name: "chorded", openChord: true });
        const labDlg = await waitFor(() => win.document.querySelector(".samplelab-modal"));
        const lab = labDlg.__lab;
        const dlg2 = await waitFor(() => win.document.querySelector(".chord-modal"));
        ok(!!dlg2, "b1 openChord opens the maker on top of the Lab");

        dlg2.__chord.setChordPreset("power");
        dlg2.__chord.setVoice(2, { on: true, mode: "ji", ji: "1/1", oct: -1 });
        await sleep(300);
        const srcLen = lab.state().len;
        dlg2.__chord.apply();
        await waitFor(() => !win.document.querySelector(".chord-modal"));
        ok(lab.state().len === srcLen * 2, `b2 the Lab buffer became the chord (${lab.state().len})`);
        ok(lab.state().undoDepth > 0, "b3 the chord is one Lab undo step");
        lab.undo();
        ok(lab.state().len === srcLen, "b4 undo restores the source take");
        lab.redo();
        ok(lab.state().len === srcLen * 2, "b5 redo re-applies it");

        // b6: the Lab's own commit path still lands it as a sample + instrument
        lab.setTargetRate(16000);
        lab.commit();
        const res = await pLab;
        ok(res && res.count === 1, `b6 committed as one instrument (got ${res && res.count})`);
        ok(store.doc.sampleList().length === censusBefore + 1, "b6b census grew by one");
        store.undo.undo();
        const after = win.eval("__microtone.store.doc.toBytes()");
        ok(after.length === before.length && after.every((v, i) => v === before[i]),
          "b7 ONE undo step, byte-exact");

        // ── leg C: the Samples view button ─────────────────────────────────
        win.document.querySelector('#tabs button[data-view="samples"]').click();
        await sleep(200);
        const chordBtn = [...win.document.querySelectorAll(".smp-toolbar button")]
          .find((b) => /Chord/i.test(b.textContent));
        ok(!!chordBtn, "c1 Samples view has a Chord… button");
        chordBtn.click();
        const labDlg3 = await waitFor(() => win.document.querySelector(".samplelab-modal"));
        const dlg3 = await waitFor(() => win.document.querySelector(".chord-modal"));
        ok(!!dlg3 && labDlg3.__lab.state().len > 0,
          "c2 it opens a Lab copy of the pooled sample with the maker on top");
        dlg3.__chord.cancel();
        await waitFor(() => !win.document.querySelector(".chord-modal"));
        labDlg3.__lab.cancel();
        const afterC = win.eval("__microtone.store.doc.toBytes()");
        ok(afterC.length === before.length && afterC.every((v, i) => v === before[i]),
          "c3 cancelling touched nothing");

        log(out.some((l) => l.includes("FAIL")) ? "FAILURES" : "ALL PASS");
      } catch (err) {
        log("ERROR: " + err.message + "\n" + err.stack);
      }
    })();
  </script>
</body>
</html>
