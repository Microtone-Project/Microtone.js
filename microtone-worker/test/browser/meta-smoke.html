<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>meta layer editor smoke</title></head>
<body>
  <img src="/hang" hidden>
  <pre id="out">running…</pre>
  <iframe id="app" src="../../index.html?load=test/corpus/flourish.taud" style="width:1200px;height:700px"></iframe>
  <script type="module">
    // Item 28: Metainstrument mix + detune are editable in the Instruments Meta tab.
    // Item 113: that tab is a real layer-table editor — duplicate (linked),
    // reorder, unlink, remove, and gating-rectangle fields, all undoable.
    const out = [];
    const log = (l) => { out.push(l); document.getElementById("out").textContent = out.join("\n"); };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    (async () => {
      const results = [];
      const check = (name, ok) => { results.push(`${ok ? "ok" : "FAIL"} ${name}`); log(`${ok ? "ok" : "FAIL"} ${name}`); };
      try {
        const frame = document.getElementById("app");
        const win = await new Promise((resolve) => {
          const poll = setInterval(() => {
            const w = frame.contentWindow;
            if (w && w.__microtone?.store.doc) { clearInterval(poll); resolve(w); }
          }, 100);
        });
        const { store, instrumentsView } = win.__microtone;
        const doc = store.doc;

        // pick the first meta slot
        const metaSlot = doc.usedInstrumentSlots().find((s) => doc.instruments[s].isMeta);
        log(`meta slot: $${metaSlot?.toString(16)}`);

        win.document.querySelector('#tabs button[data-view="instruments"]').click();
        instrumentsView.selected = metaSlot;
        instrumentsView.tab = "meta";
        instrumentsView.refresh();
        await sleep(30);

        const panel = () => instrumentsView.panel;
        const rows = () => [...panel().querySelectorAll("tbody tr")];
        const layers = () => doc.instruments[metaSlot].metaLayers;
        const nums = (r) => [...rows()[r].querySelectorAll(".meta-num")];
        const acts = (r) => [...rows()[r].querySelectorAll(".meta-act")];
        const fire = (el) => el.dispatchEvent(new win.Event("change", { bubbles: true }));

        // The whole table as one string — the undo leg compares against it.
        const snapshot = () => layers().map((l) =>
          [l.instIdx, l.mixOctet, l.detune, l.pitchStart, l.pitchEnd, l.volStart, l.volEnd,
           l.fixedPitch ? "F" : "-"].join(":")
        ).join("|");
        const pristine = snapshot();

        check("layer rows rendered", rows().length === layers().length && rows().length > 0);
        check("six numeric fields per row (mix, cents, 2 pitch, 2 vel)", nums(0).length === 6);

        // An icon name that is not in BTN_ICON renders an EMPTY button — icon()
        // returns "" and setIconLabel has nothing to mount. ICON (context menus)
        // and BTN_ICON are separate tables, so this is silent and easy to hit.
        const blank = acts(0).filter((b) => !b.textContent.trim() && !b.querySelector("svg"));
        check(`all ${acts(0).length} action buttons carry a glyph`, blank.length === 0);

        // ── item 28: mix, still the first .meta-num — but it reads DECIBELS
        //    now (item 156.2): the box is what a person mixes in, while − and +
        //    still walk the raw octet the file stores, one at a time. ──
        nums(0)[0].value = "-6.0";
        fire(nums(0)[0]);
        await sleep(20);
        const dbOctet = layers()[0].mixOctet;
        const { META_MIX_GAIN } = await win.eval('import("/core/engine/tables.js")');
        const landedDb = 20 * Math.log10(META_MIX_GAIN[dbOctet]);
        check(`typing −6 dB lands on the nearest octet ($${dbOctet.toString(16)} = ${landedDb.toFixed(1)} dB)`,
          Math.abs(landedDb + 6) < 0.6);
        check("…and the box settles on the value that landed",
          /-?\d+\.\d\s*dB/.test(nums(0)[0].value) || /∞/.test(nums(0)[0].value));

        // + steps ONE octet, whatever the decibels round to
        const stepFrom = layers()[0].mixOctet;
        const plus = nums(0)[0].closest(".mt-spin").querySelector(".mt-step:last-child");
        plus.dispatchEvent(new win.PointerEvent("pointerdown", { bubbles: true, button: 0 }));
        plus.dispatchEvent(new win.PointerEvent("pointerup", { bubbles: true, button: 0 }));
        await sleep(20);
        check("+ steps exactly one mix octet", layers()[0].mixOctet === stepFrom + 1);

        // ── item 113: detune is now CENTS, not raw 4096-TET units ──
        nums(0)[1].value = "-100";           // one 12-TET semitone down (in ¢)
        fire(nums(0)[1]);
        await sleep(20);
        const det = layers()[0].detune;
        check(`detune reads cents (−100 ¢ → ${det} units)`, det === -341);

        // the spinner's + steps a whole degree of the song's notation — the
        // cell's own ◂ ▸ pair became the group's buttons (item 156)
        const beforeStep = layers()[0].detune;
        const detPlus = nums(0)[1].closest(".mt-spin").querySelector(".mt-step:last-child");
        detPlus.dispatchEvent(new win.PointerEvent("pointerdown", { bubbles: true, button: 0 }));
        detPlus.dispatchEvent(new win.PointerEvent("pointerup", { bubbles: true, button: 0 }));
        await sleep(20);
        check("+ steps up a degree", layers()[0].detune > beforeStep);

        // ── the note readouts are PAINTED in the song's own notation ──
        // Not "is there a canvas": the SAME note painted against two different
        // pitch tables must come out as different pixels, which is the only
        // way to tell a notation-aware readout from a 12-EDO one.
        const detAnn = rows()[0].querySelector(".meta-det-ann");
        const detCv = detAnn?.querySelector("canvas.note-glyph");
        check("the detune readout is a painted note glyph", !!detCv);
        check("…with the raw units still beside it as text",
          /·\s*-?\d+/.test(detAnn.textContent));
        check("the layer range is painted too",
          !!rows()[0].querySelector(".meta-rng-ann canvas.note-glyph"));
        const { noteGlyphCanvas } = await win.eval('import("/src/ui/noteglyph.js")');
        const { pitchTablePresets } = await win.eval('import("/core/tuning/pitchtables.js")');
        const pixels = (preset) => {
          const cv = noteGlyphCanvas(0x50ab, preset); // C4 + a quarter tone
          const px = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
          return Array.from(px).join(",");
        };
        const in12 = pixels(pitchTablePresets[120]);
        const in24 = pixels(pitchTablePresets[240]);
        const in31 = pixels(pitchTablePresets[310]);
        check("a note paints differently in 24-TET than in 12-TET", in12 !== in24);
        check("…and differently again in 31-TET", in24 !== in31);
        check("…and the glyph is not blank", /[1-9]/.test(in24));

        // ── the gating rectangle is editable at last ──
        nums(0)[4].value = "16";             // volStart
        fire(nums(0)[4]);
        await sleep(20);
        check("velocity floor edits", layers()[0].volStart === 16);

        // ── duplicate is LINKED: one more layer on the SAME sub-instrument ──
        const countBefore = layers().length;
        const childBefore = layers()[0].instIdx;
        acts(0).find((b) => b.title.includes("Duplicate")).click();
        await sleep(30);
        check("duplicate adds a layer", layers().length === countBefore + 1);
        check("…pointing at the same sub-instrument", layers()[1].instIdx === childBefore);
        check("…carrying the source's settings", layers()[1].volStart === 16);
        check("…and the row is badged as linked", !!rows()[0].querySelector(".meta-link"));

        // ── reorder: a drag handle, where the ▲ ▼ buttons used to be ──
        const grip = (r) => rows()[r].querySelector(".drag-grip");
        const midY = (r) => {
          const b = rows()[r].getBoundingClientRect();
          return b.top + b.height / 2;
        };
        const pt = (type, el, clientY) => el.dispatchEvent(new win.PointerEvent(type, {
          pointerId: 7, clientX: 20, clientY, button: 0, buttons: 1, bubbles: true,
        }));
        const ids = layers().map((l) => `${l.instIdx}:${l.detune}`);
        // The drag reads row midpoints, so a table with no geometry would make
        // the legs below pass without meaning anything.
        check("the table is really laid out", rows()[0].getBoundingClientRect().height > 4);

        // Drag the LAST row to the top, in two moves. Only the pointerdown is
        // aimed at the grip: moving a row re-inserts it in the DOM, which drops
        // the pointer capture the grip was holding, so from the second move on
        // the events arrive somewhere else entirely — the drag has to keep
        // working when they do. (A drag that moved one row and then went deaf,
        // never seeing its own release, was exactly the bug.)
        const body = win.document.body;
        const last = layers().length - 1;
        const dragged = rows()[last];
        const g = grip(last);
        const overs = [midY(last - 1) - 4, midY(0) - 4];
        const stepsBefore = store.undo.undoStack.length;
        pt("pointerdown", g, midY(last));
        pt("pointermove", body, overs[0]);
        check("the dragged row follows the pointer", rows()[last - 1] === dragged);
        pt("pointermove", body, overs[1]);
        check("…and keeps following it after the first move", rows()[0] === dragged);
        check("…without committing anything yet",
          layers().map((l) => `${l.instIdx}:${l.detune}`).join() === ids.join());
        pt("pointerup", body, overs[1]);
        await sleep(30);
        const swapped = layers().map((l) => `${l.instIdx}:${l.detune}`);
        check("dropping it commits the whole gesture",
          swapped.join() === [ids[last], ...ids.slice(0, last)].join());
        check("…as ONE undo step", store.undo.undoStack.length === stepsBefore + 1);
        check("…and the drag really ended", !body.classList.contains("dragsorting"));

        // The handle is a button, so the keyboard still reorders without a
        // pointer — and walking the row back proves nothing is left armed.
        const arrow = (r, key) => grip(r).dispatchEvent(
          new win.KeyboardEvent("keydown", { key, bubbles: true }));
        for (let r = 0; r < last; r++) { arrow(r, "ArrowDown"); await sleep(30); }
        check("↓ on the focused handle walks it back",
          layers().map((l) => `${l.instIdx}:${l.detune}`).join() === ids.join());
        check("…and the focus follows the row it moved",
          win.document.activeElement === grip(last));

        // ── unlink: layer 1 gets its own copy, layer 0 keeps the original ──
        const unlinkBtn = acts(1).find((b) => b.textContent.includes("Unlink"));
        check("Unlink is offered on a linked layer", !!unlinkBtn && !unlinkBtn.disabled);
        unlinkBtn.click();
        await sleep(60);
        check("unlink repoints only that layer", layers()[1].instIdx !== layers()[0].instIdx);
        check("…to a $100+ sub-slot", (layers()[1].instIdx & 0x3ff) >= 0x100);
        check("…and the linked badge is gone", !rows()[0].querySelector(".meta-link"));
        check("Unlink is now disabled", acts(1).find((b) => b.textContent.includes("Unlink")).disabled);

        // ── remove, and the last layer can never go ──
        const beforeRemove = layers().length;
        acts(1).find((b) => b.title.includes("Remove")).click();
        await sleep(30);
        check("remove drops a layer", layers().length === beforeRemove - 1);

        // ── item 179: the fixed-pitch flag ──
        // The switch changes what the field beside it MEANS, so what is checked
        // is the pair: the box, the value it carries over, and the record bit.
        const fixedBox = () => rows()[0].querySelector(".meta-fixed input");
        check("every layer row carries a fixed-pitch switch",
          rows().every((_, r) => !!rows()[r].querySelector(".meta-fixed input")));
        const detBefore = layers()[0].detune;
        fixedBox().click();
        await sleep(40);
        check("ticking it sets the flag on that layer", layers()[0].fixedPitch === true);
        check("…carrying the pitch the row was showing (middle C + the detune)",
          layers()[0].detune === 0x5000 + detBefore);
        check("…and only that layer", layers().slice(1).every((l) => !l.fixedPitch));
        check("the field now reads an absolute note word",
          /^\$[0-9A-F]{4}$/.test(nums(0)[1].value));
        check("…and the flag is in the record, byte +9 bit 6",
          (doc.instruments[metaSlot].metaRaw[4 + 9] & 0x40) !== 0);
        check("…with the volume range beside it intact",
          (doc.instruments[metaSlot].metaRaw[4 + 9] & 0x3f) === layers()[0].volEnd);

        // Typing a note NAME into it is the same as typing the word.
        nums(0)[1].value = "C-4";
        fire(nums(0)[1]);
        await sleep(20);
        check("a note NAME is accepted in the fixed-pitch field", layers()[0].detune === 0x5000);

        // …and untick puts the offset back, with the note still where it was.
        fixedBox().click();
        await sleep(40);
        check("unticking it clears the flag", layers()[0].fixedPitch === false);
        check("…and reads the value back as an offset from middle C", layers()[0].detune === 0);
        check("the field is back to cents", /¢/.test(nums(0)[1].value));

        // The layer table as the flag edits find it — nothing on the Options tab
        // may disturb it.
        const afterLayers = snapshot();

        // ── the Options sub-tab: the record's own flag byte ──
        // Written as TOGGLES rather than against fixed values: a converted
        // metainstrument arrives with strict layering already on (flourish's
        // does), and a leg that assumed $00 would be testing the corpus.
        const tabBtns = () => [...instrumentsView.tabBar.querySelectorAll("button")];
        check("a metainstrument has two sub-tabs", tabBtns().length === 2);
        check("…Layers first", tabBtns()[0].textContent === "Layers");
        check("…then Options", tabBtns()[1].textContent === "Options");
        tabBtns()[1].click();
        await sleep(40);
        const boxes = () => [...panel().querySelectorAll(".slider-row.check input")];
        check("the Options tab is showing", instrumentsView.tab === "metaopts");
        check("…with the two record flags", boxes().length === 2);
        check("…named", [...panel().querySelectorAll(".sl-label")].map((e) => e.textContent)
          .join("|") === "Percussion|Strict layering");
        check("…each explaining what it does",
          panel().querySelectorAll(".sl-hint").length === 2);
        check("…and the flag byte quoted for a bug report",
          /flag byte \$[0-9A-F]{2}/.test(panel().querySelector(".detail-info").textContent));

        const rec0 = () => doc.instruments[metaSlot].metaRaw[0];
        const bit = (m) => (rec0() & m) !== 0;
        check("…which is the byte the record really holds",
          panel().querySelector(".detail-info").textContent
            .includes("$" + rec0().toString(16).toUpperCase().padStart(2, "0")));
        const percWas = bit(0x02), strictWas = bit(0x01);
        check("the boxes start on what the record says",
          boxes()[0].checked === percWas && boxes()[1].checked === strictWas);

        boxes()[0].click();
        await sleep(50);
        check("the Percussion box drives byte 0 bit 1", bit(0x02) === !percWas);
        check("…which is what a retuner reads",
          doc.instruments[metaSlot].isPercussion === !percWas);
        check("…and the layer table is untouched", snapshot() === afterLayers);
        check("…and the box comes back on the new state", boxes()[0].checked === !percWas);

        boxes()[1].click();
        await sleep(50);
        check("the Strict layering box drives bit 0", bit(0x01) === !strictWas);
        check("…which the trigger reads",
          doc.instruments[metaSlot].metaStrict === !strictWas);
        check("…and the other flag stands where it was put", bit(0x02) === !percWas);

        store.undo.undo();
        await sleep(50);
        check("undo takes back the last flag alone",
          bit(0x01) === strictWas && bit(0x02) === !percWas);

        // ── undo the lot, back to exactly where we started ──
        while (store.undo.canUndo()) store.undo.undo();
        await sleep(30);
        instrumentsView.refresh();
        await sleep(20);
        check("undo restores the whole layer table", snapshot() === pristine);

        const pass = !!metaSlot && results.every((r) => r.startsWith("ok"));
        log(pass ? "RESULT: PASS" : "RESULT: FAIL");
      } catch (err) {
        log(`RESULT: ERROR ${err.message}\n${err.stack}`);
      }
    })();
  </script>
</body>
</html>
