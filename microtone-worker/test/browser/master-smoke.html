<!doctype html><meta charset="utf-8"><title>master strip (item 98)</title>
<pre id="out">running… (needs a real audio-capable browser; ~8s)</pre>
<img src="/hang" hidden>
<!-- Tall enough for the default two scope panels AND for a column that can
     still hold one more than a stereo song has views to put in it — that spare
     row is what lets the "+" checks below tell "no room" apart from "no view
     left". A scope panel is a fixed size, so how many fit is a property of the
     viewport (item 98 note 2). -->
<iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1400px;height:1500px"></iframe>
<script type="module">
// Drives the REAL app: the master strip's layout, its choosers per surround
// model, the engine-side analysis tap it installs, live meters/scopes while the
// song plays, and the fader writing the project's global volume in ONE undo
// step. The maths behind the numbers is unit-tested in test/node/analysis.test.js.
const out = document.getElementById("out");
const log = (s) => { out.textContent += "\n" + s; console.log("MASTER: " + s); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let fails = 0;
const check = (ok, name, extra = "") => { if (!ok) fails++; log(`${ok ? "PASS" : "FAIL"} ${name}${extra ? " — " + extra : ""}`); };

/** Any pixel that is not the flat background → the canvas actually drew. */
function painted(cv) {
  const ctx = cv.getContext("2d");
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  const r0 = d[0], g0 = d[1], b0 = d[2];
  for (let i = 4; i < d.length; i += 4) {
    if (d[i] !== r0 || d[i + 1] !== g0 || d[i + 2] !== b0) return true;
  }
  return false;
}

(async () => {
  const app = document.getElementById("app");
  await new Promise((r) => app.addEventListener("load", r));
  const win = app.contentWindow;
  for (let i = 0; i < 200 && !win.__microtone?.store.doc; i++) await sleep(50);
  const M = win.__microtone;
  if (!M) { log("no __microtone"); return; }
  const doc = win.document;
  const { store, masterStrip } = M;
  const { setSongScalarOp } = await import("../../src/doc/ops.js");
  const strip = doc.getElementById("masterStrip");

  // ── 1. visible by default, and only on the Timeline ──────────────────────
  check(!strip.hidden, "strip is visible by default on the Timeline");
  check(masterStrip.panelCount() === 2 && !!masterStrip.meterCanvas,
    "two scope panels + one meter panel", String(masterStrip.panelCount()));
  // Item 98 note 4: the metering chooser lives on the meter panel, at its foot.
  // Item 156 wraps every dropdown in a step-button group, so what sits in the
  // meter box is the GROUP the chooser lives in.
  const chooser = masterStrip.targetSel.closest(".mt-pick") ?? masterStrip.targetSel;
  check(chooser.parentElement === masterStrip.meterBox &&
    masterStrip.meterBox.lastElementChild === chooser,
    "the meters chooser sits at the bottom of the meter panel");
  // It must take width off the grid, not cover it.
  const stage = doc.getElementById("viewStage");
  check(stage.clientWidth + strip.offsetWidth <= doc.getElementById("viewHost").clientWidth + 2,
    "the grid stage and the strip share the width", `${stage.clientWidth}+${strip.offsetWidth}`);

  // The instrument lookup panel docks at the stage's LEFT edge (item 168) — it
  // must take width off the grid canvas, not float over it, and must still
  // land clear of the strip docked on the right.
  doc.getElementById("tbInstList").click();
  await sleep(200);
  const il = doc.getElementById("instLookup").getBoundingClientRect();
  const ms = strip.getBoundingClientRect();
  const tl = doc.getElementById("timeline").getBoundingClientRect();
  check(il.left <= tl.left, "the instrument panel sits at the grid's left edge", `${il.left} vs ${tl.left}`);
  check(tl.left >= il.right, "the grid canvas clears the instrument panel", `${tl.left} vs ${il.right}`);
  check(il.right <= ms.left, "the instrument panel clears the strip", `${il.right} vs ${ms.left}`);
  check(tl.right <= ms.left + 1, "the grid canvas clears the strip", `${tl.right} vs ${ms.left}`);
  doc.getElementById("tbInstList").click();

  doc.querySelector('[data-view="samples"]').click();
  await sleep(60);
  check(strip.hidden, "strip is hidden away from the Timeline");
  check(store.audio === null || store.audio.analysisTarget === "off",
    "the tap is off while the strip is hidden", String(store.audio?.analysisTarget));
  doc.querySelector('[data-view="timeline"]').click();
  await sleep(60);
  check(!strip.hidden, "strip returns with the Timeline");

  // ── 2. choosers follow the song's surround model ─────────────────────────
  const targets = () => [...masterStrip.targetSel.options].map((o) => o.value);
  const scopes = () => [...masterStrip.scopeSel[0].options].map((o) => o.value);
  check(targets().join() === "stereo", "a stereo song offers only the stereo meter", targets().join());
  check(masterStrip.targetSel.disabled, "…and there is nothing to choose");
  check(scopes().join() === "blobs,top,rad,cloud,hide", "a stereo song offers the four flat scopes", scopes().join());

  store.undo.apply(setSongScalarOp(store.songIndex, "surroundModel", 1));
  await sleep(80);
  check(targets().join() === "stereo,quad,5.1,7.1,ambisonic", "a planar song offers every target", targets().join());
  check(scopes().join() === "blobs,top,rad,cloud,hide", "…but still no vertical-plane scopes", scopes().join());
  check(masterStrip.target === "5.1", "planar defaults to metering 5.1", masterStrip.target);

  store.undo.apply(setSongScalarOp(store.songIndex, "surroundModel", 2));
  await sleep(80);
  check(scopes().join() === "blobs,blobsfront,blobsside,top,front,side,rad,radfront,radside,cloud,cloudfront,cloudside,hide",
    "a spatial song offers all four families in all three planes", scopes().join());
  check(masterStrip.target === "ambisonic", "spatial defaults to the ambisonic field", masterStrip.target);

  // ── 3. the tap reaches the engine, and the strip draws live ──────────────
  masterStrip.scopeSel[1].value = "top";
  masterStrip.scopeSel[1].dispatchEvent(new win.Event("change"));
  doc.getElementById("playSong").click();
  await sleep(2500);
  const audio = store.audio;
  check(!!audio && audio.isPlaying(), "song is playing");
  check(audio?.analysisTarget === "ambisonic", "the engine got the ambisonic tap", String(audio?.analysisTarget));

  // A snapshot covers ~16 ms, but when the engine runs off the audio thread the
  // worker renders in bursts — so some windows legitimately carry no frames.
  // Sample until one does (the strip HOLDS its meters through the gaps).
  let r = audio.readAnalysis(masterStrip.readout);
  for (let i = 0; i < 60 && r.frames === 0; i++) {
    await sleep(30);
    r = audio.readAnalysis(masterStrip.readout);
  }
  check(r.frames > 0, "the tap reported rendered frames", String(r.frames));
  check(r.meterCount === 4, "spatial ambisonic meters W Y X Z", String(r.meterCount));
  check(masterStrip.meterBars().map((b) => b.label).join(" ") === "E W Y X Z",
    "the ambisonic strip leads with the field bar",
    masterStrip.meterBars().map((b) => b.label).join(" "));
  check(r.fieldEnergy > 0, "the encoded field carries energy", r.fieldEnergy.toExponential(3));
  let ringMax = 0;
  const ring = audio.scopeRing();
  for (let i = 0; i < ring.length; i++) ringMax = Math.max(ringMax, Math.abs(ring[i]));
  check(ringMax > 0, "the scope ring carries a signal", ringMax.toFixed(4));
  check(masterStrip.meters[0].rmsDb() > -60, "the meter ballistics moved", masterStrip.meters[0].rmsDb().toFixed(1));

  await sleep(200);
  check(painted(masterStrip.scopeCanvas[0]), "scope A painted");
  check(painted(masterStrip.scopeCanvas[1]), "scope B painted");
  check(painted(masterStrip.meterCanvas), "meter/fader painted");

  // ── 3a. the Goniometer panel is a CRT beam (item 106) ─────────────────────
  // The scope keeps its phosphor between frames and sweeps only the samples
  // that arrived since the last one, so what is on screen is a continuous
  // trace with energy behind it rather than a window's worth of dots.
  const beamCell = masterStrip.beams[1];
  check(!!beamCell && beamCell.beam.totalEnergy() > 0, "the Goniometer panel has a lit beam",
    beamCell ? beamCell.beam.totalEnergy().toFixed(1) : "no beam");
  check(masterStrip.beams[0] === null, "…and a blobs panel does not pay for one");
  check(masterStrip.freshFrames > 0 && masterStrip.freshFrames < 4096,
    "…swept with the samples since the last frame, not the whole ring every time",
    String(masterStrip.freshFrames));
  // Density reads as brightness: the hottest pixel is well past the faint ones.
  const hot = beamCell.beam.peakEnergy();
  check(hot > 0.5, "the trace has a hot core", hot.toFixed(2));
  // Stop feeding it and it dies away instead of freezing on the last window.
  const litWhilePlaying = beamCell.beam.totalEnergy();
  doc.getElementById("stopBtn").click();
  await sleep(600);
  const litAfterStop = beamCell.beam.totalEnergy();
  check(litAfterStop < litWhilePlaying * 0.1, "…and the phosphor fades once the music stops",
    `${litWhilePlaying.toFixed(1)} → ${litAfterStop.toFixed(1)}`);
  doc.getElementById("playSong").click();
  await sleep(600);
  check(masterStrip.beams[1].beam.totalEnergy() > 0, "…and lights again when it starts");

  // The vectorscope auto-gain slews (~300 ms) instead of snapping: shove it far
  // from where the music wants it and it has to walk back, not jump.
  masterStrip.scopeGain[1] = 50;
  await sleep(50);
  const gain50 = masterStrip.scopeGain[1];
  await sleep(700);
  const gain750 = masterStrip.scopeGain[1];
  check(gain50 > 20, "the scope gain does not snap in one frame", gain50.toFixed(1));
  check(gain750 < gain50 / 2, "…but it does get there", `${gain50.toFixed(1)} → ${gain750.toFixed(1)}`);

  // ── 3b. the radiation panel is one field seen through many cameras ───────
  // Item 129: the analysis is per STRIP, not per panel — put two radiation
  // views up and there must still be exactly one soundfield behind them.
  doc.getElementById("playSong").click();
  await sleep(400);
  for (const [i, kind] of [[0, "rad"], [1, "radfront"]]) {
    masterStrip.scopeSel[i].value = kind;
    masterStrip.scopeSel[i].dispatchEvent(new win.Event("change"));
  }
  await sleep(600);
  const field = masterStrip.radField;
  check(!!field && field.ready, "the radiation panels built a field");
  check(field.live && field.presence > 0.5, "…and it is present while the song plays",
    field ? field.presence.toFixed(3) : "no field");
  check(field.peak > 0, "…with a peak to normalise against", field?.peak.toExponential(2));
  check(masterStrip.radCells[0] !== null && masterStrip.radCells[1] !== null,
    "both panels have a camera");
  check(masterStrip.radCells[0].view !== masterStrip.radCells[1].view,
    "…their own cameras");
  check(painted(masterStrip.scopeCanvas[0]) && painted(masterStrip.scopeCanvas[1]),
    "both radiation panels painted");
  // The surface carries the spectrum: at least one vertex is coloured.
  let inked = 0;
  for (let i = 0; i < field.ink.length; i++) if (field.ink[i] > 0) inked++;
  check(inked > field.ink.length / 4, "the surface is spectrally coloured", String(inked));
  // Stop, and it fades rather than freezing on the ring's last window.
  const litRad = field.presence;
  doc.getElementById("stopBtn").click();
  await sleep(1600);
  check(masterStrip.radField.presence < litRad * 0.2,
    "…and the surface fades once the music stops",
    `${litRad.toFixed(3)} → ${masterStrip.radField.presence.toFixed(3)}`);
  masterStrip.scopeSel[0].value = "blobs";
  masterStrip.scopeSel[0].dispatchEvent(new win.Event("change"));
  masterStrip.scopeSel[1].value = "top";
  masterStrip.scopeSel[1].dispatchEvent(new win.Event("change"));
  await sleep(120);

  // ── 4. the fader is the SONG's global volume, one undo step per drag ─────
  const before = store.song.globalVolume;
  const depth = store.undo.undoStack.length;
  const g = `fader:test`;
  masterStrip.writeVolume(200, g);
  masterStrip.writeVolume(160, g);
  masterStrip.writeVolume(120, g);
  await sleep(80);
  check(store.song.globalVolume === 120, "the drag wrote the project's global volume", String(store.song.globalVolume));
  check(store.undo.undoStack.length === depth + 1, "…as ONE undo step",
    `${store.undo.undoStack.length} vs ${depth + 1}`);
  store.undo.undo();
  await sleep(60);
  check(store.song.globalVolume === before, "undo restores the pre-drag value", String(store.song.globalVolume));

  // While the song plays the cap follows the ENGINE (effects V/W move it);
  // stopped, it snaps back to the project's own value.
  doc.getElementById("stopBtn").click();
  await sleep(300);
  check(masterStrip.volumeValue() === store.song.globalVolume,
    "stopped, the fader reads the project value",
    `${masterStrip.volumeValue()} vs ${store.song.globalVolume}`);

  // ── 5. panels: add, drop just one, resize the meter ──────────────────────
  const panelH = masterStrip.scopePanel[0].getBoundingClientRect().height;
  const meterBefore = masterStrip.meterBox.getBoundingClientRect().height;
  check(panelH > 0 && Math.abs(panelH - masterStrip.scopePanel[1].getBoundingClientRect().height) < 1,
    "scope panels are a fixed, equal size", panelH.toFixed(1));

  // "Hide this panel" drops THAT panel, not the strip.
  const sel0 = masterStrip.scopeSel[0];
  const kept = masterStrip.scopes[1];
  sel0.value = "hide";
  sel0.dispatchEvent(new win.Event("change"));
  await sleep(120);
  check(!strip.hidden, "hiding a panel leaves the strip up");
  check(masterStrip.panelCount() === 1, "…and drops exactly one panel", String(masterStrip.panelCount()));
  check(masterStrip.scopes[0] === kept, "…the one that was chosen, not its neighbour", masterStrip.scopes[0]);
  check(masterStrip.meterBox.getBoundingClientRect().height > meterBefore,
    "the meter takes over the freed room");

  // A panel's CHOICE survives a song that cannot show it. (Regression: the
  // strip is built before any song loads, so the model reads stereo, and the
  // saved front/side choices used to be overwritten there and then — four
  // configured panels came back as several copies of one view.)
  const sorted = (a) => [...a].filter(Boolean).sort().join();
  // Fill the column. The count is bounded by the window, so ask for the
  // capacity rather than a number — asking for more is how a test hangs.
  masterStrip.setPanelCount(masterStrip.geometry().capacity);
  await sleep(120);
  const wishes = masterStrip.scopes.join();
  check(new Set(masterStrip.scopes).size === masterStrip.scopes.length &&
    masterStrip.drawn === masterStrip.scopes.length,
    "filling the column hands out that many DIFFERENT views", wishes);
  store.undo.apply(setSongScalarOp(store.songIndex, "surroundModel", 0));
  await sleep(120);
  check(masterStrip.scopes.join() === wishes, "a stereo song does not rewrite them",
    masterStrip.scopes.join());
  check(sorted(masterStrip.effective) === "blobs,cloud,rad,top" &&
    masterStrip.effective.length === masterStrip.scopes.length,
    "…it just stops drawing the ones it cannot show", String(masterStrip.effective));
  store.undo.apply(setSongScalarOp(store.songIndex, "surroundModel", 2));
  await sleep(120);
  check(masterStrip.effective.join() === wishes,
    "…and going spatial brings them straight back", masterStrip.effective.join());
  // Back to one panel, leaving room for the "+" leg below.
  masterStrip.setPanelCount(1);
  await sleep(120);

  // The + button puts one back.
  check(!doc.getElementById("masterStrip").querySelector(".ms-head .icon-btn").hidden,
    "the add button is available when there is room");
  masterStrip.addScope();
  await sleep(120);
  check(masterStrip.panelCount() === 2, "+ adds a panel back", String(masterStrip.panelCount()));
  // Regression (item 175): the new panel's own chooser is built empty in the
  // constructor and only ever filled by syncChoosers's model-signature-driven
  // rebuild — which a "+" into an UNCHANGED model never trips, so the fresh
  // panel's <select> stayed empty and nothing could be picked from it.
  check(masterStrip.scopeSel[1].options.length > 0,
    "the newly added panel's scope dropdown is populated",
    String(masterStrip.scopeSel[1].options.length));

  // "+" follows the MODEL as well as the room — the ceiling is one panel per
  // view the song has, not a fixed number. (Regression: changing the model
  // re-picked which panels are drawable but never re-laid the stack out, so the
  // button kept the answer it gave for the previous model.)
  const addBtn = strip.querySelector(".ms-head .icon-btn");
  masterStrip.setPanelCount(4);
  store.undo.apply(setSongScalarOp(store.songIndex, "surroundModel", 0));
  await sleep(150);
  check(masterStrip.geometry().capacity > masterStrip.drawn, "…room to spare",
    `${masterStrip.geometry().capacity} vs ${masterStrip.drawn}`);
  check(addBtn.hidden, "a stereo song has all four of its views up, so + steps aside");
  store.undo.apply(setSongScalarOp(store.songIndex, "surroundModel", 2));
  await sleep(150);
  check(!addBtn.hidden, "…and a spatial song has eight more, so + comes back");

  // ── the ONE state: what the strip believes is always what is on screen ────
  // (Regression: a geometric "fit" and the panel list were two states that only
  // agreed by accident, so the strip drew six panels in a column with room for
  // three and then refused to add a fourth until a resize shook it loose.)
  const agrees = (tag) => {
    const domVisible = masterStrip.scopePanel.filter((b) => !b.hidden).length;
    const g = masterStrip.geometry();
    // The panels and the meter between them fill the column exactly: no gap,
    // and nothing overflowing the clipped box pretending to be on screen.
    const stripBox = strip.getBoundingClientRect();
    const meterBox = masterStrip.meterBox.getBoundingClientRect();
    const fills = Math.abs(meterBox.bottom - (stripBox.bottom - 4)) < 2;
    check(domVisible === masterStrip.drawn && masterStrip.drawn <= g.capacity && fills,
      `state matches the screen ${tag}`,
      `drawn=${masterStrip.drawn} dom=${domVisible} cap=${g.capacity} fills=${fills}`);
  };
  agrees("after adding");

  // The divider IS the count: it closes panels on the way down…
  const cap = masterStrip.geometry().capacity;
  masterStrip.setPanelCount(cap);
  await sleep(80);
  const panelsBefore = masterStrip.drawn;
  // Where the divider would sit with n panels above it: the top of the first
  // panel plus n panel heights.
  const g0 = masterStrip.geometry();
  const panelsTop = masterStrip.scopePanel[0].getBoundingClientRect().top;
  const dividerAt = (n) => panelsTop + n * g0.panelH;
  masterStrip.onSplitDown({ pointerId: 1, preventDefault() {} });
  masterStrip.onSplitMove({ clientY: dividerAt(1) });
  masterStrip.onSplitUp({ pointerId: 1 });
  await sleep(120);
  check(masterStrip.drawn === 1, "dragging the divider down closes panels",
    `${panelsBefore} → ${masterStrip.drawn}`);
  agrees("after dragging down");
  // …and opens them on the way up, because it is the same one number.
  masterStrip.onSplitDown({ pointerId: 1, preventDefault() {} });
  masterStrip.onSplitMove({ clientY: dividerAt(cap) });
  masterStrip.onSplitUp({ pointerId: 1 });
  await sleep(120);
  check(masterStrip.drawn === cap, "dragging it back up opens them again",
    `${masterStrip.drawn} of ${cap}`);
  agrees("after dragging up");

  // Speaker targets: bars stand where the speakers do, and no LFE bar.
  masterStrip.targetSel.value = "7.1";
  masterStrip.targetSel.dispatchEvent(new win.Event("change"));
  await sleep(600);
  const bars71 = masterStrip.meterBars().map((b) => b.label).join(" ");
  check(bars71 === "Lrs Lss L C R Rss Rrs", "7.1 bars are arranged like the speakers", bars71);
  masterStrip.targetSel.value = "5.1";
  masterStrip.targetSel.dispatchEvent(new win.Event("change"));
  await sleep(600);
  const bars51 = masterStrip.meterBars().map((b) => b.label).join(" ");
  check(bars51 === "Ls L C R Rs", "5.1 likewise, with no LFE bar", bars51);
  // Ls is channel 4 in the file's order (L R C LFE Ls Rs) — the leftmost BAR
  // must still be reading that channel's meter, not the leftmost channel's.
  check(masterStrip.meterBars()[0].meter === masterStrip.meters[4],
    "…and the leftmost bar reads the Ls channel, not channel 0");
  masterStrip.targetSel.value = "ambisonic";
  masterStrip.targetSel.dispatchEvent(new win.Event("change"));
  await sleep(300);

  // ── 6. the clip lamp latches until the next take ─────────────────────────
  masterStrip.meters[0].update(0.25, 1.0, true, 16); // as if a sample clipped
  check(masterStrip.meters[0].clipping(), "a clipped sample lights the lamp");
  await sleep(600); // many frames of silence, stopped
  check(masterStrip.meters[0].clipping(), "…and it stays lit while stopped");
  doc.getElementById("playSong").click();
  await sleep(400);
  check(!masterStrip.meters[0].clipping(), "starting playback again clears it");
  doc.getElementById("stopBtn").click();
  await sleep(200);

  // ── 7. hiding drops the tap ──────────────────────────────────────────────
  doc.getElementById("tbMaster").click();
  await sleep(120);
  check(strip.hidden, "the toolbox button hides the strip");
  check(audio.analysisTarget === "off", "hiding drops the engine tap", String(audio.analysisTarget));
  doc.getElementById("tbMaster").click();
  await sleep(120);
  check(!strip.hidden && audio.analysisTarget === "ambisonic", "…and turning it back on restores it");

  log(fails ? `\nRESULT: FAIL (${fails})` : "\nRESULT: PASS");
})().catch((e) => log("ERROR " + e.message + "\n" + e.stack));
</script>
