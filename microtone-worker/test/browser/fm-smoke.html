<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FM rack smoke: create a type-4 metainstrument, wire it, play it</title>
</head>
<body>
  <pre id="out">running…</pre>
  <!-- worker-less page: the virtual-time --dump-dom recipe applies -->
  <iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1200px;height:700px"></iframe>
  <script type="module">
    const out = [];
    const log = (line) => {
      out.push(line);
      console.log("SMOKE: " + line);
      document.getElementById("out").textContent = out.join("\n");
    };
    const waitFor = (fn, ms = 8000) => new Promise((resolve, reject) => {
      const t0 = Date.now();
      const poll = setInterval(() => {
        let v; try { v = fn(); } catch { v = null; }
        if (v) { clearInterval(poll); resolve(v); }
        else if (Date.now() - t0 > ms) { clearInterval(poll); reject(new Error("timeout")); }
      }, 50);
    });
    const ok = (cond) => (cond ? "ok" : "FAIL");

    (async () => {
      try {
        const frame = document.getElementById("app");
        const win = await waitFor(() => {
          const w = frame.contentWindow;
          return w && w.__microtone?.store.doc ? w : null;
        });
        const { store, instrumentsView: iv } = win.__microtone;
        const doc = store.doc;
        log("app loaded (module graph booted ok)");

        const bank = await import("../../src/doc/bankmerge.js");
        const fmedit = await import("../../src/doc/fmedit.js");
        const ops = await import("../../src/doc/ops.js");

        // ── build a four-operator rack out of the project's own instruments ──
        const picks = doc.selectableInstrumentSlots()
          .filter((s) => !doc.instruments[s].isMeta).slice(0, 4)
          .map((slot) => ({ slot, count: 1 }));
        const plan = bank.planCreateFm(doc, picks, "smoke rack");
        log(`planCreateFm: ${ok(!plan.error)}${plan.error ? " — " + plan.error : ""}`);
        store.undo.apply(ops.importBankOp(plan));
        const slot = plan.metaSlot;
        const rack = doc.instruments[slot];
        log(`rack is a type-4 meta: ${ok(rack.isMeta && rack.isFm)}`);
        log(`rack holds ${rack.metaLayers.length} operators: ${ok(rack.metaLayers.length === 4)}`);
        log(`default algorithm verifies: ${ok(rack.fmProgram !== null)}`);
        log(`…and reads "${fmedit.fmFormula([...rack.fmProgram], 4)}": ` +
          ok(fmedit.fmFormula([...rack.fmProgram], 4) === "0[1[2[3]]]"));

        // ── the FM tab renders in place of Layers ──
        iv.show();
        iv.selected = slot;
        iv.renderTabs();
        iv.renderPanel();
        await waitFor(() => iv.panel.querySelector(".fm-algo"));
        const tabLabels = [...iv.tabBar.querySelectorAll("button")].map((b) => b.textContent);
        log(`tab bar is FM + Options: ${ok(tabLabels.join("|") === "FM|Options")}`);
        const rows = iv.panel.querySelectorAll(".meta-table tbody tr");
        log(`operator rack painted ${rows.length} rows: ${ok(rows.length === 4)}`);
        const words = iv.panel.querySelectorAll(".fm-word");
        log(`algorithm painted ${words.length} words: ${ok(words.length === 4)}`);
        const meterW = iv.panel.querySelector(".fm-meter-fill").style.width;
        log(`memory meter reports "${meterW}": ${ok(meterW !== "" && meterW !== "0%")}`);
        const formula = iv.panel.querySelector(".fm-formula");
        log(`formula readout shown, not an error: ${ok(!formula.classList.contains("bad"))}`);
        const svg = iv.panel.querySelector(".fm-graph-frame svg.fm-graph");
        const boxes = svg ? svg.querySelectorAll(".fm-graph-box").length : 0;
        const wires = svg ? svg.querySelectorAll(".fm-graph-wire").length : 0;
        log(`algorithm diagram: ${boxes} boxes, ${wires} wires, one OUT: ` +
          ok(boxes === 4 && wires === 4 && svg.querySelectorAll(".fm-graph-out").length === 1));

        // ── the Options tab: a rack has the family's flag, not the stack's ──
        [...iv.tabBar.querySelectorAll("button")][1].click();
        await waitFor(() => iv.panel.querySelector(".slider-row.check"));
        const flagBoxes = [...iv.panel.querySelectorAll(".slider-row.check input")];
        log(`two flags listed: ${ok(flagBoxes.length === 2)}`);
        log(`percussion is offered on a rack: ${ok(!flagBoxes[0].disabled)}`);
        log(`strict layering is greyed out on one: ${ok(flagBoxes[1].disabled)}`);
        flagBoxes[0].click();
        await waitFor(() => (doc.instruments[slot].metaRaw[0] & 0x02) !== 0);
        log(`…and it sets bit 1 without disturbing the type: ` +
          ok(doc.instruments[slot].metaRaw[0] === 0x42 && doc.instruments[slot].isFm));
        log(`…leaving the algorithm alone: ` +
          ok(fmedit.fmFormula([...doc.instruments[slot].fmProgram], 4) === "0[1[2[3]]]"));
        store.undo.undo();
        await waitFor(() => (doc.instruments[slot].metaRaw[0] & 0x02) === 0);
        iv.renderTabs();
        [...iv.tabBar.querySelectorAll("button")][0].click();
        await waitFor(() => iv.panel.querySelector(".fm-algo"));

        // ── edit a word: make operator 3 a second carrier instead ──
        const wordCount = rack.fmProgram.length;
        const clsSel = words[0].querySelector(".fm-word-class");
        clsSel.value = "fb";
        clsSel.dispatchEvent(new win.Event("change"));
        await waitFor(() => iv.panel.querySelector(".fm-word"));
        const after = doc.instruments[slot];
        log(`word edit committed (program still ${after.fmProgram?.length} words): ` +
          ok(after.fmProgram !== null && after.fmProgram.length === wordCount));
        log(`…and it became a feedback tap: ` +
          ok(fmedit.fmWordClass(after.fmProgram[0]) === "fb"));

        // ── a broken algorithm is HELD in the editor, not in the document ──
        // The file format's validity checklist (§10) says a rack in a file
        // verifies, and a record the reader cannot decode reads back as no
        // algorithm at all — so an edit that does not verify stays here, on
        // screen and editable, and the document keeps the last rack that
        // worked. Nothing about that may quietly change.
        const wordsOf = () => iv.panel.querySelectorAll(".fm-word");
        const before = [...doc.instruments[slot].fmProgram];
        const depthBefore = store.undo.undoStack.length;
        const words2 = wordsOf();
        const clsSel2 = words2[0].querySelector(".fm-word-class");
        clsSel2.value = "mod";
        clsSel2.dispatchEvent(new win.Event("change"));   // pops an empty stack
        await waitFor(() => iv.panel.querySelector(".fm-warn"));
        log(`broken algorithm: no diagram, formula flagged, banner shown: ` +
          ok(!iv.panel.querySelector(".fm-graph-frame") &&
             iv.panel.querySelector(".fm-formula").classList.contains("bad") &&
             !!iv.panel.querySelector(".fm-warn")));
        log(`…the words are still there and still editable (${wordsOf().length}): ` +
          ok(wordsOf().length === words2.length &&
             wordsOf()[0].querySelector(".fm-word-class").value === "mod" &&
             iv.panel.querySelector(".fm-words").classList.contains("unverified")));
        log(`…the document kept the algorithm that verified: ` +
          ok(String([...doc.instruments[slot].fmProgram]) === String(before)));
        log(`…and nothing was committed: ` +
          ok(store.undo.undoStack.length === depthBefore));

        // Repairing it applies the whole held edit as ONE step.
        const fix = wordsOf()[0].querySelector(".fm-word-class");
        fix.value = "osc";
        fix.dispatchEvent(new win.Event("change"));
        await waitFor(() => iv.panel.querySelector(".fm-graph-frame"));
        log(`the fix commits the held rack in one step, diagram back: ` +
          ok(store.undo.undoStack.length === depthBefore + 1 &&
             fmedit.fmWordClass(doc.instruments[slot].fmProgram[0]) === "osc" &&
             !iv.panel.querySelector(".fm-warn")));

        // Leaving the tab drops a held edit — and takes nothing with it.
        const kept = [...doc.instruments[slot].fmProgram];
        const brk = wordsOf()[0].querySelector(".fm-word-class");
        brk.value = "mod";
        brk.dispatchEvent(new win.Event("change"));
        await waitFor(() => iv.panel.querySelector(".fm-warn"));
        iv.tab = "general"; iv.renderPanel();
        iv.tab = "fm"; iv.renderPanel();
        await waitFor(() => iv.panel.querySelector(".fm-word"));
        log(`leaving the tab drops the held edit, the rack is intact: ` +
          ok(!iv.panel.querySelector(".fm-warn") &&
             String([...doc.instruments[slot].fmProgram]) === String(kept) &&
             wordsOf().length === kept.length));

        // ── an operator the algorithm names cannot be removed ──
        // The ✕ is the icon-only button of the row's action group; check IT
        // rather than "some button is disabled", which any row satisfies.
        const closeOf = (r) => [...r.querySelectorAll(".advCell .meta-act")]
          .find((b) => !b.textContent.trim());
        const closeDisabled = [...iv.panel.querySelectorAll(".meta-table tbody tr")]
          .every((r) => closeOf(r)?.disabled);
        log(`wired operators are guarded against removal: ${ok(closeDisabled)}`);

        // ── every rack row and every algorithm word has a drag grip ──
        const grips = iv.panel.querySelectorAll(".meta-table tbody tr .drag-grip").length;
        const wordGrips = iv.panel.querySelectorAll(".fm-word .drag-grip").length;
        log(`reorder handles: ${grips} on operators, ${wordGrips} on words: ` +
          ok(grips === 4 && wordGrips === iv.panel.querySelectorAll(".fm-word").length));

        // ── the rack survives a save/reload round trip ──
        const bytes = doc.toBytes();
        const { Document } = await import("../../src/doc/document.js");
        const { parseTaud } = await import("../../core/format/taud-parse.js");
        const reloaded = new Document(parseTaud(bytes));
        const back = reloaded.instruments[slot];
        log(`rack survives serialise/parse: ` +
          ok(back.isFm && back.metaLayers.length === 4 && back.fmProgram !== null));
        log(`…with the same algorithm: ` +
          ok(String([...back.fmProgram]) === String([...rack.fmProgram])));

        log("RESULT: " + (out.some((l) => l.includes("FAIL")) ? "FAIL" : "PASS"));
      } catch (e) {
        log("EXCEPTION: " + (e && e.stack ? e.stack : e));
        log("RESULT: FAIL");
      }
    })();
  </script>
</body>
</html>
