<!doctype html><meta charset="utf-8"><title>format 3 everywhere: widen on open + new projects (item 314)</title>
<pre id="out">running…</pre>
<img src="/hang" hidden>
<iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1200px;height:700px"></iframe>
<script type="module">
// Drives the REAL app: format 3 is the only format the editor holds. A
// version-2 project widens as it opens (saying so, once), the surround model
// only picks the panning, and a new project is born wide whatever it picks.
const out = document.getElementById("out");
const log = (s) => { out.textContent += "\n" + s; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let fails = 0;
const check = (ok, name, extra = "") => { if (!ok) fails++; log(`${ok ? "PASS" : "FAIL"} ${name}${extra ? " — " + extra : ""}`); };

(async () => {
  const app = document.getElementById("app");
  await new Promise((r) => app.addEventListener("load", r));
  const win = app.contentWindow;
  for (let i = 0; i < 200 && !win.__microtone; i++) await sleep(50);
  const M = win.__microtone;
  if (!M) { log("no __microtone"); return; }
  for (let i = 0; i < 200 && !M.store.song; i++) await sleep(50);
  const doc = win.document;
  const { store, projectView } = M;

  // ── 1. a version-2 file widens as it opens, and says so once ────────────
  const original = new Uint8Array(await (await fetch("../corpus/WHEN.taud")).arrayBuffer());
  check((original[8] & 0x1f) < 3, "the file on disk is an older format (WHEN is version 1)", String(original[8] & 0x1f));
  check(store.doc.wideCells === true && store.doc.fmtVer === 3, "…and opens as format 3",
    `${store.doc.wideCells}/${store.doc.fmtVer}`);
  check(store.doc.patternBytes(0, 0).length === 1024, "…its patterns 1024-byte images");
  check(store.audio ? store.audio.wideCells === true : true, "…and the engine reads the wide layout",
    String(store.audio?.wideCells));
  check(!doc.querySelector("dialog.modal"), "a ?load= link opens it without a word, as a demo does");
  // Opened as a file is (the Files tab, a drop, the Open dialog all come here):
  // the notice.
  M.loadBytes("WHEN.taud", original);
  let notice = null;
  for (let i = 0; i < 100 && !notice; i++) { notice = doc.querySelector("dialog.modal"); await sleep(30); }
  check(!!notice && /format 3/i.test(notice.textContent), "one short notice says it was converted",
    notice?.textContent?.slice(0, 60));
  check(notice?.querySelectorAll("button").length === 1, "…with a single dismiss");
  notice?.querySelector(".act-dismiss")?.click();
  await sleep(60);
  check(!store.doc.dirty, "opening does not dirty the project");
  check((store.doc.toBytes()[8] & 0x1f) === 3, "saving writes format 3");

  // ── 2. the surround model only chooses the panning ──────────────────────
  doc.querySelector('[data-view="project"]').click();
  await sleep(120);
  await projectView.setSurroundModel(2);
  await sleep(60);
  check(!doc.querySelector("dialog.modal"), "switching to spatial asks nothing");
  check(store.song.surroundModel === 2 && store.doc.wideCells, "…and the song is spatial, still format 3");
  const spatialW = M.timeline.colWFor(0);
  store.undo.undo();
  await sleep(60);
  check((store.song.surroundModel ?? 0) === 0 && store.doc.wideCells, "undo puts it back to stereo, still wide");
  check(M.timeline.colWFor(0) < spatialW,
    "a stereo song's lanes are narrower than a spatial one's", `${M.timeline.colWFor(0)} < ${spatialW}`);

  // ── 6. a new SURROUND project is born wide ──────────────────────────────
  store.doc.dirty = false; // skip the discard confirm
  const npBtn = doc.getElementById("newBtn");
  npBtn.click();
  let np = null;
  for (let i = 0; i < 100 && !np; i++) { np = doc.querySelector("dialog.np-modal"); await sleep(30); }
  check(!!np, "New Project opens");
  const panChips = np.querySelectorAll("[data-pan]");
  check(panChips.length === 3, "…offering stereo / planar / spatial", String(panChips.length));
  panChips[2].click(); // Spatial
  await sleep(30);
  check(np.querySelector('[data-f="panhint"]').textContent.length > 0,
    "…and explaining what a surround song's panning does");
  const before = store.doc;
  np.querySelector(".np-ok").click();
  for (let i = 0; i < 100 && store.doc === before; i++) await sleep(30);
  check(store.doc.wideCells === true, "the new project is wide-celled from birth");
  check(store.doc.fmtVer === 3 && store.song.surroundModel === 2, "…v3 + spatial",
    `${store.doc.fmtVer}/${store.song.surroundModel}`);
  check(store.doc.patternBytes(0, 0)[8] === 0x33, "…with FINE-by-zero empty cells",
    "$" + store.doc.patternBytes(0, 0)[8].toString(16));

  // ── 7. the wide columns are really editable (stage 3) ───────────────────
  doc.querySelector('[data-view="timeline"]').click();
  await sleep(150);
  store.record = true;
  store.cursor = { row: 0, ch: 0, sub: 2, nib: 1 }; // volume, first digit
  const press = (k, code) => win.dispatchEvent(new win.KeyboardEvent("keydown",
    { key: k, code: code ?? ("Key" + k.toUpperCase()), bubbles: true }));
  // Typing the LAST digit of a column advances the cursor to the next row, so
  // hold on to the cell being edited rather than re-reading through the cursor.
  const held = () => M.timeline.cursorCell()?.cell;
  let edited = held();

  press("f"); press("f");
  await sleep(60);
  check(edited?.volume === 0xff, "an 8-bit volume can be typed", String(edited?.volume));
  check(edited?.volumeEff === 0, "…as a SET");

  // Panning column: [symbol][elevation ×2][azimuth ×3]
  store.cursor = { row: 0, ch: 0, sub: 3, nib: 1 };
  edited = held();
  press("c"); press("0");           // elevation C0 = -64
  await sleep(40);
  check(edited?.elevation === -64, "the elevation digits are a signed byte",
    String(edited?.elevation));
  store.cursor = { row: 0, ch: 0, sub: 3, nib: 3 };
  press("1", "Digit1"); press("8", "Digit8"); press("0", "Digit0"); // azimuth 180 = behind
  await sleep(40);
  check(edited?.azimuth === 0x180, "…and the azimuth is nine bits",
    "$" + edited?.azimuth?.toString(16));
  check(edited?.panEff === 0, "…written as a SET");

  // The cursor walks all seventeen sub-positions of a wide cell.
  const E = await import("../../src/ui/edit.js");
  check(E.subPositions(true).length === 17, "the wide cell has 17 cursor stops");
  // Strips are sized per CHANNEL now (the second effect column is exposed one
  // channel at a time), so the width question is asked of a channel.
  check(M.timeline.colWFor(0) > 21 * 8, "…and the channel column grew to fit them",
    String(M.timeline.colWFor(0)));

  // ── 7b. the Patterns view draws a wide project ──────────────────────────
  // (The pane class does its own drawing and hit-testing, so it needs the
  // format helpers in its OWN scope — a v3 project crashed the tab without it.)
  const errs = [];
  win.addEventListener("error", (e) => errs.push(e.message));
  doc.querySelector('[data-view="pattern"]').click();
  await sleep(250);
  check(errs.length === 0, "the Patterns tab opens on a wide project", errs[0] ?? "");
  check(doc.querySelectorAll("#patternHost canvas").length > 0, "…and paints a pane");
  const pane = M.patternView.panes?.[0];
  check(pane ? pane.cellChars() === 24.75 : false, "…with the wide cell layout",
    String(pane?.cellChars?.()));
  // ── 7c. the Patterns view's BULK TOOLS on a wide pattern ────────────────
  // These are pure byte transforms over a whole pattern image, so they have to
  // know the cell stride: at the 8-byte one they silently edited the wrong row
  // (or, for Lengthen/Shorten, handed back a half-length image).
  const bulkPane = M.patternView.panes[0];
  M.patternView.setActiveIdx(0);
  bulkPane.setPattern(0);
  await sleep(80);
  const cellOf = (row) => store.doc.songs[0].patterns[bulkPane.patIdx][row];
  // Seed row 4 with values only a wide cell can hold.
  const { setCellOp } = await import("../../src/doc/ops.js");
  store.undo.apply(setCellOp(0, bulkPane.patIdx, 4,
    { volume: 0x64, volumeEff: 0, azimuth: 300, panEff: 0, elevation: -32 }));
  await sleep(60);

  /** Fill a showModal dialog's number fields and press its OK button. */
  const runModal = async (open, values) => {
    open();
    let m = null;
    for (let i = 0; i < 100 && !m; i++) { m = doc.querySelector("dialog.modal"); await sleep(30); }
    if (!m) return null;
    for (const [name, v] of Object.entries(values)) {
      const input = m.querySelector(`[name="${name}"]`);
      if (input) { input.value = String(v); input.dispatchEvent(new win.Event("input", { bubbles: true })); }
    }
    const ok = m.querySelector(".modal-buttons .proceed");
    ok.click();
    await sleep(120);
    return m;
  };

  // A row this smoke has not written to — earlier legs typed into rows 0 and 1.
  let blankRow = -1;
  for (let r = 0; r < 64; r++) {
    if (cellOf(r).volumeEff === 3 && cellOf(r).volume === 0) { blankRow = r; break; }
  }
  check(blankRow >= 0, "found an untouched row to watch", String(blankRow));

  const volModal = await runModal(() => bulkPane.volumeOp(), { mult: 2, add: 0 });
  check(!!volModal, "the Volume tool opens on a wide project");
  check(cellOf(4).volume === 0xc8, "volume ×2 scaled the row it named, as a whole byte",
    String(cellOf(4).volume));
  check(cellOf(4).azimuth === 300 && cellOf(4).elevation === -32,
    "…and left the panning column alone", `${cellOf(4).azimuth}/${cellOf(4).elevation}`);
  check(cellOf(blankRow).volumeEff === 3 && cellOf(blankRow).volume === 0,
    "…and blank rows stayed blank",
    `${cellOf(blankRow).volumeEff}/${cellOf(blankRow).volume}`);
  store.undo.undo();
  await sleep(60);
  check(cellOf(4).volume === 0x64, "Volume undoes");

  // The offset field's range follows the format — ±63 would be a quarter of
  // the move it used to be on a 6-bit column.
  await runModal(() => bulkPane.volumeOp(), { mult: 1, add: 100 });
  check(cellOf(4).volume === 0xc8, "a +100 offset is accepted on an 8-bit column",
    String(cellOf(4).volume));
  store.undo.undo();
  await sleep(60);

  await runModal(() => bulkPane.panOp(), { mult: 1, shift: 100 });
  check(cellOf(4).azimuth === 400, "the panning tool moves the 9-bit azimuth",
    String(cellOf(4).azimuth));
  check(cellOf(4).volume === 0x64, "…and leaves the volume alone", String(cellOf(4).volume));
  store.undo.undo();
  await sleep(60);

  await runModal(() => bulkPane.panOp(), { mult: 1, shift: -400 });
  check(cellOf(4).azimuth === 412, "…wrapping round the circle rather than clamping",
    String(cellOf(4).azimuth));
  store.undo.undo();
  await sleep(60);

  const lenBefore = store.doc.patternBytes(0, bulkPane.patIdx).length;
  await runModal(() => bulkPane.lengthenOp(), { factor: 2 });
  check(store.doc.patternBytes(0, bulkPane.patIdx).length === lenBefore,
    "Lengthen keeps the image 1024 bytes",
    String(store.doc.patternBytes(0, bulkPane.patIdx).length));
  check(cellOf(8).volume === 0x64 && cellOf(8).azimuth === 300,
    "…and row 4 moved to row 8 whole", `${cellOf(8).volume}/${cellOf(8).azimuth}`);
  store.undo.undo();
  await sleep(60);
  check(cellOf(4).volume === 0x64 && cellOf(8).volume === 0, "Lengthen undoes");
  store.undo.undo(); // drop the seeded cell
  await sleep(60);

  doc.querySelector('[data-view="timeline"]').click();
  await sleep(120);

  // The panner can write that same position into the COLUMN.
  store.cursor = { row: 1, ch: 0, sub: 0, nib: 0 };
  doc.getElementById("tbPanner").click();
  let pan2 = null;
  for (let i = 0; i < 100 && !pan2; i++) { pan2 = doc.querySelector("dialog.panner"); await sleep(30); }
  check(!!pan2, "the panner opens on a wide project");
  const colBtn = [...pan2.querySelectorAll("button")].find((b) => /^Column/.test(b.textContent));
  check(!!colBtn, "…and offers a Column button", colBtn?.textContent);
  pan2.__panner.setAngles(256, 32);
  colBtn.click();
  await sleep(60);
  pan2.__panner.close();
  await sleep(40);
  store.cursor = { row: 1, ch: 0, sub: 0, nib: 0 };
  const c2 = held();
  check(c2?.azimuth === 256 && c2?.panEff === 0, "…which writes the panning column",
    `${c2?.azimuth}/${c2?.panEff}`);
  check(c2?.effect === 0, "…leaving the effect slot free");

  log(fails === 0 ? "\nALL PASS\nRESULT: PASS" : `\n${fails} FAILED\nRESULT: FAIL`);
})();
</script>
