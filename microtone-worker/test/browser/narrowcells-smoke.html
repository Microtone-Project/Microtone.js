<!doctype html><meta charset="utf-8"><title>Timeline narrow cells, pitch plot under G, Cues lamps</title>
<pre id="out">running…</pre>
<img src="/hang" hidden>
<iframe id="app" src="../../index.html?load=assets/demo_projects/Daisy_bell.taud" style="width:1400px;height:800px"></iframe>
<script type="module">
// Three grid upgrades, end to end in the app:
//   * the Timeline's narrow cells (item 254) — the toolbox button's cycle,
//     the strip widths and header, and the cursor seated on the column a
//     slot shows (an edit goes there);
//   * the pitch plot drawing what a row SOUNDS (item 250) — a note under `G`
//     stays on the pitch the portamento is leaving;
//   * the Cues header's event lamps (item 252), lit by playback.
//   node tools/browser-smoke.js test/browser/narrowcells-smoke.html 60
const out = document.getElementById("out");
const log = (s) => { out.textContent += "\n" + s; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const frames = async (win, n) => { for (let i = 0; i < n; i++) await new Promise((r) => win.requestAnimationFrame(r)); };
let fails = 0;
const check = (ok, name, extra = "") => { if (!ok) fails++; log(`${ok ? "PASS" : "FAIL"} ${name}${extra ? " — " + extra : ""}`); };

(async () => {
  try {
    const app = document.getElementById("app");
    await new Promise((r) => app.addEventListener("load", r));
    const win = app.contentWindow;
    for (let i = 0; i < 200 && !win.__microtone; i++) await sleep(50);
    const M = win.__microtone;
    for (let i = 0; i < 200 && !M.store.song; i++) await sleep(50);
    await frames(win, 3);
    const { store } = M;
    const tl = M.timeline;
    const ops = await import("../../src/doc/ops.js");
    const E = await import("../../src/ui/edit.js");
    const wide = store.doc.wideCells === true;
    const STRIDE = wide ? 13 : 8;

    // ── a known pattern on cue 0, lane 0 ────────────────────────────────
    const PAT = store.song.cues[0][0] & 0x7fff;
    const bytes = new Uint8Array(64 * STRIDE);
    for (let r = 0; r < 64; r++) {
      if (wide) bytes[r * STRIDE + 8] = 0x33; // both selectors on the no-op
      else { bytes[r * STRIDE + 3] = 0xc0; bytes[r * STRIDE + 4] = 0xc0; }
    }
    const note = (r, n, inst) => { bytes[r * STRIDE] = n & 0xff; bytes[r * STRIDE + 1] = n >> 8; bytes[r * STRIDE + 2] = inst; };
    const fx = (r, op, arg) => { bytes[r * STRIDE + 5] = op; bytes[r * STRIDE + 6] = arg & 0xff; bytes[r * STRIDE + 7] = arg >> 8; };
    note(0, 0x5000, 1);           // row 0: a note
    fx(1, 0x0a, 0x0f00);          // row 1: an effect alone (A $0F00)
    //                               row 2: nothing
    note(4, 0x5000, 1);           // rows 4/6: a slow portamento up a third
    note(6, 0x5555, 0); fx(6, 0x10, 0x0004);
    store.undo.apply(ops.setPatternBytesOp(store.songIndex, PAT, bytes));
    store.emit("edit");
    await frames(win, 2);

    // ── narrow cells ─────────────────────────────────────────────────────
    const btn = win.document.getElementById("tbCells");
    check(btn && !btn.hidden, "the cells button shows with the Timeline open");
    const fullW = tl.colWFor(0), fullH = tl.headerH();
    btn.click(); await frames(win, 2);
    check(store.timelineCells === 1 && /2/.test(btn.textContent), "one click: two slots", btn.textContent);
    check(tl.colWFor(0) < fullW / 1.5, "the strips are narrower", `${fullW} → ${tl.colWFor(0)}`);
    check(tl.chanLayout().length > 1 && new Set(tl.chanLayout().map((s) => s.w)).size === 1,
      "every lane the same width");

    store.cursor.row = 1; store.cursor.ch = 0; store.cursor.sub = E.SUB_NOTE; store.cursor.nib = 0;
    tl.moveCursor(0, 0);
    check(store.cursor.sub === E.SUB_FX_OP, "on an effect-only row the cursor stands on the effect");
    tl.moveCursor(1, 0);
    check(store.cursor.sub === E.SUB_NOTE, "on an empty row it comes back to the note it was put on");
    tl.moveCursor(-1, 0);
    store.record = true;
    const jam = { octave: 4, transpose: 0, currentInst: 1, hold() {} };
    tl.processEditKey({ code: "KeyC", key: "c", repeat: false, shiftKey: false }, jam);
    const cell1 = store.doc.patternAt(store.songIndex, PAT)[1];
    check(cell1.effect === 12 && cell1.note === 0, "typing goes to the column the slot shows",
      `effect ${cell1.effect}, note ${cell1.note}`);
    store.record = false;
    // slot B: a volume wanted on a row with a panning only
    store.cursor.row = 2; tl.moveCursor(0, 0);
    tl.moveSubCursor(1); tl.moveSubCursor(1); tl.moveSubCursor(1);
    check(store.cursor.sub === E.SUB_VOL, "three steps right of the note: slot B, the volume",
      `sub ${store.cursor.sub}`);
    const hit = tl.hitTest(tl.chanLayout()[0].x + 2 + 0.5 * 7.9, tl.headerH() + (1 - Math.floor(tl.scrollRow)) * 16 + 8);
    check(hit && hit.row === 1 && hit.sub === E.SUB_FX_OP, "a click on slot A of the effect row hits the effect");
    tl.draw(-1);

    btn.click(); await frames(win, 2);
    check(store.timelineCells === 2, "two clicks: one slot");
    check(tl.headerH() === fullH - 16, "one slot: the lane-state row goes", `${fullH} → ${tl.headerH()}`);
    check(tl.colWFor(0) < fullW / 2.5, "narrower again", String(tl.colWFor(0)));
    tl.draw(-1);
    btn.click(); await frames(win, 2);
    check(store.timelineCells === 0 && tl.colWFor(0) === fullW && tl.headerH() === fullH,
      "three clicks: back to the full cell");

    // ── the pitch plot under G ───────────────────────────────────────────
    store.pitchPlot = true;
    tl.dropBends();
    const geo = tl.plotFor(0);
    // cue 0 starts at song row 0, so pattern rows are song rows here
    check(geo[6]?.x != null && geo[6].x === geo[4].x,
      "a note under G plots where the glide still is, not at its target",
      `row 4 ${geo[4]?.x}, row 6 ${geo[6]?.x}`);
    check(geo[7]?.x == null || geo[7].x >= geo[6].x, "…and the glide climbs from there");
    store.pitchPlot = false;
    tl.dropBends();

    // ── the Cues lamps ───────────────────────────────────────────────────
    M.split.reveal("cues");
    await frames(win, 3);
    const cues = M.cuesView;
    win.document.getElementById("playSong").click();
    let lit = false;
    for (let i = 0; i < 80 && !lit; i++) {
      await sleep(50);
      lit = Array.from(cues._lampAt).some((t) => t > 0);
    }
    check(store.audio?.isPlaying() === true, "the song plays");
    check(lit, "a lane's lamp lights when a row reaches it");
    const now = win.performance.now();
    check(Array.from({ length: store.doc.channelCount }, (_, ch) => cues.lampLevel(ch, now)).some((v) => v > 0),
      "…and is lit right now");
    await sleep(600);
    win.document.getElementById("stopBtn").click();
    await sleep(500);
    await frames(win, 2);
    const after = win.performance.now();
    check(Array.from({ length: store.doc.channelCount }, (_, ch) => cues.lampLevel(ch, after)).every((v) => v === 0),
      "stopped, every lamp has gone out");
    M.split.reveal("timeline");
  } catch (e) {
    fails++;
    log("EXCEPTION " + (e?.stack ?? e));
  }
  log(`FAILURES: ${fails}`);
})();
</script>
