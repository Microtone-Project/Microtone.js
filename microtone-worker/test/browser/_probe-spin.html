<!doctype html><html><head><meta charset="utf-8"></head><body>
<pre id="out">running…</pre><img src="/hang" hidden>
<iframe id="app" src="../../index.html?load=assets/demo_projects/Daisy_bell.taud" style="width:1280px;height:900px"></iframe>
<script type="module">
const out = []; const log = (l) => { out.push(l); document.getElementById("out").textContent = out.join("\n"); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const waitFor = (fn, ms = 8000) => new Promise((res, rej) => { const t0 = Date.now(); const p = setInterval(() => { let v; try { v = fn(); } catch { v = null; } if (v) { clearInterval(p); res(v); } else if (Date.now() - t0 > ms) { clearInterval(p); rej(new Error("timeout")); } }, 50); });
const report = (where, root, win) => {
  const groups = [...root.querySelectorAll(".mt-spin, .mt-pick")].filter((g) => g.offsetParent);
  const rows = new Map();
  for (const g of groups) {
    const a = g.querySelector(".mt-dec"), b = g.querySelector(".mt-inc"); const fld = g.querySelector("[data-mt]"); const ms = [a, b, fld].map((x) => win.getComputedStyle(x)).map((c) => c.marginLeft + "/" + c.marginRight).join(" ");
    const ca = win.getComputedStyle(a), cb = win.getComputedStyle(b);
    const lab = g.closest("label");
    const key = `${g.className} dec=${a.getBoundingClientRect().width.toFixed(1)} inc=${b.getBoundingClientRect().width.toFixed(1)} padL/R dec=${ca.paddingLeft}/${ca.paddingRight} inc=${cb.paddingLeft}/${cb.paddingRight} mL inc=${cb.marginLeft} incFS=${cb.fontSize} decFS=${ca.fontSize} inLabel=${!!lab}${lab ? " labelCtl=" + (lab.control?.classList?.contains("mt-step") ? "STEP" : lab.control?.tagName) : ""} margins=${ms} decX<fieldX<incX=${a.getBoundingClientRect().x < fld.getBoundingClientRect().x && fld.getBoundingClientRect().x < b.getBoundingClientRect().x} path=${g.parentElement.className}`;
    rows.set(key, (rows.get(key) ?? 0) + 1);
  }
  log(`== ${where}: ${groups.length}`);
  for (const [k, n] of rows) log(`  ${n}× ${k}`);
};
(async () => { try {
  const frame = document.getElementById("app");
  const win = await waitFor(() => { const w = frame.contentWindow; return w && w.__microtone?.store.doc ? w : null; });
  const { instrumentsView: iv } = win.__microtone; const d = win.document;
  d.querySelector('#tabs button[data-view="instruments"]').click(); await sleep(400);
  report("general", iv.panel, win);
  [...d.querySelectorAll(".side-toolbar-inst button")][5].click();
  const chooser = await waitFor(() => d.querySelector("dialog.kind-modal"));
  [...chooser.querySelectorAll(".kind-card")][1].click();
  const dlg = await waitFor(() => d.querySelector("dialog.import-modal"));
  report("new FM dialog", dlg, win);
  const sel = dlg.querySelector(".fm-easy-new select"); sel.value = "5"; sel.dispatchEvent(new win.Event("change"));
  dlg.querySelector("input.import-filter").value = "probe";
  dlg.querySelector(".modal-buttons .proceed").click();
  await waitFor(() => !d.querySelector("dialog.import-modal"));
  await waitFor(() => iv.panel.querySelector(".fm-easy-routing")); await sleep(200);
  report("easy", iv.panel, win);
  [...iv.tabBar.querySelectorAll("button")][1].click(); await sleep(400);
  report("fm", iv.panel, win);
  for (const q of ["td.velCell .mt-spin", "td.detCell .mt-spin", "td.mixCell .mt-spin", "td.fm-easy-freq .mt-spin", ".slider-row .mt-spin"]) {
    const g = d.querySelector(q) ?? null; if (!g) { log(q + " none"); continue; }
    const gb = g.getBoundingClientRect(); const cs = win.getComputedStyle(g);
    log(`${q}: group x=${gb.x.toFixed(1)} w=${gb.width.toFixed(1)} border=${cs.borderLeftWidth} pad=${cs.paddingLeft}/${cs.paddingRight} display=${cs.display} children=${g.children.length}`);
    for (const c of g.children) { const b = c.getBoundingClientRect(); const s = win.getComputedStyle(c); log(`   ${c.tagName}.${c.className} x=${(b.x-gb.x).toFixed(1)} w=${b.width.toFixed(1)} mL=${s.marginLeft} mR=${s.marginRight} flex=${s.flex} minW=${s.minWidth} width=${s.width}`); }
  }
  log("DONE");
} catch (e) { log("ERR " + e.stack); } })();
</script></body></html>
