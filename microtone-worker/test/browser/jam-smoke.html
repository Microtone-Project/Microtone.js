<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>jam-before-play smoke</title></head>
<body>
  <pre id="out">running…</pre>
  <!-- real-time recipe: /hang keeps the load event pending so audio + timers run
       in REAL time. Run with:
         python3 tools/test-server.py
         chromium --headless=new --autoplay-policy=no-user-gesture-required \
           --dump-dom --timeout=60000 http://localhost:8932/test/browser/jam-smoke.html -->
  <img src="http://localhost:8932/hang" hidden>
  <iframe id="app" src="../../index.html?load=test/corpus/WHEN.taud" style="width:1000px;height:600px"></iframe>
  <script type="module">
    // Item 26: the engine is warmed up on load; after a gesture resume, note
    // jamming must sound WITHOUT the song ever being played.
    // Item 140: it sounds on the dedicated jam bank, so a MUTED cursor channel
    // still auditions, and held keys chord with per-key releases.
    import { JAM_VOICES, JAM_VOICE_BASE } from "../../core/engine/constants.js";
    const out = [];
    const log = (l) => { out.push(l); document.getElementById("out").textContent = out.join("\n"); };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    /** Bank voices sounding right now, as seen by the snapshot. */
    const bankVoices = (audio) => {
      const live = [];
      for (let i = 0; i < JAM_VOICES; i++) {
        if (audio.getVoiceActive(JAM_VOICE_BASE + i)) live.push(JAM_VOICE_BASE + i);
      }
      return live;
    };
    /** Poll until `fn()` is truthy (snapshots land every ~16 ms). */
    const until = async (fn, tries = 40) => {
      for (let i = 0; i < tries; i++) { const v = fn(); if (v && v.length !== 0) return v; await sleep(25); }
      return fn();
    };
    (async () => {
      try {
        const frame = document.getElementById("app");
        const win = await new Promise((resolve) => {
          const poll = setInterval(() => {
            const w = frame.contentWindow;
            if (w && w.__microtone?.store.doc) { clearInterval(poll); resolve(w); }
          }, 100);
        });
        const { store, jam } = win.__microtone;
        log("app + doc ready");

        // Resume the eagerly-warmed engine (autoplay flag lets this run headless).
        await win.__microtoneEnsureAudio();
        for (let i = 0; i < 50 && !store.audio?.running; i++) await sleep(50);
        const audio = store.audio;
        log(`audio running (pre-Play): ${audio?.running}`);
        const notPlaying = !audio.isPlaying();

        store.record = false;
        store.view = "timeline";
        store.cursor = { row: 0, ch: 0, sub: 0, nib: 0 };
        jam.currentInst = store.doc.usedInstrumentSlots()[0] ?? 1;

        // 1 — jam WITHOUT pressing Play, on a MUTED cursor channel (item 140).
        store.setVoiceMute(0, true);
        jam.down("KeyA", false);
        const live1 = await until(() => bankVoices(audio));
        const stillNotPlaying = !audio.isPlaying();
        const chan0Idle = !audio.getVoiceActive(0);
        log(`muted-channel jam sounds on the bank: ${live1.length === 1} (${live1}) · channel 0 untouched: ${chan0Idle}`);
        log(`transport idle throughout: ${notPlaying && stillNotPlaying}`);

        // 2 — chord: three held keys, three bank voices (item 140.1).
        jam.down("KeyS", false);
        jam.down("KeyD", false);
        const live3 = await until(() => { const v = bankVoices(audio); return v.length >= 3 ? v : null; });
        log(`three held keys → ${live3?.length ?? 0} sounding bank voices`);

        // 3 — releasing ONE key leaves the others sounding.
        jam.releaseGraceMs = 0;
        jam.up("KeyS");
        await sleep(120);
        const live2 = bankVoices(audio);
        log(`after one release: ${live2.length} still sounding`);

        // 4 — record mode is monophonic: two keys, one voice.
        jam.up("KeyA"); jam.up("KeyD");
        await sleep(150);
        store.record = true;
        jam.down("KeyA", false);
        jam.down("KeyS", false);
        const mono = await until(() => bankVoices(audio));
        log(`record mode → ${mono.length} sounding voice (mono entry)`);
        jam.allUp();
        store.record = false;
        store.setVoiceMute(0, false);
        await sleep(150);
        const quiet = bankVoices(audio).length === 0;
        log(`bank silent after allUp: ${quiet}`);

        // 5 — item 143: jamming after Stop must revive nothing the stop cut.
        // Play for a moment, stop, then hold a key: the song's channels stay
        // silent while the bank sounds. (Stop used to leave every voice frozen
        // and `active`, and the jam's render brought them all back.)
        audio.play(0);
        const played = await until(() => {
          const live = [];
          for (let ch = 0; ch < 32; ch++) if (audio.getVoiceActive(ch)) live.push(ch);
          return live.length >= 2 ? live : null;
        });
        log(`playing: ${played?.length ?? 0} channels sounding`);
        audio.stop(0);
        await sleep(150);
        const stoppedQuiet = !Array.from({ length: 32 }, (_, ch) => ch)
          .some((ch) => audio.getVoiceActive(ch));
        log(`after Stop: every channel silent: ${stoppedQuiet}`);
        jam.down("KeyA", false);
        const live5 = await until(() => bankVoices(audio));
        const noRevival = !Array.from({ length: 32 }, (_, ch) => ch)
          .some((ch) => audio.getVoiceActive(ch));
        log(`jam after Stop: bank ${live5.length} · song channels still silent: ${noRevival}`);
        jam.allUp();
        await sleep(150);

        const pass = audio.running && notPlaying && stillNotPlaying &&
          live1.length === 1 && chan0Idle && live3?.length === 3 && live2.length === 2 &&
          mono.length === 1 && quiet &&
          (played?.length ?? 0) >= 2 && stoppedQuiet && live5.length === 1 && noRevival;
        log(pass ? "RESULT: PASS" : "RESULT: FAIL");
      } catch (err) {
        log(`RESULT: ERROR ${err.message}\n${err.stack}`);
      }
    })();
  </script>
</body>
</html>
