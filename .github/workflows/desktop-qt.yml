# The Qt desktop build (desktop-qt/, item 336), against Qt 6.11 on all three
# (macOS 13 and later, Windows 10 1809 and later). Not 6.8 LTS: its
# QtWebEngine drew a dropdown's list at the output's rounded-up scale on a
# fractionally scaled Wayland desktop, and its Chromium (122) cannot draw the
# list in the page, where the theme reaches its scrollbar (135+):
#   windows  the shell, the C engine, the WASAPI backend and ASIO (RtAudio)
#            built with MSVC, packaged with windeployqt, the C runtime and the
#            staged web app, then made into an installer
#            (desktop-qt/installer/microtone.nsi);
#   macos    a universal Microtone.app (Apple silicon and Intel, Core Audio),
#            macdeployqt'd, signed ad hoc, in a .dmg — and, since nobody here
#            has a Mac, smoke-tested on the runner (desktop-qt/tools/
#            native-smoke.js: the page, the native audio into the runner's
#            virtual device, bit for bit against the WebAssembly engine);
#   linux    on Ubuntu 22.04 (what it builds on, it runs on and after): an
#            AppImage, a .deb and an .rpm of one tree with Qt beside the app
#            (desktop-qt/tools/linux-package.sh), smoke-tested into a
#            PulseAudio null sink; then run on Ubuntu 24.04 (the AppImage, and
#            the .deb installed by apt; the AppImage again natively on
#            Wayland) and installed in Fedora (the .rpm).
# All three run the updater end to end (desktop-qt/tools/update-test.js:
# Windows reinstalling through the NSIS installer, macOS putting a new bundle
# in place, an AppImage replacing its file, a .deb installed over itself) and
# a copy that does not update itself being told (Windows' portable folder,
# Linux's bare tree).
#
# RELEASES. The version is microtone-worker/package.json's, and bumping it is
# what ships: a push to master whose version has no v<version> release yet
# builds for the "stable" update channel, signs the updates with the updater
# key (the TAURI_SIGNING_PRIVATE_KEY secrets — the Tauri build's key, which
# its copies trust), uploads everything to a draft release with its
# desktop.json, and publishes it as "latest" once every platform is in.
# Installed copies ask https://microtone.cc/api/desktop/update
# (server/desktop-update.js), which sends them to
#   https://github.com/<repo>/releases/latest/download/desktop.json
# The release also carries latest.json, the BRIDGE for Tauri copies up to
# 5.0.5: they read GitHub's latest release's latest.json (compiled into them),
# and this one is v5.0.6's own, so they update to the last Tauri build, which
# then moves them on through the site (desktop-qt/README.md, "Updates").
# Every other push to master builds and tests, and keeps artifacts only.
#
# By hand, "publish-preview" signs the build and puts it, with its
# desktop.json, on the desktop-preview pre-release (never "latest"), which
# the testers' copies update from; "channel" is the channel the build itself
# asks (preview; stable once, to move the testers' copies to the releases).
name: Desktop (Qt)

on:
  workflow_dispatch:
    inputs:
      publish-preview:
        description: "Publish this build to the desktop-preview pre-release (the testers' update channel)"
        type: boolean
        default: false
      channel:
        description: "The update channel this build asks"
        type: choice
        options: [preview, stable]
        default: preview
  push:
    branches: [master]
    paths:
      - "desktop-qt/**"
      - "core/**"
      - "microtone-worker/**"
      - "tools/stage-site.js"
      - "COPYING"
      - ".github/workflows/desktop-qt.yml"

# A release must never be cancelled half-way: on master a run waits for the
# one before it (a newer push replaces only a run still waiting, and the run
# that does go looks for its version's release itself).
concurrency:
  group: desktop-qt-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  UPDATE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}

jobs:
  # Whether this run releases (a push to master with no v<version> release
  # yet), and whether it signs (a release, or a preview published by hand).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
      sign: ${{ steps.read.outputs.sign }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        env:
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.publish-preview }}
        run: |
          version=$(node -p "require('./microtone-worker/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "v$version is released already: build and test only."
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" = true ] || [ "$PREVIEW" = true ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; else echo "sign=false" >> "$GITHUB_OUTPUT"; fi
          echo "version $version, release $release, channel $UPDATE_CHANNEL"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Qt for MSVC with what the shell needs: WebEngine (and the two modules
      # it stands on), the HTTP server the app is served from, WebSockets for
      # the native audio host.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # qtserialport: the NMEA position plugin (QtWebEngine's Positioning)
          # links it.
          modules: qtwebengine qtwebchannel qtpositioning qthttpserver qtwebsockets qtserialport
          # From 6.11 Qt's Windows repository has a folder per compiler build,
          # which no aqtinstall release reads yet (3.3.0 asks for the old
          # path and gets 404); its master does (3.3.1.dev168, tried on
          # 6.11.3 with WebEngine, 2026-11-19). Pinned to that commit; back to
          # `aqtversion` once a release has it (3.4.0).
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7"
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S desktop-qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMICROTONE_UPDATE_CHANNEL=${{ env.UPDATE_CHANNEL }}

      - name: Build
        run: cmake --build build

      # Bringing over what the earlier desktop app kept (src/oldapp.cpp): the
      # copy's rules, and the Chromium reader on a real Edge profile — the
      # engine and storage WebView2 is — under the earlier app's own origin.
      - name: Earlier app's projects
        continue-on-error: true
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          node desktop-qt/tools/oldapp-test.js build/oldapp-dump.exe --browser $edge | Tee-Object -FilePath oldapp.txt
          $status = $LASTEXITCODE
          $fence = '```'
          "### Earlier app's projects (exit $status)", $fence, (Get-Content oldapp.txt -Raw), $fence | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $status

      - name: Package
        shell: pwsh
        run: |
          $version = node -p "require('./microtone-worker/package.json').version"
          $out = "build/Microtone-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/microtone.exe, build/wasapi-probe.exe, build/asio-probe.exe $out
          # The debug information beside the exe, so a crash report names its
          # frames (src/crashlog.c); and the failure-report collector, which
          # the installer puts in the Start menu.
          Copy-Item build/microtone.pdb, desktop-qt/installer/diagnostics.cmd $out
          # The Qt runtime, WebEngine's process and resources among it — but
          # not vc_redist.x64.exe, which needs an administrator to run: the C
          # runtime's own DLLs go beside the app instead (Microsoft's "local
          # deployment"), so a per-user install needs nothing else.
          windeployqt --release --no-compiler-runtime --no-system-d3d-compiler --no-opengl-sw "$out/microtone.exe"
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) { throw "no C runtime under '$env:VCToolsRedistDir'" }
          Copy-Item "$($crt.FullName)\*.dll" $out
          Copy-Item COPYING "$out/LICENSE.txt"
          # The third-party notices (Qt, Chromium, RtAudio, the ASIO SDK,
          # Monocypher, the C runtime) and the licence texts they point to.
          node desktop-qt/tools/collect-notices.js --platform windows --out $out --qmake qmake
          # The web app, where the binary looks for it: www/ beside itself.
          node desktop-qt/tools/stage-frontend.js "$out/www"
          "version=$version" >> $env:GITHUB_ENV

      # The packaged app on the runner: the page, the file store (a 40 MB
      # project in and out of a folder of the test's own). The runner has no
      # sound device, so the audio half is skipped: exit 3, which is fine.
      - name: Smoke test
        continue-on-error: true
        shell: pwsh
        run: |
          node desktop-qt/tools/native-smoke.js "build/Microtone-$env:version-windows-x64/microtone.exe" --seconds 5 | Tee-Object -FilePath smoke.json
          $status = $LASTEXITCODE
          $fence = '```'
          "### Windows smoke test (exit $status; 3 = no sound device on the runner)", "${fence}json", (Get-Content smoke.json -Raw), $fence | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($status -ne 0 -and $status -ne 3) { exit $status }
          exit 0

      # NSIS: on the runner image, or from Chocolatey where it is not.
      - name: Installer
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress }
          }
          $root = (Get-Location).Path
          $stage = "$root\build\Microtone-$env:version-windows-x64"
          node desktop-qt/tools/installer-files.js $stage build/installer-lists
          $numeric = [regex]::Match($env:version, '^\d+\.\d+\.\d+').Value
          & $makensis /V3 /INPUTCHARSET UTF8 "/DVERSION=$env:version" "/DFILEVERSION=$numeric.0" `
            "/DSTAGE=$stage" "/DLISTS=$root\build\installer-lists" `
            "/DOUTFILE=$root\build\Microtone-$env:version-windows-x64-setup.exe" desktop-qt/installer/microtone.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }

      # The updater, for real: the app installed by its installer, offered a
      # "99.0.0" that is that installer (signed with a key of the test's own),
      # Download, Restart now — the app quits, the installer runs with /P /R
      # and starts it again.
      - name: Updater
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = "build\Microtone-$env:version-windows-x64-setup.exe"
          Start-Process -Wait -FilePath $setup -ArgumentList "/S"
          $exe = "$env:LOCALAPPDATA\Programs\Microtone\microtone.exe"
          node desktop-qt/tools/update-test.js $exe --mode windows --installer $setup | Tee-Object -FilePath update.json
          $status = $LASTEXITCODE
          $fence = '```'
          "### Windows updater (exit $status)", "${fence}json", (Get-Content update.json -Raw), $fence | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $status

      # The portable folder does not update itself: it is told, with the
      # release's page (not pressed here: Windows has no stand-in browser).
      - name: Updater (portable)
        continue-on-error: true
        shell: pwsh
        run: |
          node desktop-qt/tools/update-test.js "build/Microtone-$env:version-windows-x64/microtone.exe" --mode notice | Tee-Object -FilePath notice.json
          $status = $LASTEXITCODE
          $fence = '```'
          "### Windows portable copy told of an update (exit $status)", "${fence}json", (Get-Content notice.json -Raw), $fence | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $status

      # Signed (a release, or a preview), and checked against the key the app
      # trusts before anything is published.
      - name: Sign the update
        if: needs.version.outputs.sign == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $setup = "build/Microtone-$env:version-windows-x64-setup.exe"
          npx --yes -p @tauri-apps/cli@2.12.1 tauri signer sign --app-version $env:version $setup
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          build/minisign-check.exe - $setup "$setup.sig"
          if ($LASTEXITCODE -ne 0) { throw "the signature is not one the app accepts" }

      - uses: actions/upload-artifact@v4
        with:
          name: Microtone-${{ env.version }}-windows-x64
          path: build/Microtone-${{ env.version }}-windows-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Microtone-${{ env.version }}-windows-x64-setup
          path: |
            build/Microtone-${{ env.version }}-windows-x64-setup.exe
            build/Microtone-${{ env.version }}-windows-x64-setup.exe.sig
          if-no-files-found: error
          compression-level: 0  # LZMA already

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.3"
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebengine qtwebchannel qtpositioning qthttpserver qtwebsockets qtserialport
          aqtversion: ">=3.2.1"
          cache: true

      # One binary for both kinds of Mac (Qt's own is universal).
      - name: Configure
        run: cmake -S desktop-qt -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DMICROTONE_UPDATE_CHANNEL=${{ env.UPDATE_CHANNEL }}

      - name: Build
        run: cmake --build build --parallel 4

      # Bringing over what the earlier desktop app kept (src/oldapp.cpp): on a
      # Mac it kept them as WebKit does, which the copy's rules test uses.
      - name: Earlier app's projects
        continue-on-error: true
        run: |
          set +e
          node desktop-qt/tools/oldapp-test.js build/oldapp-dump | tee oldapp.txt
          status=${PIPESTATUS[0]}
          { echo "### Earlier app's projects (exit $status)"; echo '```'; cat oldapp.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Package
        run: |
          version=$(node -p "require('./microtone-worker/package.json').version")
          app=build/Microtone.app
          # The web app where the binary looks for it, and the licence.
          node desktop-qt/tools/stage-frontend.js "$app/Contents/Resources/www"
          cp COPYING "$app/Contents/Resources/LICENSE.txt"
          # The third-party notices (Qt, Chromium, RtAudio, Monocypher) and the
          # licence texts they point to.
          node desktop-qt/tools/collect-notices.js --platform macos --out "$app/Contents/Resources" --qmake qmake
          # Qt's frameworks, WebEngine's helper app and resources among them.
          macdeployqt "$app" -always-overwrite
          # An Apple-silicon Mac runs nothing unsigned: an ad hoc signature,
          # not a Developer ID, so Gatekeeper still asks once (README).
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/Microtone"
          mkdir -p build/dmg
          ditto "$app" build/dmg/Microtone.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Microtone $version" -srcfolder build/dmg -ov -format UDZO "build/Microtone-$version-macos.dmg"
          # The update: the bundle as a tarball, as Tauri's .app.tar.gz is.
          tar -czf "build/Microtone-$version-macos.app.tar.gz" -C build Microtone.app
          echo "version=$version" >> "$GITHUB_ENV"

      # The runner's own "Apple Virtual Sound Device" is the output (a driver
      # like BlackHole would need a reboot to appear).
      - name: Smoke test
        continue-on-error: true
        run: |
          set +e
          node desktop-qt/tools/native-smoke.js build/Microtone.app/Contents/MacOS/Microtone --seconds 10 | tee smoke.json
          status=${PIPESTATUS[0]}
          { echo "### macOS smoke test (exit $status)"; echo '```json'; cat smoke.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The updater, for real: a copy of the bundle is the installed app,
      # offered a "99.0.0" that is the bundle again, marked (signed with a key
      # of the test's own); Restart now — the marked bundle takes the old
      # one's place, the old one goes, and the app starts again.
      - name: Updater
        continue-on-error: true
        run: |
          set +e
          node desktop-qt/tools/update-test.js build/Microtone.app/Contents/MacOS/Microtone --mode mac | tee update.json
          status=${PIPESTATUS[0]}
          { echo "### macOS updater (exit $status)"; echo '```json'; cat update.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Sign the update
        if: needs.version.outputs.sign == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          update="build/Microtone-$version-macos.app.tar.gz"
          npx --yes -p @tauri-apps/cli@2.12.1 tauri signer sign --app-version "$version" "$update"
          build/minisign-check - "$update" "$update.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: Microtone-${{ env.version }}-macos
          path: |
            build/Microtone-${{ env.version }}-macos.dmg
            build/Microtone-${{ env.version }}-macos.app.tar.gz
            build/Microtone-${{ env.version }}-macos.app.tar.gz.sig
          if-no-files-found: error
          compression-level: 0  # the .dmg is compressed already

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The audio APIs' headers (JACK's only: the system's libjack is loaded
      # when there is one, src/weakjack.c); what Qt's xcb platform plugin and
      # QtWebEngine need to run (linuxdeploy carries those a desktop may lack);
      # rpmbuild; and a display and a sound server for the tests.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libjack-jackd2-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-xinput0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 \
            libxshmfence1 libxi6 libdbus-1-3 libcups2 libwayland-client0 libwayland-cursor0 libwayland-egl1 rpm xvfb pulseaudio

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          # qtserialport: as on Windows (linuxdeploy carries every position
          # plugin, and fails on one whose library is missing).
          modules: qtwebengine qtwebchannel qtpositioning qthttpserver qtwebsockets qtserialport
          aqtversion: ">=3.2.1"
          cache: true

      - name: Configure
        run: cmake -S desktop-qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMICROTONE_UPDATE_CHANNEL=${{ env.UPDATE_CHANNEL }}

      - name: Build
        run: cmake --build build

      - name: Earlier app's projects
        continue-on-error: true
        run: |
          set +e
          node desktop-qt/tools/oldapp-test.js build/oldapp-dump | tee oldapp.txt
          status=${PIPESTATUS[0]}
          { echo "### Earlier app's projects (exit $status)"; echo '```'; cat oldapp.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Package
        run: |
          QMAKE="$QT_ROOT_DIR/bin/qmake" bash desktop-qt/tools/linux-package.sh build build/linux
          echo "version=$(node -p "require('./microtone-worker/package.json').version")" >> "$GITHUB_ENV"

      # A sound server with a null sink as the default output, as a desktop
      # has one; the AppImage unpacked and run (the runner has no FUSE).
      - name: Smoke test
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set +e
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=smoke
          pactl set-default-sink smoke
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            node desktop-qt/tools/native-smoke.js "build/linux/Microtone-$version-linux-x86_64.AppImage" --seconds 10 | tee smoke.json
          status=${PIPESTATUS[0]}
          { echo "### Linux smoke test, the AppImage (exit $status)"; echo '```json'; cat smoke.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Updater (AppImage)
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            node desktop-qt/tools/update-test.js "build/linux/Microtone-$version-linux-x86_64.AppImage" --mode appimage | tee update.json
          status=${PIPESTATUS[0]}
          { echo "### Linux updater, the AppImage (exit $status)"; echo '```json'; cat update.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The bare tree (no package's mark, not an AppImage) is a copy that
      # does not update itself.
      - name: Updater (bare tree)
        continue-on-error: true
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            node desktop-qt/tools/update-test.js build/linux/AppDir/usr/bin/microtone --mode notice | tee notice.json
          status=${PIPESTATUS[0]}
          { echo "### Linux bare tree told of an update (exit $status)"; echo '```json'; cat notice.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Installed by apt, then updated over itself at quit (sudo -n standing
      # in for the pkexec a person's copy asks).
      - name: Updater (.deb)
        continue-on-error: true
        run: |
          set +e
          sudo apt-get install -y "./build/linux/Microtone-$version-linux-amd64.deb"
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            node desktop-qt/tools/update-test.js /opt/microtone/bin/microtone --mode deb \
              --package "build/linux/Microtone-$version-linux-amd64.deb" | tee deb.json
          status=${PIPESTATUS[0]}
          { echo "### Linux updater, the .deb (exit $status)"; echo '```json'; cat deb.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: What the packages ask of the system
        run: |
          {
            echo "### .deb"; echo '```'; dpkg-deb -f "build/linux/Microtone-$version-linux-amd64.deb" Depends Installed-Size; echo '```'
            echo "### .rpm"; echo '```'; rpm -qpR "build/linux/Microtone-$version-linux-x86_64.rpm"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign the update
        if: needs.version.outputs.sign == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in "Microtone-$version-linux-x86_64.AppImage" "Microtone-$version-linux-amd64.deb" "Microtone-$version-linux-x86_64.rpm"; do
            npx --yes -p @tauri-apps/cli@2.12.1 tauri signer sign --app-version "$version" "build/linux/$f"
            build/minisign-check - "build/linux/$f" "build/linux/$f.sig"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Microtone-${{ env.version }}-linux
          path: |
            build/linux/Microtone-${{ env.version }}-linux-*
          if-no-files-found: error
          compression-level: 0  # all compressed already

  # The Linux packages on systems newer than the one that built them: Ubuntu
  # 24.04 (AppArmor's user namespace rule, the t64 libraries) and Fedora.
  linux-newer:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: Microtone-*-linux
          path: dist
          merge-multiple: true
      - name: Ubuntu 24.04
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set +e
          version=$(node -p "require('./microtone-worker/package.json').version")
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio "./dist/Microtone-$version-linux-amd64.deb"
          echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2> /dev/null)"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=smoke
          pactl set-default-sink smoke
          chmod +x "dist/Microtone-$version-linux-x86_64.AppImage"
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            node desktop-qt/tools/native-smoke.js "dist/Microtone-$version-linux-x86_64.AppImage" --seconds 5 > appimage.json
          a=$?
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            node desktop-qt/tools/native-smoke.js /opt/microtone/bin/microtone --seconds 5 --port 9340 > deb.json
          d=$?
          {
            echo "### Ubuntu 24.04: the AppImage (exit $a)"; echo '```json'; cat appimage.json; echo '```'
            echo "### Ubuntu 24.04: the .deb, installed by apt (exit $d)"; echo '```json'; cat deb.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ $a -eq 0 ] && [ $d -eq 0 ]
      # Natively on Wayland: a headless Weston and no X server at all, so the
      # AppImage must use Qt's Wayland platform (and its shell, EGL and
      # decoration helpers) or fail; the smoke test checks the platform the
      # log names.
      - name: Ubuntu 24.04, Wayland
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set +e
          version=$(node -p "require('./microtone-worker/package.json').version")
          sudo apt-get install -y weston
          export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/tmp/runtime-$(id -u)}
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-ci --idle-time=0 --width=1600 --height=1000 > weston.log 2>&1 &
          sleep 2
          env -u DISPLAY WAYLAND_DISPLAY=wayland-ci XDG_SESSION_TYPE=wayland \
            node desktop-qt/tools/native-smoke.js "dist/Microtone-$version-linux-x86_64.AppImage" --seconds 5 --port 9342 \
              --expect-platform wayland > wayland.json
          status=$?
          { echo "### Ubuntu 24.04: the AppImage on Wayland (Weston, no X server; exit $status)"; echo '```json'; cat wayland.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Fedora
        continue-on-error: true
        run: |
          set +e
          version=$(node -p "require('./microtone-worker/package.json').version")
          # Installed by dnf (its dependencies resolved from Fedora's own);
          # every program and library in the tree finds what it needs; it
          # starts (offscreen: there is no display).
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:42 sh -c \
            "dnf install -y /dist/Microtone-$version-linux-x86_64.rpm > /tmp/dnf.txt 2>&1 || { tail -20 /tmp/dnf.txt; exit 1; }; \
             missing=\$(find /opt/microtone -type f \( -name '*.so*' -o -path '*/bin/microtone' -o -name QtWebEngineProcess \) \
               -exec ldd {} \; 2> /dev/null | grep 'not found' | sort -u); \
             echo \"unresolved: \${missing:-none}\"; [ -z \"\$missing\" ] || exit 1; \
             QT_QPA_PLATFORM=offscreen /usr/bin/microtone --version" > fedora.txt 2>&1
          status=$?
          { echo "### Fedora 42: the .rpm installed by dnf, then run (exit $status)"; echo '```'; cat fedora.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # The preview channel: only by hand, only with publish-preview ticked.
  publish-preview:
    needs: [version, windows, macos, linux]
    if: github.event_name == 'workflow_dispatch' && inputs.publish-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          v="$VERSION"
          node desktop-qt/tools/release-manifest.js dist "$v" desktop-preview "A preview of the next Microtone desktop app."
          gh release delete desktop-preview --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2> /dev/null || true
          gh release create desktop-preview --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Microtone $v — desktop preview" \
            --notes "A preview of the next Microtone desktop app, for testing. Copies of it update from here." \
            "dist/Microtone-$v-windows-x64-setup.exe"{,.sig} "dist/Microtone-$v-macos.app.tar.gz"{,.sig} "dist/Microtone-$v-macos.dmg" \
            "dist/Microtone-$v-linux-x86_64.AppImage"{,.sig} "dist/Microtone-$v-linux-amd64.deb"{,.sig} \
            "dist/Microtone-$v-linux-x86_64.rpm"{,.sig} dist/desktop.json

  # The release: a push to master whose version has no release yet. A draft
  # first, published (as "latest") only once everything is on it, so no copy
  # sees half a release.
  release:
    needs: [version, windows, macos, linux]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The bridge for the Tauri build's copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tauri copies up to 5.0.5 read the latest release's latest.json:
          # v5.0.6's own brings them to the last Tauri build, which moves on
          # to this app through the site.
          gh release download v5.0.6 --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir bridge
          node -e '
            const m = JSON.parse(require("fs").readFileSync("bridge/latest.json", "utf8"));
            if (m.version !== "5.0.6") throw new Error(`the bridge is ${m.version}, not 5.0.6`);
            for (const [k, p] of Object.entries(m.platforms))
              if (!p.url || !p.signature) throw new Error(`${k} has no file or signature`);
            console.log("bridge: 5.0.6 for", Object.keys(m.platforms).join(", "));'
          cp bridge/latest.json dist/latest.json
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          v="$VERSION"
          node desktop-qt/tools/release-manifest.js dist "$v" "v$v" "Microtone $v. What changed: https://microtone.cc/docs.html#patchnotes"
          # A draft left by a failed run is started afresh.
          gh release delete "v$v" --repo "$GITHUB_REPOSITORY" --yes 2> /dev/null || true
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Microtone $v" \
            --notes "Microtone $v for Windows (installer), macOS 13 and later (.dmg) and Linux (AppImage, .deb, .rpm). Installed copies update themselves. What changed: https://microtone.cc/docs.html#patchnotes" \
            "dist/Microtone-$v-windows-x64-setup.exe"{,.sig} "dist/Microtone-$v-macos.app.tar.gz"{,.sig} "dist/Microtone-$v-macos.dmg" \
            "dist/Microtone-$v-linux-x86_64.AppImage"{,.sig} "dist/Microtone-$v-linux-amd64.deb"{,.sig} \
            "dist/Microtone-$v-linux-x86_64.rpm"{,.sig} dist/desktop.json dist/latest.json
          gh release edit "v$v" --repo "$GITHUB_REPOSITORY" --draft=false --latest
